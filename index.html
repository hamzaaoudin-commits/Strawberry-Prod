.bg-rev{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;}
.bg-rev label{display:block;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;}
.bg-rev-in{display:flex;align-items:center;gap:10px;}
.bg-rev-in input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
  color:var(--ink);font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(24px,5vw,32px);outline:none;transition:border-color .18s;}
.bg-rev-in input:focus{border-color:var(--accent);}
.bg-rev-in span{font-family:'Playfair Display',serif;font-size:26px;color:var(--ink-faint);}
.bg-empty{font-family:'Playfair Display',serif;font-style:italic;color:var(--ink-faint);font-size:15px;padding:18px 2px;}
.bg-head{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.bg-head-i{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:13px 15px;}
.bg-head-i span{display:block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px;}
.bg-head-i b{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(17px,3.4vw,22px);color:var(--ink);}
.bg-head-i.neg b{color:#ff8a94;}
.bg-warn{font-size:12.5px;color:#F59E0B;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.28);border-radius:9px;padding:11px 14px;margin-bottom:12px;}
.bg-info{font-size:12.5px;color:var(--ink-dim);background:var(--glass-soft);border:1px solid var(--glass-border);border-left:3px solid var(--good);border-radius:0 9px 9px 0;padding:11px 14px;margin-bottom:12px;line-height:1.5;}
.bg-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:9px;}
.bg-item.over{border-color:rgba(245,158,11,.45);}
.bg-item-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
.bg-item-l b{display:block;font-size:15px;color:var(--ink);}
.bg-item-l span{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.bg-item-m{flex:none;text-align:right;font-family:'Playfair Display',serif;font-weight:700;font-size:19px;color:var(--accent);}
.bg-item-m small{display:block;font-family:'DM Mono',monospace;font-size:10px;font-weight:400;color:var(--ink-faint);margin-top:2px;}
.bg-item.over .bg-item-m{color:#F59E0B;}
.bg-item-bar{height:4px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:11px;}
.bg-item-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s;}
.bg-item.over .bg-item-bar i{background:#F59E0B;}
.bg-item-f{display:flex;gap:14px;align-items:flex-end;}
.bg-slide{flex:1;min-width:0;}
.bg-dep{flex:0 0 118px;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);}
.bg-dep input{width:100%;margin-top:5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);font-family:'DM Mono',monospace;font-size:13px;outline:none;}
.bg-dep input:focus{border-color:var(--accent);}

/* ===== Conclusion du bilan ===== */
.pl-concl{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);padding:22px 24px;margin-top:26px;}
.pl-concl.vide{font-family:'Playfair Display',serif;font-style:italic;color:var(--ink-faint);font-size:14px;border-left-color:var(--line);}
.pl-concl-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px;}
.pl-concl-t{font-family:'Playfair Display',serif;font-weight:600;font-size:22px;color:var(--ink);}
.pl-concl-s{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-faint);margin-top:4px;}
.pl-concl-n{font-family:'Playfair Display',serif;font-weight:700;font-size:34px;line-height:1;flex:none;}
.pl-concl-n small{font-size:14px;color:var(--ink-faint);}
.pl-concl-i{font-family:'Playfair Display',serif;font-size:15.5px;line-height:1.65;color:var(--ink-dim);margin:0 0 6px;}
.pl-piste{background:var(--glass-soft);border:1px solid var(--glass-border);border-radius:10px;padding:13px 15px;margin-bottom:8px;}
.pl-piste b{display:block;font-size:14px;color:var(--ink);margin-bottom:4px;}
.pl-piste span{font-size:13px;color:var(--ink-dim);line-height:1.55;}

/* ===== Pied de page ===== */
.foot-links{margin-top:12px;}
.foot-links button{background:none;border:none;color:var(--ink-faint);font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:6px;transition:color .18s;}
.foot-links button:hover{color:var(--gold);}

/* regroupement du calendrier */
.cal-n{font-family:'DM Mono',monospace;font-size:9px;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;}
.cal-fold{border:1px solid var(--line);border-radius:11px;margin-top:14px;background:var(--glass-soft);}
.cal-fold summary{cursor:pointer;padding:14px 16px;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);list-style:none;}
.cal-fold summary::-webkit-details-marker{display:none;}
.cal-fold summary::before{content:'▸';display:inline-block;margin-right:9px;color:var(--accent);transition:transform .2s;}
.cal-fold[open] summary::before{transform:rotate(90deg);}
.cal-fold[open] summary{border-bottom:1px solid var(--line-soft);margin-bottom:10px;}
.cal-fold .cal-card{margin:0 12px 8px;}
.cal-fold.pass{opacity:.55;}

/* charges fixes */
.bg-charges{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.bg-ch{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.bg-ch-l{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:13.5px;outline:none;}
.bg-ch-l:focus{border-color:var(--accent);}
.bg-ch-m{flex:0 0 96px;display:flex;align-items:center;gap:5px;}
.bg-ch-m input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font-family:'DM Mono',monospace;font-size:13px;text-align:right;outline:none;}
.bg-ch-m input:focus{border-color:var(--accent);}
.bg-ch-m span{color:var(--ink-faint);font-size:12px;}

/* titre compact de MÉRIDIEN (affiché comme onglet) */
.m-title{font-family:'Playfair Display',serif;font-weight:700;font-size:24px;color:var(--gold);letter-spacing:.04em;margin:6px 0 18px;}
.m-title span{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:400;margin-top:5px;}

/* ===== Note ouverte : contour à la couleur de son dossier ===== */
.note-full{border-color:color-mix(in srgb,var(--nc,var(--gold)) 45%,var(--line)) !important;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--nc,var(--gold)) 18%,transparent), var(--elev);}
.note-body:focus{border-color:var(--nc,var(--gold)) !important;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--nc,var(--gold)) 16%,transparent);}
.note-title,.note-body{caret-color:var(--nc,var(--gold));}

/* ===== Boutons d'ajout : discrets, sans pointillés ===== */
.edit-add{width:100%;text-align:left;font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:.04em;
  color:var(--ink-faint);background:transparent;border:none;border-top:1px solid var(--line-soft);
  border-radius:0;padding:13px 2px;cursor:pointer;transition:color .18s,border-color .18s;}
.edit-add:hover{color:var(--accent,var(--gold));border-top-color:var(--line);background:transparent;}
.edit-add.sm{padding:11px 2px;font-size:11px;}
.edit-add.bloque{color:var(--ink-faint) !important;opacity:.5;cursor:not-allowed;background:transparent !important;border:none !important;border-top:1px solid var(--line-soft) !important;}
.edit-add.tangerine:hover{color:var(--cat,var(--tangerine)) !important;background:transparent !important;border-color:var(--line) !important;}
.obj-count.fini{color:var(--good);}

/* ===== Manifeste en cartes ===== */
.mf-dots{display:flex;gap:6px;justify-content:center;margin:6px 0 16px;flex-wrap:wrap;}
.mf-dot{width:8px;height:8px;border-radius:50%;border:none;background:var(--line);cursor:pointer;padding:0;transition:all .18s;}
.mf-dot:hover{background:var(--ink-faint);transform:scale(1.25);}
.mf-dot.on{background:var(--accent);width:22px;border-radius:4px;}
.mf-card{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:26px 28px;min-height:280px;animation:modalIn .22s ease;}
.mf-card .mf-h{margin-bottom:16px;}
.mf-card p{padding-left:0;font-size:16.5px;line-height:1.8;}
.mf-card .mf-li{padding-left:0;}
.mf-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;}
.mf-pos{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-faint);letter-spacing:.08em;}
.mf-nav button:disabled{opacity:.3;cursor:default;}

/* ===== Écart avant le dernier registre ===== */
.rail-gap{height:22px;flex:0 0 22px;}

/* ===== Budget : cercle de répartition ===== */
.bg-top{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:12px;}
.bg-donut{flex:none;}
.dn{width:180px;height:180px;display:block;}
.dn-seg{transition:stroke-dasharray .5s cubic-bezier(.2,.7,.2,1), stroke-dashoffset .5s cubic-bezier(.2,.7,.2,1);}
.dn-t{fill:var(--ink);font-family:'Playfair Display',serif;font-weight:700;font-size:22px;text-anchor:middle;}
.dn-s{fill:var(--ink-faint);font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.14em;text-anchor:middle;}
.bg-leg{flex:1;min-width:200px;display:flex;flex-direction:column;gap:9px;}
.bg-lg{display:flex;align-items:center;gap:11px;}
.bg-lg-d{width:10px;height:10px;border-radius:3px;flex:none;}
.bg-lg-l{flex:1;min-width:0;font-size:14px;color:var(--ink);}
.bg-lg-l small{display:block;font-size:11px;color:var(--ink-faint);margin-top:1px;}
.bg-lg-v{font-family:'DM Mono',monospace;font-size:14px;color:var(--ink);flex:none;}
.bg-item .sn-range{margin-top:6px;}

/* ===== Recherche dans les notes ===== */
.nb-search{position:relative;margin-bottom:14px;}
.nb-search input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:11px 38px 11px 14px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;
  transition:border-color .18s;-webkit-appearance:none;}
.nb-search input:focus{border-color:var(--accent);}
.nb-search input::-webkit-search-cancel-button{display:none;}
.nb-qx{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:var(--ink-faint);font-size:18px;cursor:pointer;padding:0 6px;opacity:.5;transition:opacity .15s;}
.nb-qx:hover{opacity:1;color:var(--accent);}
mark{background:color-mix(in srgb,var(--accent) 34%,transparent);color:var(--ink);border-radius:3px;padding:0 2px;}

/* ===== Planning : blocs tirés d'un objectif ===== */
.pn-row.lie{border-left-color:var(--gold);}
.pn-lien{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:999px;
  padding:1px 6px;margin-left:7px;vertical-align:middle;}
.pk-i{font-size:13px;color:var(--ink-dim);line-height:1.55;margin:0 0 14px;}
.pk-list{display:flex;flex-direction:column;gap:7px;max-height:44vh;overflow:auto;margin-bottom:16px;}
.pk-it{display:flex;align-items:flex-start;gap:11px;text-align:left;background:var(--glass-soft);
  border:1px solid var(--glass-border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .16s;}
.pk-it:hover{border-color:var(--accent);background:var(--paper-2);transform:translateX(2px);}
.pk-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:5px;}
.pk-l{flex:1;min-width:0;}
.pk-l b{display:block;font-size:14px;color:var(--ink);font-weight:500;line-height:1.35;}
.pk-l small{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-faint);margin-top:3px;}

/* ===== Fin de phase ===== */
.ph-desc{display:block;font-size:12px;color:var(--ink-faint);line-height:1.45;margin-top:6px;max-width:52ch;}
.phase-head.objvie .ph-left{flex:1;min-width:0;}
.modal.ov-menu{max-width:520px;}
.ov-homme-card{background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:18px 20px;margin-bottom:24px;}
.ov-homme-l{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin-bottom:9px;}
.ov-homme-card p{font-family:'Playfair Display',serif;font-size:14.5px;line-height:1.65;color:var(--ink-dim);margin:0;}
.ov-row{display:flex;gap:16px;align-items:flex-start;padding:16px 4px;border-bottom:1px solid var(--line-soft);}
.ov-row:last-of-type{border-bottom:none;}
.ov-row-n{flex:none;font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);padding-top:2px;
  font-variant-numeric:tabular-nums;}
.ov-row-m{flex:1;min-width:0;}
.ov-row-m b{display:block;font-family:'Playfair Display',serif;font-weight:700;font-size:16px;color:var(--ink);
  letter-spacing:.04em;margin-bottom:6px;}
.ov-row-m p{font-size:13.5px;line-height:1.6;color:var(--ink-dim);margin:0;}
.ov-homme{font-family:'Playfair Display',serif;font-style:italic;font-size:13.5px;color:var(--ink-dim);
  line-height:1.6;margin:0 0 18px;padding-left:12px;border-left:2px solid var(--gold);}
.ov-list{max-height:52vh;overflow-y:auto;}
.pm-btn.ov-item{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:12px 13px;}
.pm-btn.ov-item.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);}
.ov-n{flex:none;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-weight:700;font-size:12px;color:var(--gold);
  background:color-mix(in srgb,var(--gold) 14%,transparent);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);}
.ov-m{flex:1;min-width:0;}
.ov-m b{display:block;font-size:13px;color:var(--ink);letter-spacing:.03em;}
.ov-m small{display:block;font-size:11.5px;color:var(--ink-faint);line-height:1.45;margin-top:4px;}

.phase-clore{background:linear-gradient(135deg,rgba(63,185,80,.10),transparent);
  border:1px solid rgba(63,185,80,.32);border-radius:var(--radius);padding:20px 22px;margin-top:16px;}
.pcl-t{font-family:'Playfair Display',serif;font-weight:600;font-size:19px;color:var(--good);margin-bottom:7px;}
.phase-clore p{font-size:13.5px;color:var(--ink-dim);line-height:1.6;margin:0 0 14px;}
.modal.cloture{max-width:520px;}
.cl-i{font-size:12.5px;color:var(--ink-faint);line-height:1.55;margin:0 0 10px;}
.cl-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;max-height:30vh;overflow:auto;}
.cl-ok{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;color:var(--ink-dim);
  background:rgba(63,185,80,.07);border-radius:8px;padding:9px 12px;}
.cl-ok span{color:var(--good);flex:none;}
.cl-rep{display:flex;align-items:center;gap:10px;background:var(--glass-soft);border:1px solid var(--glass-border);
  border-radius:8px;padding:10px 12px;cursor:pointer;font-size:13.5px;color:var(--ink-dim);}
.cl-rep input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer;flex:none;margin:0;}

/* ===== Rendez-vous du jour, en tête du Socle ===== */
.rdv-jour{background:linear-gradient(135deg,color-mix(in srgb,var(--petrol) 13%,transparent),transparent);
  border:1px solid color-mix(in srgb,var(--petrol) 32%,transparent);border-left:3px solid var(--petrol);
  border-radius:var(--radius);padding:15px 18px;margin-bottom:18px;cursor:pointer;
  transition:transform .16s,border-color .16s;}
.bilan-jour{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 13%,transparent),transparent);
  border-color:color-mix(in srgb,var(--gold) 32%,transparent);border-left-color:var(--gold);}
.bilan-jour .rj-pt{background:var(--gold);}
.stop-travail-jour{background:linear-gradient(135deg,color-mix(in srgb,#E63946 13%,transparent),transparent);
  border-color:color-mix(in srgb,#E63946 32%,transparent);border-left-color:#E63946;cursor:default;}
.stop-travail-jour .rj-pt{background:#E63946;}
.stw-actions{margin-top:10px;}
.bs-teaser{font-size:13px;color:var(--ink-dim);line-height:1.5;}
.modal.bilan{max-width:460px;}
.bs-pos{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--ink-faint);letter-spacing:.08em;margin-bottom:14px;}
.bs-q{font-family:'Playfair Display',serif;font-size:19px;line-height:1.5;color:var(--ink);margin-bottom:22px;}
.bs-btns{display:flex;gap:10px;}
.bs-btns .qz-b{flex:1;}
.bs-advice{margin-top:18px;max-height:34vh;overflow-y:auto;}
.bs-advice .sn-adv{margin-bottom:12px;}
.bs-topics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.bs-topic{padding:13px 10px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass-soft);
  color:var(--ink);font-family:'DM Sans',sans-serif;font-size:13.5px;cursor:pointer;transition:all .16s;}
.bs-topic:hover{border-color:var(--gold);transform:translateY(-1px);}
.rdv-jour:hover{transform:translateX(3px);border-color:color-mix(in srgb,var(--petrol) 55%,transparent);}
.rdv-jour:focus-visible{outline:2px solid var(--petrol);outline-offset:2px;}
.rj-h{display:flex;align-items:center;gap:9px;font-family:'DM Mono',monospace;font-size:9.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--petrol);margin-bottom:11px;}
.rj-pt{width:7px;height:7px;border-radius:50%;background:var(--petrol);flex:none;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--petrol) 70%,transparent);animation:rjPulse 2.4s ease-out infinite;}
@keyframes rjPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--petrol) 55%,transparent);}
  70%{box-shadow:0 0 0 9px transparent;}100%{box-shadow:0 0 0 0 transparent;}}
.rj-l{display:flex;align-items:center;gap:10px;padding:6px 0;flex-wrap:wrap;}
.rj-l + .rj-l{border-top:1px solid var(--line-soft);}
.rj-check{flex:none;width:20px;height:20px;border-radius:6px;}
.rj-t{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--petrol);flex:none;min-width:44px;}
.rj-n{font-size:14.5px;color:var(--ink);flex:1;min-width:0;}
.rj-o{font-size:12px;color:var(--ink-faint);}

/* ===== Déplacer un objectif ===== */
/* ===== Glisser-déposer par appui long ===== */
.item-del-wrap{touch-action:pan-y;}
.item-del-wrap .row{transition:transform .15s,box-shadow .2s;}
.item-del-wrap .row.dragging{transform:scale(1.03);box-shadow:0 18px 40px -14px rgba(0,0,0,.7);
  border-color:var(--accent,var(--gold)) !important;}
.item-drag-slot{border:1.5px dashed color-mix(in srgb,var(--accent,var(--gold)) 45%,transparent);
  border-radius:var(--radius,10px);margin-bottom:8px;opacity:.6;}

/* ===== Mini-tâches terminées ===== */
.mini-faites{margin:4px 0 8px;}
.mini-faites summary{cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);padding:9px 2px;list-style:none;opacity:.7;}
.mini-faites summary::-webkit-details-marker{display:none;}
.mini-faites summary::before{content:'▸';margin-right:8px;display:inline-block;transition:transform .2s;}
.mini-faites[open] summary::before{transform:rotate(90deg);}
.mini-faites .row{opacity:.45;}

/* ===== Rendez-vous toute la journée ===== */
.cal-hour.jour{color:var(--ink-dim);background:var(--glass-soft);border-color:var(--glass-border);font-size:10px;}

/* ===== Code de la route ===== */
.cd-th{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:11px 14px;margin-bottom:7px;transition:border-color .15s;}
.cd-th.ok{border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.05);}
.cd-box{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--bg);
  color:var(--good);font-size:13px;line-height:1;cursor:pointer;flex:none;transition:all .15s;padding:0;}
.cd-box:hover{border-color:var(--good);}
.cd-th.ok .cd-box{background:rgba(63,185,80,.16);border-color:var(--good);}
.cd-main{flex:1;min-width:0;display:flex;align-items:baseline;gap:11px;}
.cd-n{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-faint);flex:none;}
.cd-l{font-size:14px;color:var(--ink);line-height:1.35;}
.cd-th.ok .cd-l{color:var(--ink-dim);}
.cd-note-b{background:none;border:none;color:var(--ink-faint);font-size:13px;cursor:pointer;padding:2px 6px;
  opacity:.5;flex:none;transition:opacity .15s,color .15s;}
.cd-note-b:hover{opacity:1;color:var(--accent);}
.cd-note{font-size:12.5px;color:var(--ink-dim);line-height:1.55;background:var(--glass-soft);
  border-left:2px solid var(--accent);border-radius:0 8px 8px 0;padding:9px 13px;margin:-3px 0 9px 36px;}

/* ===== Batch-cooking ===== */
/* ===== Pomodoro ===== */
.pomo-phase{text-align:center;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:18px;}
.pomo-ring{position:relative;width:180px;height:180px;margin:0 auto 22px;}
.pomo-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.pomo-bg{fill:none;stroke:rgba(255,255,255,.07);stroke-width:8;}
.pomo-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;
  filter:drop-shadow(0 0 6px var(--accent));transition:stroke-dasharray 1s linear;}
.pomo-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-weight:700;font-size:32px;color:var(--ink);}
.pomo-btns{display:flex;gap:10px;justify-content:center;margin-bottom:14px;}
.pomo-cycles{text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-faint);margin-bottom:22px;}
.pomo-durs{display:flex;gap:10px;}
.pomo-durs label{flex:1;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);}
.pomo-durs input{width:100%;margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:9px 10px;color:var(--ink);font-family:'DM Mono',monospace;font-size:14px;text-align:center;outline:none;}
.pomo-durs input:focus{border-color:var(--accent);}

/* ===== Cardio ===== */
.cr-sem{margin-bottom:22px;}
.cr-sem-t{font-family:'Playfair Display',serif;font-weight:600;font-size:17px;color:var(--ink);margin-bottom:11px;}
.cr-sc{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);
  border-radius:11px;padding:13px 15px;margin-bottom:7px;}
.cr-sc.ok{border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.05);}
.cr-sc-m{flex:1;min-width:0;}
.cr-sc-m b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:5px;}
.cr-sc-m ul{margin:0;padding-left:16px;}
.cr-sc-m li{font-size:13px;color:var(--ink-dim);line-height:1.6;}
.cr-sc.ok .cr-sc-m b{color:var(--ink-dim);}
.cr-note{font-family:'Playfair Display',serif;font-style:italic;font-size:13.5px;color:var(--accent);
  padding:4px 2px;}
.cr-rules{margin:0;padding-left:18px;}
.cr-rules li{font-size:13.5px;color:var(--ink-dim);line-height:1.65;margin-bottom:7px;}
.cr-week{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;}
.cr-day{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
.cr-day b{display:block;font-size:12.5px;color:var(--ink);}
.cr-day span{display:block;font-size:12px;color:var(--ink-faint);margin-top:3px;}

/* ===== Dressing ===== */
.dr-t{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,transparent),transparent);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;}
.dr-t-h{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent);margin-bottom:12px;}
.dr-t-l{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.dr-t-v{font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:var(--ink-faint);margin-bottom:4px;}
.dr-chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);
  background:var(--glass-soft);border:1px solid var(--glass-border);border-radius:999px;padding:7px 14px;}
.dr-chip::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--dc);flex:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.16);}
.dr-cat{margin-bottom:18px;}
.dr-cat-h{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:9px;}
.dr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;}
.dr-it{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;cursor:pointer;transition:all .16s;}
.dr-it:hover{border-color:var(--ink-faint);transform:translateY(-1px);}
.dr-it.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--paper));
  box-shadow:0 6px 18px -10px var(--accent);}
.dr-dot{width:12px;height:12px;border-radius:50%;background:var(--dc);flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18);}
.dr-l{flex:1;min-width:0;font-size:13.5px;color:var(--ink);line-height:1.3;}
.dr-cols{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.dr-col{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;
  box-shadow:0 0 0 1px rgba(255,255,255,.2);transition:transform .15s;}
.dr-col:hover{transform:scale(1.12);}
.dr-col.on{border-color:var(--gold);transform:scale(1.12);}

/* ===== Repère médical ===== */
.sn-quand{font-size:12px;color:var(--ink-faint);font-style:italic;line-height:1.5;margin:10px 0 0;
  padding-top:9px;border-top:1px solid var(--line-soft);}

/* ===== Code : navigation, fiche, quiz ===== */
.cd-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
.cd-nav.bas{margin:18px 0 0;}
.cd-pos{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-faint);letter-spacing:.08em;}
.cd-go{flex:none;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.04em;background:none;
  border:1px solid var(--glass-border);border-radius:999px;padding:6px 12px;color:var(--ink-faint);cursor:pointer;transition:all .16s;}
.cd-go:hover{color:var(--accent);border-color:var(--accent);}
.cd-main{cursor:pointer;}
.cd-score{flex:none;font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-faint);
  border:1px solid var(--line);border-radius:999px;padding:3px 9px;}
.cd-score.moy{color:#F59E0B;border-color:rgba(245,158,11,.4);}
.cd-score.bon{color:var(--good);border-color:rgba(63,185,80,.4);}

.cd-fiche{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:24px 26px;}
.cd-f-h{display:flex;align-items:baseline;gap:14px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line);}
.cd-f-n{font-family:'Playfair Display',serif;font-weight:700;font-size:26px;color:var(--accent);line-height:1;}
.cd-f-h h3{font-family:'Playfair Display',serif;font-weight:600;font-size:21px;margin:0;color:var(--ink);line-height:1.25;}
.cd-sec{margin-bottom:20px;}
.cd-sec:last-child{margin-bottom:0;}
.cd-sec h4{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin:0 0 9px;}
.cd-sec ul{margin:0;padding-left:17px;}
.cd-sec li{font-size:14px;color:var(--ink-dim);line-height:1.7;margin-bottom:6px;}
.cd-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px;}
.cd-actions button{flex:1 1 auto;}

.qz-bar{height:4px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:18px;}
.qz-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s;}
.qz-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px;}
.qz-th{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:14px;}
.qz-q{font-family:'Playfair Display',serif;font-size:20px;line-height:1.5;color:var(--ink);margin-bottom:22px;}
.qz-btns{display:flex;gap:10px;}
.qz-b{flex:1;padding:15px;border-radius:11px;border:1px solid var(--glass-border);background:var(--glass-soft);
  color:var(--ink);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .16s;}
.qz-b:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px);}
.qz-b:disabled{cursor:default;}
.qz-b.bon{background:rgba(63,185,80,.16);border-color:var(--good);color:var(--good);}
.qz-b.faux{background:rgba(230,57,70,.14);border-color:var(--gold);color:#ff8a94;}
.qz-exp{margin-top:18px;padding:15px 17px;border-radius:11px;border:1px solid var(--line);background:var(--glass-soft);}
.qz-exp.ok{border-color:rgba(63,185,80,.32);background:rgba(63,185,80,.06);}
.qz-exp.ko{border-color:rgba(230,57,70,.32);background:rgba(230,57,70,.06);}
.qz-exp b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:6px;}
.qz-exp span{font-size:13.5px;color:var(--ink-dim);line-height:1.6;}
.qz-card .modal-btn{margin-top:16px;width:100%;}

.qz-res{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:28px 24px;text-align:center;margin-bottom:8px;}
.qz-score{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(44px,9vw,62px);line-height:1;}
.qz-score small{font-size:22px;color:var(--ink-faint);}
.qz-pct{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.14em;color:var(--ink-faint);margin-top:8px;}
.qz-verdict{font-family:'Playfair Display',serif;font-size:16px;line-height:1.6;color:var(--ink-dim);margin:16px 0 0;}
.qz-rate{background:var(--paper);border:1px solid var(--line);border-left:3px solid #F59E0B;border-radius:10px;
  padding:14px 16px;margin-bottom:8px;}
.qz-rate b{display:block;font-size:14px;color:var(--ink);line-height:1.45;margin-bottom:6px;font-weight:500;}
.qz-rate-r{display:block;font-family:'DM Mono',monospace;font-size:11px;color:#F59E0B;margin-bottom:5px;}
.qz-rate span{font-size:13px;color:var(--ink-dim);line-height:1.55;}
.cd-l small{display:block;font-family:'DM Mono',monospace;font-size:9.5px;color:var(--ink-faint);margin-top:3px;}

/* ===== Examen blanc ===== */
.cd-exam{background:linear-gradient(150deg,color-mix(in srgb,var(--gold) 14%,transparent),transparent 70%);
  border:1px solid color-mix(in srgb,var(--gold) 34%,transparent);border-radius:var(--radius);
  padding:20px 22px;margin:18px 0 22px;}
.cd-exam-h{display:flex;align-items:flex-start;gap:13px;margin-bottom:14px;}
.cd-exam-ic{font-size:26px;flex:none;line-height:1;}
.cd-exam-h b{display:block;font-family:'Playfair Display',serif;font-weight:700;font-size:17px;color:var(--ink);}
.cd-exam-h small{display:block;font-size:12.5px;color:var(--ink-dim);line-height:1.5;margin-top:4px;}
.cd-exam-stats{display:flex;gap:16px;flex-wrap:wrap;font-family:'DM Mono',monospace;font-size:11px;
  color:var(--ink-faint);margin-bottom:14px;}
.qz-res.exam.admis{border-color:rgba(63,185,80,.4);}
.cd-exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.cd-exam-item{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 10px;
  cursor:pointer;text-align:left;transition:all .15s;}
.cd-exam-item:hover{border-color:var(--gold);transform:translateY(-1px);}
.cd-exam-n{display:block;font-family:'Playfair Display',serif;font-weight:600;font-size:13px;color:var(--ink);}
.cd-exam-sc{display:block;font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-faint);margin-top:4px;}
.cd-exam-item.reussi{border-color:rgba(63,185,80,.4);}
.cd-exam-item.reussi .cd-exam-sc{color:var(--good);}
.cd-exam-item.tente .cd-exam-sc{color:#F59E0B;}
/* ===== Conseiller patrimoine ===== */
.bg-fields{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.bg-fields label{flex:1;min-width:150px;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-faint);}
.bg-fields label .numfield{margin-top:7px;}
.bg-fields input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:9px 10px;color:var(--ink);font-family:'DM Mono',monospace;font-size:14px;outline:none;}
.bg-fields input:focus{border-color:var(--accent,var(--gold));}
.patri-profils{display:flex;gap:8px;margin-bottom:16px;}
.patri-profils .pm-btn.on{background:var(--accent,var(--gold));color:#fff;border-color:var(--accent,var(--gold));}
.patri-result{border-top:1px solid var(--line);padding-top:14px;margin-top:4px;}
.patri-bars{display:flex;flex-direction:column;gap:8px;}
/* ===== Divertissement ===== */
.cs-hero{position:relative;overflow:hidden;border-radius:16px;padding:26px 26px 22px;margin-bottom:22px;
  background:radial-gradient(circle at 12% 0%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 62%),
    linear-gradient(160deg,#0d0d0f,#0a0a0a 75%);
  border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);}
.cs-hero-l{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);margin-bottom:11px;}
.cs-hero h3{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(20px,4vw,26px);
  color:var(--ink);margin:0 0 10px;line-height:1.25;}
.cs-hero p{font-size:13.5px;line-height:1.6;color:var(--ink-dim);margin:0 0 20px;max-width:56ch;}
.cs-hero-stats{display:flex;gap:26px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;}
.cs-stat b{display:block;font-family:'Playfair Display',serif;font-weight:700;font-size:24px;color:var(--accent);}
.cs-stat b.ko{color:#ff8a94;}
.cs-stat b small{font-size:13px;color:var(--ink-faint);font-weight:400;}
.cs-stat span{display:block;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-faint);margin-top:4px;}

.cs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:22px;}
.cs-bloc{background:linear-gradient(160deg,var(--paper),#0c0c0e);border:1px solid var(--line);
  border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;transition:border-color .2s;}
.cs-bloc.plein{border-color:rgba(63,185,80,.38);}
.cs-h{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.cs-ring{position:relative;flex:none;width:46px;height:46px;}
.cs-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.cs-ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3;}
.cs-ring-fg{fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dasharray .5s;}
.cs-ring em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;
  font-family:'DM Mono',monospace;font-size:12px;color:var(--ink);font-weight:600;}
.cs-ring em small{font-size:9px;color:var(--ink-faint);font-weight:400;}
.cs-h-l b{display:block;font-family:'Playfair Display',serif;font-size:16px;color:var(--ink);}
.cs-h-l small{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-faint);margin-top:3px;}
.cs-bloc.plein .cs-h-l small{color:var(--good);}
.cs-items{flex:1;display:flex;flex-direction:column;gap:11px;}
/* chaque média a sa couleur : bleu films, violet séries, rose YouTube */
.cs-bloc{border-color:color-mix(in srgb,var(--media,var(--accent)) 26%,var(--line));}
.cs-bloc .cs-h-l b{color:var(--media,var(--ink));}
.cs-line{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;
  background:var(--bg);border:1px solid var(--line);transition:all .16s;}
.cs-line:hover{border-color:color-mix(in srgb,var(--media,var(--accent)) 45%,var(--line));}
.cs-line.vu{border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.05);}
.cs-rond{flex:none;width:20px;height:20px;border-radius:50%;padding:0;cursor:pointer;
  border:2px solid var(--line);background:transparent;transition:all .18s;}
.cs-rond:hover{border-color:var(--media,var(--accent));transform:scale(1.12);}
.cs-line.vu .cs-rond{background:var(--media,var(--accent));border-color:var(--media,var(--accent));
  box-shadow:0 0 10px -1px var(--media,var(--accent));}
.cs-line-t{flex:1;min-width:0;font-size:14px;color:var(--ink);line-height:1.4;}
.cs-line.vu .cs-line-t{color:var(--ink-dim);text-decoration:line-through;}

.cs-item{position:relative;border-radius:14px;overflow:hidden;padding:18px 18px 15px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--media,var(--accent)) 24%,#0d0d0f),#0b0b0d 62%);
  border:1px solid color-mix(in srgb,var(--media,var(--accent)) 32%,transparent);
  transition:border-color .2s,transform .16s,box-shadow .2s;}
.cs-item::after{content:'';position:absolute;right:-32px;top:-32px;width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--media,var(--accent)) 28%,transparent),transparent 70%);
  pointer-events:none;transition:background .3s;}
.cs-item:hover{transform:translateY(-1px);box-shadow:0 18px 42px -30px var(--accent);}
.cs-item.noted{background:linear-gradient(150deg,rgba(63,185,80,.2),#0b0b0d 62%);
  border-color:rgba(63,185,80,.38);}
.cs-item.noted::after{background:radial-gradient(circle,rgba(63,185,80,.26),transparent 70%);}
.cs-item.noted:hover{box-shadow:0 18px 42px -30px var(--good);}
.cs-item-h{position:relative;display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.cs-badge{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.75);
  white-space:nowrap;}
.cs-badge.ok{border-color:var(--good);color:var(--good);}
.cs-badge-n{opacity:.55;}
.cs-rm{margin-left:auto;flex:none;width:24px;height:24px;border-radius:7px;border:none;background:none;
  color:rgba(255,255,255,.45);font-size:17px;line-height:1;cursor:pointer;padding:0;transition:all .15s;}
.cs-rm:hover{color:#ff8a94;background:rgba(230,57,70,.12);}
.cs-titre{position:relative;font-family:'Playfair Display',serif;font-weight:800;font-size:23px;
  line-height:1.15;letter-spacing:-.01em;color:#fff;margin-bottom:13px;}
.cs-note{position:relative;width:100%;background:transparent;border:none;border-top:1px solid rgba(255,255,255,.13);
  border-radius:0;padding:12px 0 0;color:rgba(255,255,255,.74);font-family:'DM Sans',sans-serif;
  font-size:13.5px;line-height:1.65;resize:none;overflow:hidden;outline:none;min-height:34px;
  transition:border-color .18s,color .18s;}
.cs-note::placeholder{color:rgba(255,255,255,.36);font-style:italic;}
.cs-note:focus{border-top-color:var(--accent);color:#fff;}
.cs-item.noted .cs-note:focus{border-top-color:var(--good);}
.cs-add{width:100%;margin-top:12px;background:var(--glass-soft);border:1px solid var(--line);border-radius:10px;
  padding:11px;color:var(--ink-faint);font-family:'DM Mono',monospace;font-size:11.5px;cursor:pointer;
  transition:all .16s;}
.cs-add:hover{border-color:var(--media,var(--accent));color:var(--media,var(--accent));background:var(--bg);}
.cs-ferme{margin-top:12px;font-family:'Playfair Display',serif;font-style:italic;font-size:13.5px;
  color:var(--good);background:rgba(63,185,80,.07);border:1px solid rgba(63,185,80,.22);
  border-radius:10px;padding:11px 14px;text-align:center;}

.cs-ecran{background:linear-gradient(160deg,var(--paper),#0c0c0e);border:1px solid var(--line);
  border-radius:14px;padding:20px 22px;transition:border-color .2s;}
.cs-ecran.depasse{border-color:rgba(230,57,70,.42);box-shadow:0 18px 46px -34px #E63946;}
.cs-ecran-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
.cs-ecran-h b{display:block;font-family:'Playfair Display',serif;font-size:17px;color:var(--ink);}
.cs-ecran-h small{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-faint);margin-top:4px;}
.cs-ecran-in{display:flex;align-items:baseline;gap:7px;}
.cs-ecran-in input{width:92px;background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;color:var(--ink);font-family:'DM Mono',monospace;font-size:18px;text-align:right;outline:none;}
.cs-ecran-in input:focus{border-color:var(--accent);}
.cs-ecran-in span{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-faint);}
.cs-ecran-bar{height:8px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;}
.cs-ecran-bar i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .5s;}
.cs-ecran.depasse .cs-ecran-bar i{background:linear-gradient(90deg,#E63946,#ff8a94);box-shadow:0 0 12px -2px #E63946;}
.cs-alerte{margin-top:18px;border-left:3px solid #ff8a94;padding:3px 0 3px 15px;animation:modalIn .25s ease;}
.cs-alerte b{display:block;font-family:'Playfair Display',serif;font-size:16.5px;color:#ff8a94;margin-bottom:11px;}
.cs-alerte p{font-size:13.5px;line-height:1.65;color:var(--ink-dim);margin:0 0 10px;}
.cs-alerte-f{font-family:'Playfair Display',serif;font-style:italic;font-size:15px;color:var(--ink) !important;
  margin-bottom:0 !important;}

/* ===== Maison : bulles + panneau inline ===== */
.mz-bulles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.mz-bulle{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink-dim);cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:13px;transition:all .16s;}
.mz-bulle:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--ink);transform:translateY(-1px);}
.mz-bulle.on{background:var(--accent);border-color:var(--accent);color:#0d0d0f;font-weight:500;
  box-shadow:0 8px 22px -12px var(--accent);}
.mz-ic{font-size:14px;line-height:1;}
.mz-card{background:linear-gradient(160deg,var(--paper),#0c0c0e);border:1px solid var(--accent);
  border-radius:16px;padding:20px 20px 18px;animation:modalIn .2s ease;
  box-shadow:0 20px 50px -34px var(--accent);}
.mz-card-h{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line-soft);}
.mz-card-h b{font-family:'Playfair Display',serif;font-weight:700;font-size:19px;color:var(--ink);}
.me-total{font-family:'DM Mono',monospace;font-size:13px;color:var(--ink-dim);
  background:var(--glass-soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:6px;}
.me-total b{color:var(--accent);font-size:15px;}

/* ===== Barre pomodoro flottante ===== */
.pomo-bar{position:fixed;top:0;left:0;right:0;z-index:120;overflow:hidden;
  background:rgba(10,10,10,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid color-mix(in srgb,var(--gold) 35%,transparent);
  animation:pbIn .28s cubic-bezier(.2,.7,.2,1);}
.pomo-bar.repos{border-bottom-color:rgba(63,185,80,.4);}
@keyframes pbIn{from{transform:translateY(-100%);}to{transform:none;}}
.pb-fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--gold) 14%,transparent);
  transition:width 1s linear;}
.pomo-bar.repos .pb-fill{background:rgba(63,185,80,.13);}
.pb-in{position:relative;display:flex;align-items:center;gap:12px;
  padding:10px max(16px, env(safe-area-inset-left)) 10px max(16px, env(safe-area-inset-right));
  max-width:1100px;margin:0 auto;}
.pb-phase{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);}
.pomo-bar.repos .pb-phase{color:var(--good);}
.pb-time{flex:1;font-family:'DM Mono',monospace;font-size:17px;font-weight:500;color:var(--ink);
  font-variant-numeric:tabular-nums;}
.pb-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;
  color:var(--ink-dim);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s;}
.pb-btn:hover{border-color:var(--gold);color:var(--ink);}
body:has(.pomo-bar) header{margin-top:44px;}

.cloud-diag{margin-top:12px;background:var(--glass-soft);border:1px solid var(--line);
  border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:13px 15px;}
.cloud-diag p{font-size:12.5px;line-height:1.6;color:var(--ink-dim);margin:0 0 7px;}
.cloud-diag p:first-child{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink);}
.cloud-diag p:last-child{margin-bottom:0;}

/* ===== Couleur par catégorie de rendez-vous ===== */
.cal-card{border-left:3px solid var(--cat,var(--line));}
.cal-card.today{border-left-color:var(--cat,var(--accent));}
.cal-cat{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;
  font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--cat);border:1px solid color-mix(in srgb,var(--cat) 45%,transparent);}
.rj-pastille{flex:none;width:7px;height:7px;border-radius:50%;background:var(--cat,var(--petrol));
  box-shadow:0 0 6px -1px var(--cat,var(--petrol));}

/* ===== Grooming : matin / soir ===== */
.gr-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;
  padding-bottom:10px;border-bottom:1px solid var(--line-soft);}
.gr-h-l b{font-family:'Playfair Display',serif;font-size:16px;color:var(--ink);}
.gr-h-l small{display:block;font-family:'DM Mono',monospace;font-size:10.5px;color:var(--ink-faint);margin-top:3px;}

/* ===== Grille mensuelle du calendrier ===== */
#calGrid{margin-bottom:20px;}
.cg-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cg-titre{font-family:'Playfair Display',serif;font-weight:700;font-size:16px;color:var(--ink);text-transform:capitalize;}
.cg-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px;}
.cg-dow span{text-align:center;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-faint);}
.cg-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cg-cell{min-height:52px;border-radius:9px;background:var(--glass-soft);border:1px solid var(--line-soft);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;cursor:pointer;
  padding:5px 3px;overflow:hidden;transition:all .15s;}
.cg-cell.vide{background:none;border:none;cursor:default;}
.cg-cell:not(.vide):hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));transform:scale(1.04);}
.cg-cell.auj{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.cg-titre-mini{display:block;width:100%;font-size:8px;line-height:1.2;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'DM Sans',sans-serif;}
.cg-n{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-dim);}
.cg-cell.auj .cg-n{color:var(--accent);font-weight:600;}
.cg-dots{display:flex;gap:2px;}
.cg-dots i{width:4px;height:4px;border-radius:50%;}
.cg-cell.a-des-rdv{background:var(--paper);}
.gr-row{gap:10px;}
.gr-ic{flex:none;font-size:17px;line-height:1;}
.gr-row .rlabel{cursor:pointer;}
.gr-edit{flex:none;width:24px;height:24px;border-radius:7px;border:none;background:none;
  color:var(--ink-faint);font-size:12px;cursor:pointer;opacity:.55;transition:all .15s;}
.gr-edit:hover{opacity:1;color:var(--accent,var(--gold));background:var(--glass-soft);}

/* ===== Jauges d'épargne ===== */
.eo-item{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:10px;}
.eo-item.atteint{border-color:rgba(63,185,80,.4);}
.eo-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;gap:12px;}
.eo-h b{font-size:14px;color:var(--ink);}
.eo-h span{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-faint);}
.eo-item.atteint .eo-h span{color:var(--good);}
.eo-bar{height:8px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:10px;}
.eo-bar i{display:block;height:100%;border-radius:5px;background:var(--accent,var(--gold));transition:width .5s;}
.eo-item.atteint .eo-bar i{background:var(--good);}
.eo-item input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;
  color:var(--ink);font-family:'DM Mono',monospace;font-size:13px;outline:none;}
.eo-item input:focus{border-color:var(--accent,var(--gold));}

.patri-b{display:flex;justify-content:space-between;align-items:center;background:var(--paper);
  border:1px solid var(--line);border-radius:9px;padding:11px 14px;}
.patri-b span{font-size:13px;color:var(--ink-dim);}
.patri-b b{font-family:'DM Mono',monospace;font-size:15px;color:var(--accent,var(--gold));}
.qz-res.exam.recale{border-color:rgba(230,57,70,.35);}

"use strict";

/* =====================================================================
   STORAGE PORTABLE
   Essaie window.storage (aperçu Claude) → bascule sur localStorage
   (Vercel / fichier local). Export/import JSON = vraie sauvegarde.
   ===================================================================== */
const KEY = 'jawhar-os-v1';
const Store = {
  async get(){
    if(typeof window!=='undefined' && window.storage){
      try{ const r=await window.storage.get(KEY,false); if(r&&r.value) return r.value; }catch(e){}
    }
    try{ return localStorage.getItem(KEY); }catch(e){ return null; }
  },
  async set(val){
    let ok=false;
    if(typeof window!=='undefined' && window.storage){
      try{ await window.storage.set(KEY,val,false); ok=true; }catch(e){}
    }
    try{ localStorage.setItem(KEY,val); ok=true; }catch(e){}
    return ok;
  }
};

const defaultMeridien = { capital:0, coussin:0, phase:1, age:24, ret:7, monthly:800, checks:{} };
function freshState(){ return { inventaire:{}, meridien:Object.assign({}, defaultMeridien, {checks:{}}), history:[], schema:buildDefaultSchema() }; }
let state;   // initialisé dans loadState() (après les constantes par défaut)

async function loadState(){
  state = freshState();
  try{
    const raw = await Store.get();
    if(raw){
      const parsed = JSON.parse(raw);
      const norm = normalize(parsed);
      state.inventaire = norm.inventaire;
      state.meridien   = norm.meridien;
      state.history    = norm.history;
      state.schema     = norm.schema;
    }
  }catch(e){}
  // garde-fous de navigation après chargement du schéma
  if(!REGS().some(r=>r.id===activeReg)) activeReg = REGS()[0].id;
  if(!currentReg().domains.includes(activeChapter)) activeChapter = currentReg().domains[0];
  // Pas de décision ici : la lecture locale peut être en retard sur le cloud
  // (un autre appareil a peut-être déjà validé le Manifeste aujourd'hui).
  // La décision finale attend la réconciliation avec le cloud, dans enterApp().
}
/* Le matin (première ouverture du jour), Vision & Manifeste s'affiche en premier —
   le reste de l'application n'apparaît qu'une fois cette lecture faite. */
function manifesteVuStore(){ if(!inv().manifesteVu || typeof inv().manifesteVu!=='object') inv().manifesteVu={}; return inv().manifesteVu; }
function manifesteVuAujourdhui(){ return !!manifesteVuStore()[todayKey()]; }
function manifesteJourIndex(){
  const now=new Date();
  const debut=new Date(now.getFullYear(),0,0);
  const jourAnnee=Math.floor((now-debut)/86400000);
  return jourAnnee % (MANIFESTE.length-1);
}
function manifCardHtml(sec){
  return `<div class="mf-card">
    <div class="mf-h">${sec.r?`<span class="mf-r">${esc(sec.r)}</span>`:''}<h4>${esc(sec.t)}</h4></div>
    ${(sec.p||[]).map(t=>`<p>${esc(t)}</p>`).join('')}
    ${sec.li?`<ul class="mf-li">${sec.li.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
    ${sec.p2?sec.p2.map(t=>`<p>${esc(t)}</p>`).join(''):''}
  </div>`;
}
function openMorningGate(){
  const cartes=[MANIFESTE[manifesteJourIndex()], MANIFESTE[MANIFESTE.length-1]];
  let pos=0;
  const ov=document.createElement('div'); ov.id='morningGate';
  ov.innerHTML=`<div class="mg-inner">
    <div class="mg-eyebrow">Bonjour</div>
    <div class="mg-title">Vision &amp; Manifeste</div>
    <div class="mg-sub">Deux pensées avant d'entrer — pas tout le manifeste, juste l'essentiel du jour.</div>
    <div id="mgCard"></div>
    <div class="mf-nav">
      <button class="pm-btn sm" id="mgPrev" type="button">← Précédent</button>
      <span class="mf-pos" id="mgPos"></span>
      <button class="pm-btn sm" id="mgNext" type="button">Suivant →</button>
    </div>
    <button class="modal-btn ok mg-enter" id="mgEnter" type="button" disabled>Termine la lecture pour continuer</button>
  </div>`;
  document.body.appendChild(ov);
  const $=s=>ov.querySelector(s);
  const btn=$('#mgEnter');
  function draw(){
    $('#mgCard').innerHTML=manifCardHtml(cartes[pos]);
    $('#mgPos').textContent=(pos+1)+' / 2';
    $('#mgPrev').disabled = pos===0;
    $('#mgNext').disabled = pos===1;
    const derniere=pos===1;
    btn.disabled=!derniere;
    btn.textContent = derniere ? "J'ai lu — Entrer dans l'application" : 'Termine la lecture pour continuer';
  }
  $('#mgPrev').onclick=()=>{ if(pos>0){ pos--; draw(); } };
  $('#mgNext').onclick=()=>{ if(pos<1){ pos++; draw(); } };
  btn.addEventListener('click', ()=>{
    if(btn.disabled) return;
    manifesteVuStore()[todayKey()]=true; save();
    if(ov.parentNode) ov.remove();
    render();
  });
  draw();
}
/* enregistre un point de progression par jour (dernier point du jour conservé) */
function snapshotProgress(){
  if(!Array.isArray(state.history)) state.history=[];
  const t=todayKey(), v=overallProgress();
  const last=state.history[state.history.length-1];
  if(last && last.d===t) last.v=v; else state.history.push({d:t,v});
  if(state.history.length>180) state.history.splice(0,state.history.length-180);
}
async function save(){
  snapshotProgress();
  const ok = await Store.set(JSON.stringify(state));

/* Normalise n'importe quel format connu vers {inventaire, meridien}.
   Sait migrer les anciens exports JAWHAR (plat) et MÉRIDIEN (capital/checks). */
function normalize(parsed){
  let s = parsed && parsed.state ? parsed.state : parsed;
  if(!s || typeof s!=='object') return { inventaire:{}, meridien:Object.assign({},defaultMeridien,{checks:{}}), history:[], schema:buildDefaultSchema() };
  // déjà au format unifié
  if(s.inventaire || s.meridien){
    const inv0=(s.inventaire && typeof s.inventaire==='object') ? s.inventaire : {};
    const sch0=mergeSchema(s.schema);
    migrerCode(sch0, inv0);
    migrerRetraitPoidsMG(sch0, inv0);
    migrerObjectifsVie(sch0, inv0);
    migrerRenommageItems(sch0);
    migrerGroomingRegroupe(inv0);
    migrerFusionBudget(inv0);
    return {
      inventaire: inv0,
      meridien: Object.assign({}, defaultMeridien, s.meridien||{}, {checks:(s.meridien&&s.meridien.checks)||{}}),
      history: Array.isArray(s.history) ? s.history : [],
      schema: sch0
    };
  }
  // ancien MÉRIDIEN : a capital / coussin / phase / checks
  const looksMeridien = ('capital' in s)||('coussin' in s)||('phase' in s)||(s.checks && typeof s.checks==='object');
  if(looksMeridien){
    return { inventaire:{}, meridien:Object.assign({}, defaultMeridien, s, {checks:s.checks||{}}), history:[], schema:buildDefaultSchema() };
  }
  // sinon : ancien inventaire à plat
  return { inventaire:s, meridien:Object.assign({},defaultMeridien,{checks:{}}), history:[], schema:buildDefaultSchema() };
}
/* La révision du code a maintenant sa page dédiée : on retire la mini-tâche
   correspondante et on récupère son historique de cases cochées. */
/* Poids et masse grasse ne sont plus suivis : on les retire des installations existantes,
   avec tout leur historique. */
/* Projets a rejoint la même catégorie qu'épargne & investissement : on additionne
   les parts déjà réglées, pour que rien ne se perde dans le calcul. */
function migrerFusionBudget(inv0){
  if(!inv0 || !inv0.budget || typeof inv0.budget!=='object') return;
  if(inv0.__budgetFusionne) return;
  Object.keys(inv0.budget).forEach(m=>{
    const bm=inv0.budget[m];
    if(!bm) return;
    if(bm.parts && bm.parts.projets!==undefined){
      const ep=budNum(bm.parts.epargne!==undefined && bm.parts.epargne!=='' ? bm.parts.epargne : 6);
      const pj=budNum(bm.parts.projets);
      bm.parts.epargne=String(ep+pj);
      delete bm.parts.projets;
    }
    if(bm.depense && bm.depense.projets!==undefined){
      const ep=budNum(bm.depense.epargne||0), pj=budNum(bm.depense.projets);
      bm.depense.epargne=String(ep+pj);
      delete bm.depense.projets;
    }
  });
  inv0.__budgetFusionne=1;
}

/* Le grooming du matin passe de 13 lignes à 7 (regroupées) avec une icône chacune.

function migrerGroomingRegroupe(inv0){
  if(!inv0 || !inv0.groomingListe) return;

    if(inv0.grooming) for(const k in inv0.grooming) inv0.grooming[k]={matin:[],soir:[]};

function migrerRenommageItems(sc){
  if(!sc || !sc.domains) return;
  for(const dk in sc.domains){

    d.items.forEach(it=>{

    });

function migrerRetraitPoidsMG(sc, inv0){
  if(!sc || !sc.domains || !inv0) return;
  if(inv0.__poidsMgRetire) return;
  ['poids','bodyfat'].forEach(id=>{
    for(const dk in sc.domains){
      const d=sc.domains[dk];
      if(!Array.isArray(d.items)) continue;
      if(d.items.some(it=>it.id===id)) d.items=d.items.filter(it=>it.id!==id);
    }
    delete inv0[id]; delete inv0['h_'+id]; delete inv0['s_'+id]; delete inv0['a_'+id];
  });

}

function migrerCode(sc, inv0){
  if(!sc || !sc.domains || !inv0) return;
  if(inv0.__codeMigre) return;
  for(const dk in sc.domains){
    const d=sc.domains[dk];

    const vises=d.items.filter(it=> it.mini && /r[ée]vision/i.test(it.label||'') && /code/i.test(it.label||''));
    vises.forEach(it=>{

      }

/* =====================================================================
   FUSION DU SCHÉMA
   Une mise à jour de l'application ne doit JAMAIS effacer ce que tu as créé.
   Règles :
     - tes items (ceux absents des réglages d'usine) sont toujours conservés
     - les nouveautés d'usine sont ajoutées, sauf si tu les avais supprimées
     - tes renommages, tes phases et ton ordre l'emportent sur l'usine
   ===================================================================== */
/* Éléments retirés par une mise à jour : ils doivent disparaître même s'ils
   existent déjà chez toi (la fusion protège tes ajouts, pas les miens). */
const DEPRECATED_DOMAINS = ['meridien','planning','dressing','routines','batchcooking','quete','cardio','conso','confort',
  'm_adm','m_menager','m_maint','m_check','m_pannes','m_eauelec','m_secu','m_secours','m_aliments','m_stock'];
/* Renommages d'usine : appliqués seulement si tu n'as pas renommé toi-même. */
const REGISTRE_RENAMES = {
  socle:{ from:'Le Socle & le Chantier', to:'Goals' },
  ideesreg:{ from:'Machine à idées', to:'Notes' }
};
const FACTORY_RENAMES = {
  boiteidees:{ from:'Boîte à idées', to:'Sorties' },
  machineidees:{ from:'Machine à idées', to:'Notes' },
  conso:{ from:'Consommer moins, mieux', to:'Divertissement' },
  socle:{ from:'Objectifs', to:'Objectifs de vie' },
  charme:{ from:'Charme, charisme & aisance sociale', to:'Bel-Ami' }
};

function isFactoryId(id, def){
  for(const dk in def.domains){
    if((def.domains[dk].items||[]).some(it=>it.id===id)) return true;
  }
  return false;
}
function mergeSchema(saved){
  const def=buildDefaultSchema();
  if(!validSchema(saved)) return def;                 // rien d'exploitable : on repart de l'usine
  if(saved.v===SCHEMA_VERSION) return saved;          // déjà à jour : on n'y touche pas

  const removed = Array.isArray(saved.removed) ? saved.removed.slice() : [];
  const out = {
    v: SCHEMA_VERSION,
    phases: Array.isArray(saved.phases)&&saved.phases.length ? saved.phases : def.phases,
    removed: removed,
    registres: [],
    domains: {}
  };

  // 1) domaines : on part des tiens, on complète avec l'usine
  for(const dk in saved.domains){
    if(DEPRECATED_DOMAINS.indexOf(dk)>=0) continue;      // retiré par la mise à jour
    const mine=saved.domains[dk], fac=def.domains[dk];
    const ren=FACTORY_RENAMES[dk];
    const items=[];
    const seen={};
    // tes items d'abord, dans TON ordre — y compris ceux que tu as créés
    (mine.items||[]).forEach(it=>{ if(it&&it.id&&!seen[it.id]){ seen[it.id]=1; items.push(it); } });
    // puis les nouveautés d'usine que tu n'as jamais vues ni supprimées
    if(fac){
      (fac.items||[]).forEach(it=>{
        if(!seen[it.id] && removed.indexOf(it.id)<0){ seen[it.id]=1; items.push(it); }
      });
    }
    let nom = mine.name || (fac&&fac.name) || dk;    // ton renommage gagne
    if(ren && nom===ren.from) nom = ren.to;          // sauf si tu n'avais rien renommé
    out.domains[dk]={
      name: nom,
      note: (mine.note!==undefined? mine.note : (fac&&fac.note)) || '',
      special: mine.special || (fac&&fac.special) || null,
      items: items
    };
  }
  // 2) domaines d'usine que tu n'as pas encore (nouvelles pages)
  for(const dk in def.domains){
    if(!out.domains[dk] && removed.indexOf('domain:'+dk)<0){
      out.domains[dk]=JSON.parse(JSON.stringify(def.domains[dk]));
    }
  }

  // 3) registres : les tiens d'abord, complétés par l'usine
  //    Si l'usine déplace un domaine d'un registre à un autre, on suit le déplacement
  //    au lieu de le laisser apparaître en double.
  const factoryHome={};
  def.registres.forEach(r=>(r.domains||[]).forEach(d=>{ factoryHome[d]=r.id; }));
  const byId={};
  (saved.registres||[]).forEach(r=>{ if(r&&r.id) byId[r.id]=r; });
  def.registres.forEach(fr=>{
    const mr=byId[fr.id];
    if(mr){
      const doms=(mr.domains||[]).filter(d=>{
        if(DEPRECATED_DOMAINS.indexOf(d)>=0) return false;
        if(!out.domains[d]) return false;
        if(factoryHome[d] && factoryHome[d]!==fr.id) return false;   // déplacé ailleurs par l'usine
        return true;
      });
      (fr.domains||[]).forEach(d=>{ if(out.domains[d] && doms.indexOf(d)<0 && removed.indexOf('domain:'+d)<0) doms.push(d); });
      const rr=REGISTRE_RENAMES[fr.id];
      const titre = (rr && mr.title===rr.from) ? fr.title : (mr.title||fr.title);
      out.registres.push({ id:fr.id, num:fr.num, ephemere:!!fr.ephemere, title:titre, subtitle:(mr.subtitle!==undefined?mr.subtitle:fr.subtitle), accent:fr.accent, domains:doms.length?doms:fr.domains.slice() });
      delete byId[fr.id];
    } else if(removed.indexOf('reg:'+fr.id)<0){
      out.registres.push(JSON.parse(JSON.stringify(fr)));
    }
  });
  // registres que TU as créés : conservés à la fin
  for(const id in byId){
    const r=byId[id];
    const doms=(r.domains||[]).filter(d=>out.domains[d] && !(factoryHome[d] && factoryHome[d]!==id));
    if(doms.length) out.registres.push({ id:r.id, num:r.num||'', title:r.title||id, subtitle:r.subtitle||'', accent:r.accent||'var(--gold)', domains:doms });
  }
  return out;
}

/* =====================================================================
   PROGRESSION (inventaire)
   ===================================================================== */
function domainProgress(dKey){
  const items = (domain(dKey).items||[]);
  let total=0, score=0;
  items.forEach(m=>{ total++;
    if(m.kind==='bool'){
      if(isHabit(m)){
        if(m.cadence==='weekly'){
          const done=weekKeys().filter(k=>habitOn(m.id,k)).length;
          score += Math.min(1, done/(m.htarget||7));
        } else if(habitDoneNow(m)) score+=1;
      }
      else { if(inv()[m.id]) score+=1; }
    } else if(m.kind==='num'){
      const v=inv()[m.id];
      const has = v!==undefined && v!=='' && v!==null && !isNaN(+v);
      const gs = has ? goalState(m,v) : null;
      if(gs) score += gs.reached ? 1 : gs.fill/100;   // crédit proportionnel à la cible
      else if(has) score += 1;                         // pas d'objectif défini : la saisie compte
    } else if(m.kind==='addiction'){
      if(streakObj(m.id).start) score+=1;
    } else if(m.kind==='qual'){
      if(inv()[m.id]) score+=1;
    }
  });
  return total===0 ? null : Math.round(100*score/total);
}
/* Score brut d'un domaine : {score, total}. Les pages de référence renvoient total=0
   et sont donc ignorées — elles ne se cochent pas, elles ne doivent rien peser. */
function domainRaw(dKey){
  const d=domain(dKey);
  if(!d || d.special) return {score:0,total:0};
  // les mini-tâches tournent plusieurs fois dans une même phase : elles ne pèsent pas
  const items=(d.items||[]).filter(it=>!it.mini);
  if(!items.length) return {score:0,total:0};
  let score=0;
  items.forEach(it=>{ if(itemDone(it)) score+=1; });
  return { score, total:items.length };
}
function registreProgress(reg){
  let s=0,t=0;
  reg.domains.forEach(dk=>{ const r=domainRaw(dk); s+=r.score; t+=r.total; });
  return t===0 ? null : Math.round(100*s/t);
}
function registreHasProgress(reg){ return registreProgress(reg)!==null; }
function overallProgress(){
  let s=0,t=0;
  REGS().forEach(r=>r.domains.forEach(dk=>{ const x=domainRaw(dk); s+=x.score; t+=x.total; }));
  return t===0 ? 0 : Math.round(100*s/t);
}

function newId(base){ let id=slug(base), n=0, all=new Set(); Object.values(DOMS()).forEach(d=>(d.items||[]).forEach(i=>all.add(i.id))); let cand=id; while(all.has(cand)){ n++; cand=id+'_'+n; } return cand; }

/* convertit le code par défaut en schéma éditable (premier lancement) */
function buildDefaultSchema(){
  const domains={};
  Object.keys(DOMAINS).forEach(dk=>{
    const d=DOMAINS[dk], items=[];
    (d.measurable||[]).forEach(m=>{
      if(m.type==='bool'){
        const it={ id:m.id, kind:'bool', label:m.label, note:m.note||'',
          habit:HABIT_IDS.has(m.id), cadence:WEEKLY_HABITS.has(m.id)?'weekly':'daily' };
        if(m.htarget) it.htarget=m.htarget;
        if(m.phase) it.phase=m.phase;
        if(m.mini) it.mini=true;
        items.push(it);
      } else {
        let goalDir='min';
        if(GOAL_DOWN.has(m.id)) goalDir='max';
        else if(GOAL_OVERRIDE[m.id]) goalDir='range';
        else if(m.target && /[–-]/.test(m.target)) goalDir='range';
        let target=m.target||'';
        if(m.id==='sommeil') target='7,5–9';   // version propre, parsable
        if(!m.target) goalDir='none';
        const it={ id:m.id, kind:'num', label:m.label, unit:m.unit||'', target, goalDir };
        if(m.phase) it.phase=m.phase;
        if(m.mini) it.mini=true;
        items.push(it);
      }
    });
    (d.addictions||[]).forEach(a=> items.push({ id:a.id, kind:'addiction', label:a.label }));
    (d.qualitative||[]).forEach((q,i)=> items.push({ id:'q_'+dk+'_'+i, kind:'qual', label:q }));
    domains[dk]={ name:d.name, note:d.note||'', items, special:d.special||null };
  });
  const registres=REGISTRES.map(r=>({ id:r.id, num:r.num, title:r.title, subtitle:r.subtitle, accent:r.accent, ephemere:!!r.ephemere, domains:[...r.domains] }));
  return { v:SCHEMA_VERSION, registres, domains, phases:OBJECTIFS_VIE.map(o=>({n:o.n,name:o.t})) };
}

function todayKey(){ return dateKey(new Date()); }
function dateKey(d){ return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function daysBetween(aKey,bKey){ return Math.round((Date.parse(bKey)-Date.parse(aKey))/DAY); }
function last7Keys(){ const out=[],now=new Date(); for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); out.push(dateKey(d)); } return out; }
function weekKeys(){ const now=new Date(); const dow=(now.getDay()+6)%7; const mon=new Date(now); mon.setDate(now.getDate()-dow); const out=[]; for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); out.push(dateKey(d)); } return out; }
function dayShort(key){ return new Date(key+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'narrow'}); }
function isHabit(m){ return m.kind==='bool' && !!m.habit; }

function habitDates(id){
  const k='h_'+id;
  if(!Array.isArray(inv()[k])) inv()[k] = inv()[id] ? [todayKey()] : [];
  return inv()[k];
}
function habitOn(id,dayKey){ return habitDates(id).includes(dayKey); }
function toggleHabit(id,dayKey){
  const arr=habitDates(id), i=arr.indexOf(dayKey);
  if(i>=0) arr.splice(i,1); else arr.push(dayKey);
  inv()[id]=habitOn(id,todayKey());
  save(); render();
}
function habitDoneNow(m){
  if(m.cadence==='weekly') return weekKeys().some(k=>habitOn(m.id,k));
  return habitOn(m.id,todayKey());
}
function habitStreak(id){
  let n=0; const now=new Date();
  for(let i=0;i<400;i++){ const d=new Date(now); d.setDate(now.getDate()-i);
    if(habitOn(id,dateKey(d))) n++; else break; }
  return n;
}

   relire le même paragraphe deux fois de suite — un message qu'on connaît par cœur n'agit plus. */
function relapseMsgIdxStore(){ if(!inv().relapseMsgIdx || typeof inv().relapseMsgIdx!=='object') inv().relapseMsgIdx={}; return inv().relapseMsgIdx; }
function relapseMessage(id){
  const arr = ADDICTION_MESSAGES[id] || ADDICTION_FALLBACK;
  const st = relapseMsgIdxStore();
  const i = (typeof st[id]==='number') ? st[id] % arr.length : 0;
  st[id] = (i+1) % arr.length;   // prochain appel : message suivant
  save();
  return arr[i];
}

function streakObj(id){
  const k='a_'+id;
  if(!inv()[k] || typeof inv()[k]!=='object'){
    const old=inv()[id];
    if(old!==undefined && old!=='' && !isNaN(+old)){
      const s=new Date(); s.setDate(s.getDate()-Math.floor(+old));
      inv()[k]={ start:dateKey(s), best:Math.floor(+old) };
    } else inv()[k]={ start:null, best:0 };
  }
  return inv()[k];
}
function streakDays(id){ const o=streakObj(id); return o.start ? Math.max(0,daysBetween(o.start,todayKey())) : null; }
function startStreak(id){ streakObj(id).start=todayKey(); save(); render(); }
function relapseStreak(id){ const o=streakObj(id); o.best=Math.max(o.best||0, streakDays(id)||0); o.start=todayKey(); save(); render(); }

function numHist(id){ const k='s_'+id; if(!Array.isArray(inv()[k])) inv()[k]=[]; return inv()[k]; }
function recordNum(id,val){
  if(val===''||val==null||isNaN(+val)) return;
  const h=numHist(id), t=todayKey();
  if(h.length && h[h.length-1].d===t) h[h.length-1].v=+val; else h.push({d:t,v:+val});
  if(h.length>90) h.splice(0,h.length-90);
}
function sparkline(id,color){
  const h=numHist(id);
  if(h.length<2) return '';
  const pts=h.slice(-14);
  const vals=pts.map(p=>p.v);
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1, W=72,H=24,n=vals.length;
  const xy=vals.map((v,i)=>[ (i/(n-1))*(W-6)+3, H-3-((v-min)/span)*(H-6) ]);
  const line=xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots=xy.map((p,i)=>{
    const val=String(pts[i].v).replace(/\./,',');
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="6" fill="transparent" class="spark-hit"><title>${esc(val)} · ${esc(fmtDateShort(pts[i].d))}</title></circle><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.5" fill="${color}" class="spark-dot"/>`;
  }).join('');
  const [lx,ly]=xy[xy.length-1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2" fill="${color}"/></svg>`;
}

function parseGoal(m){
  if(!m || m.kind!=='num') return null;
  const dir=m.goalDir;
  if(!dir || dir==='none') return null;
  const nums=(String(m.target||'').replace(/[\u202f\s]/g,'').match(/\d+(?:[.,]\d+)?/g)||[]).map(s=>parseFloat(s.replace(',','.')));
  if(!nums.length) return null;
  if(dir==='range'){ const b=nums[1]!=null?nums[1]:nums[0]; return {type:'range',a:Math.min(nums[0],b),b:Math.max(nums[0],b)}; }
  return {type: dir==='max'?'max':'min', a:nums[0]};
}
function goalState(m,val){
  const g=parseGoal(m); if(!g||val===''||val==null||isNaN(+val)) return null;
  const v=+val; let fill,reached;
  if(g.type==='min'){ reached=v>=g.a; fill=Math.min(100,v/g.a*100); }
  else if(g.type==='max'){ reached=v<=g.a; fill=reached?100:Math.max(6,Math.min(100,g.a/v*100)); }
  else { reached=v>=g.a&&v<=g.b; fill=Math.min(100,v/g.b*100); }
  return {fill,reached};
}

/* rend un élément cliquable opérable au clavier (Entrée / Espace) */
function clickable(el, handler){
  el.addEventListener('click', handler);
  if(el.tagName!=='BUTTON'){               // les <button> gèrent déjà Entrée/Espace nativement
    el.tabIndex = 0;
    el.setAttribute('role','button');
    el.addEventListener('keydown', e=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); handler(e); }
    });
  }
  return el;
}

/* Barre flottante : dès que le pomodoro tourne, il reste visible en haut,
   quelle que soit la page où tu te trouves. */
function renderPomoBar(){
  let bar=document.getElementById('pomoBar');
  if(!pomoState.running){ if(bar) bar.remove(); return; }
  if(!bar){
    bar=document.createElement('div');
    bar.id='pomoBar';
    document.body.appendChild(bar);
  }
  const m=Math.floor(pomoState.left/60), sec=pomoState.left%60;
  const t=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  const phase = pomoState.phase==='travail' ? 'Travail' : (pomoState.phase==='longue' ? 'Pause longue' : 'Pause');
  const total=pomoState.dur[pomoState.phase]||1;
  const pct=Math.max(0, Math.min(100, Math.round((1-pomoState.left/total)*100)));
  bar.className='pomo-bar'+(pomoState.phase==='travail'?'':' repos');
  bar.innerHTML=`<div class="pb-fill" style="width:${pct}%"></div>
    <div class="pb-in">
      <span class="pb-phase">${esc(phase)}</span>
      <span class="pb-time">${t}</span>
      <button class="pb-btn" id="pbPause" type="button">Pause</button>
      <button class="pb-btn" id="pbGo" type="button">Ouvrir</button>
    </div>`;
  bar.querySelector('#pbPause').onclick=()=>{
    pomoState.running=false; pomoState.endAt=null; pomoStopTick(); pomoPersist(); render();
  };
  bar.querySelector('#pbGo').onclick=()=>{
    const r=REGS().find(x=>(x.domains||[]).indexOf('pomodoro')>=0);
    if(r){ activeView='registre'; activeReg=r.id; activeChapter='pomodoro'; render(); }
  };
}

/* =====================================================================
   VUE TABLEAU DE BORD
   ===================================================================== */
function computeAttention(){
  const out=[];
  const acre = daysBetween(todayKey(),'2026-07-01');
  if(acre>=0 && acre<=21) out.push({tone:'urgent',ic:'!',
    text: acre===0 ? "ACRE — dernier jour pour déposer la demande à l'URSSAF."
                   : `ACRE — plus que ${acre} j pour la demande URSSAF (réduction de 50 %).`,
    go:'meridien'});
  const pending=[];
  REGS().forEach(r=>r.domains.forEach(dk=>itemsOf(dk,'bool').forEach(m=>{
    if(isHabit(m) && !habitDoneNow(m)) pending.push({m,dk});
  })));
  pending.slice(0,2).forEach(p=> out.push({tone:'todo',ic:'·',
    text:`À tenir aujourd'hui — ${p.m.label.replace(/\s*\((?:aujourd.?hui|cette semaine)\)/i,'')}.`, go:regOfDomain(p.dk)}));
  let low=null; REGS().forEach(r=>{ const p=registreProgress(r); if(p!==null && (!low||p<low.p)) low={r,p}; });
  if(low) out.push({tone:'soft',ic:'→', text:`Registre le plus en retard — ${low.r.title} (${low.p} %).`, go:'reg:'+low.r.id});
  return out.slice(0,5);
}

function momentumData(){
  const streaks=[];
  REGS().forEach(r=>r.domains.forEach(dk=>itemsOf(dk,'bool').forEach(m=>{
    if(isHabit(m)){ const s=habitStreak(m.id); if(s>0) streaks.push({label:m.label.replace(/\s*\((?:aujourd.?hui)\)/i,''), n:s}); }
  })));
  REGS().forEach(r=>r.domains.forEach(dk=>itemsOf(dk,'addiction').forEach(a=>{
    const d=streakDays(a.id); if(d!==null && d>0) streaks.push({label:a.label, n:d});
  })));
  streaks.sort((a,b)=>b.n-a.n);
  return streaks.slice(0,6);
}
function progressCurve(){
  const h=(state.history||[]).slice(-21);
  if(h.length<2) return `<div class="mom-curve"><div class="mom-empty">La courbe se dessine dès que tu reviens quelques jours.</div></div>`;
  const vals=h.map(p=>p.v), W=260,H=58,pad=5,n=vals.length;
  const pts=vals.map((v,i)=>{ const x=pad+(i/(n-1))*(W-2*pad); const y=H-pad-(Math.max(0,Math.min(100,v))/100)*(H-2*pad); return [x,y]; });
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=`${pad},${H-pad} ${line} ${W-pad},${H-pad}`;
  const delta=vals[vals.length-1]-vals[0];
  const arrow=delta>0?'↑':delta<0?'↓':'→', dcol=delta>0?'var(--good)':delta<0?'var(--garnet)':'var(--ink-faint)';
  const [lx,ly]=pts[pts.length-1];
  return `<div class="mom-curve">
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="momg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E63946" stop-opacity="0.30"/><stop offset="1" stop-color="#E63946" stop-opacity="0"/></linearGradient></defs>
      <polygon points="${area}" fill="url(#momg)"/>
      <polyline points="${line}" fill="none" stroke="#E63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.6" fill="#E63946"/>
    </svg>
    <div class="mom-curve-foot"><span>Progression · ${h.length} j suivis</span><b style="color:${dcol}">${arrow} ${delta>=0?'+':''}${delta} pts</b></div>
  </div>`;
}

    panel.appendChild(addDom);
  }

  const chap = renderChapter(activeChapter, reg.accent);
  panel.appendChild(chap);
  if(chap.__init){ chap.__init(); }
