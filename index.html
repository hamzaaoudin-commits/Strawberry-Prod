<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HAMZA — Gestion de vie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="mask-icon" href="/mask-icon.svg" color="#E63946">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HAMZA">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A;
  --paper:rgba(255,255,255,.045);
  --paper-2:rgba(255,255,255,.07);
  --glass:rgba(16,16,16,.6);
  --glass-soft:rgba(255,255,255,.04);
  --glass-border:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.12);
  --line-soft:rgba(255,255,255,.07);
  --ink:#F4F4F5;
  --ink-dim:rgba(255,255,255,.62);
  --ink-faint:rgba(255,255,255,.4);
  --bronze:#E63946;
  --bronze-soft:rgba(230,57,70,.16);
  --petrol:#FF8A3D;
  --petrol-soft:rgba(255,138,61,.16);
  --garnet:#2DD4BF;
  --garnet-soft:rgba(45,212,191,.16);
  --rose:#F0546A;
  --rose-soft:rgba(240,84,106,.16);
  --sage:#A97BFF;
  --sage-soft:rgba(169,123,255,.16);
  --tangerine:#F59E0B;
  --tangerine-soft:rgba(245,158,11,.16);
  --saffron:#F5C542;
  --saffron-soft:rgba(245,197,66,.16);
  --amber:#E63946;
  --gold:#E63946;
  --good:#3FB950;
  --good-soft:rgba(63,185,80,.18);
  --ring:rgba(230,57,70,.6);
  --radius:12px;
  --elev:0 24px 60px -28px rgba(0,0,0,.7);
  color-scheme:dark;
}
input[type=date],input[type=time],input[type=number],select{color-scheme:dark;}
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.75;cursor:pointer;}
input[type=date]::-webkit-calendar-picker-indicator:hover,
input[type=time]::-webkit-calendar-picker-indicator:hover{opacity:1;}
input[type=time]::-webkit-datetime-edit,input[type=date]::-webkit-datetime-edit{color:var(--ink);}
::selection{background:var(--gold);color:#fff;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;}
html{scroll-behavior:smooth;}
body{display:flex;flex-direction:column;position:relative;isolation:isolate;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 600px at 8% -8%, rgba(230,57,70,.15), transparent 60%),
    radial-gradient(800px 700px at 96% 10%, rgba(255,107,74,.10), transparent 55%),
    radial-gradient(1000px 800px at 50% 110%, rgba(220,38,38,.13), transparent 55%),
    var(--bg);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.4;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.35'/></svg>");
}
::selection{background:var(--gold);color:#fff;}

/* scrollbar */
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:var(--line-soft);}
::-webkit-scrollbar-track{background:transparent;}

/* keyboard focus */
:focus-visible{outline:none;}
.rail-item:focus-visible,.chip:focus-visible,.row:focus-visible,.dline:focus-visible,
.reset-btn:focus-visible,button:focus-visible,select:focus-visible,
input:focus-visible,.m-checks input:focus-visible{
  outline:2px solid var(--ring);outline-offset:3px;
}

/* ============ HEADER / HERO ============ */
header{
  border-bottom:1px solid var(--glass-border);
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  padding:24px 40px;
  display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap;
  position:sticky;top:0;z-index:10;
}
.brandblock{display:flex;align-items:center;gap:20px;}
.brand-rule{width:2px;align-self:stretch;min-height:48px;border-radius:2px;background:linear-gradient(var(--gold),rgba(230,57,70,.15));flex-shrink:0;box-shadow:0 0 12px -2px rgba(230,57,70,.4);}
.brand-text .mark{
  font-family:'Playfair Display',serif;font-weight:600;font-size:29px;letter-spacing:.05em;line-height:1;
  color:var(--ink);
}
.brand-text .tagline{
  font-family:'Playfair Display',serif;font-style:italic;font-weight:420;font-size:13px;color:var(--ink-dim);
  margin-top:5px;letter-spacing:.01em;max-width:34ch;
}
.hdr-stats{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.purity{display:flex;align-items:baseline;gap:10px;}
.purity .num{
  font-family:'Playfair Display',serif;font-weight:560;font-size:40px;color:var(--gold);line-height:1;
  text-shadow:0 0 22px rgba(230,57,70,.32);font-variant-numeric:tabular-nums;
}
.purity.cap .num{color:var(--petrol);text-shadow:0 0 22px rgba(111,163,165,.28);}
.purity .lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);line-height:1.3;}
.hdr-sep{width:1px;height:40px;background:linear-gradient(var(--glass-border),transparent);}
.reset-btn{
  background:var(--glass-soft);border:1px solid var(--glass-border);color:var(--ink-dim);font-family:'DM Mono',monospace;
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:9px 16px;border-radius:999px;cursor:pointer;
  transition:all .2s ease;
}
.reset-btn:hover{
  border-color:rgba(230,57,70,.45);color:var(--ink);background:rgba(230,57,70,.08);
  transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.25);
}
#resetBtn:hover{
  border-color:rgba(192,116,116,.5);color:#e0a3a0;background:rgba(192,116,116,.1);
  box-shadow:0 6px 16px -6px rgba(192,116,116,.4);
}

/* ============ LAYOUT ============ */
.layout{display:flex;flex:1;max-width:1180px;width:100%;margin:0 auto;}
.rail{width:262px;flex-shrink:0;padding:28px 16px;}
.rail-item{
  position:relative;overflow:hidden;
  padding:9px 14px 9px 15px;cursor:pointer;border-radius:9px;margin-bottom:5px;
  background:var(--glass-soft);border:1px solid transparent;
  transition:background .22s ease, border-color .22s ease, transform .22s ease, box-shadow .22s ease;
}
.rail-item:hover{
  background:rgba(255,255,255,.055);border-color:var(--glass-border);
  transform:translateY(-1px);box-shadow:0 10px 24px -16px rgba(0,0,0,.7);
}
.rail-item.active{
  background:linear-gradient(135deg, color-mix(in srgb, var(--accent,var(--gold)) 22%, transparent), color-mix(in srgb, var(--accent,var(--gold)) 6%, transparent));
  border-color:color-mix(in srgb, var(--accent,var(--gold)) 55%, transparent);
  box-shadow:0 12px 34px -12px color-mix(in srgb, var(--accent,var(--gold)) 70%, transparent), 0 0 0 1px color-mix(in srgb, var(--accent,var(--gold)) 30%, transparent), inset 0 1px 0 rgba(255,255,255,.06);
  transform:translateX(3px);
}
.rail-item.active::before{
  content:'';position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;
  background:var(--accent,var(--gold));box-shadow:0 0 14px 1px var(--accent,var(--gold));
}
.rail-item.active::after{
  content:'▶';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--accent,var(--gold));font-size:10px;
  filter:drop-shadow(0 0 6px var(--accent,var(--gold)));animation:navBlink 1.6s ease-in-out infinite;
}
@keyframes navBlink{0%,100%{opacity:.5;}50%{opacity:1;}}
.rail-item .num{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--ink-faint);}
.rail-item.active .num{color:var(--accent,var(--gold));}
.rail-item .title{font-size:12.5px;font-weight:600;margin-top:2px;line-height:1.25;}
.rail-item.active .title{color:var(--ink);}
.rail-item:not(.active) .title{color:var(--ink-dim);}
.rail-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.06);margin-top:7px;overflow:hidden;}
.rail-bar-fill{height:100%;border-radius:2px;box-shadow:0 0 8px 0 currentColor;transition:width .7s cubic-bezier(.2,.7,.2,1);}
.railsub{font-family:'DM Mono',monospace;font-size:9px;color:var(--ink-faint);margin-top:3px;}
.rail-hint{display:none;}
.rail-divider{margin:12px 14px;border-top:1px solid var(--line);}
.rail-section-label{
  padding:4px 18px 11px;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);
}
.rail-item .railsub{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.03em;color:var(--ink-faint);margin-top:9px;}

main{flex:1;padding:44px 50px;min-width:0;}

/* ============ REGISTRE HEAD ============ */
.reg-head{margin-bottom:8px;}
.reg-head .eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:12px;
}
.reg-head .eyebrow::before{content:'';width:22px;height:1px;background:var(--accent);opacity:.8;}
.reg-head h2{font-family:'Playfair Display',serif;font-weight:560;font-size:clamp(30px,4.4vw,40px);letter-spacing:.004em;line-height:1.04;}
.reg-head .subtitle{
  font-family:'Playfair Display',serif;font-style:italic;font-weight:420;font-size:16px;color:var(--ink-dim);
  margin-top:10px;max-width:52ch;
}
.reg-progress{display:flex;align-items:center;gap:14px;margin:22px 0 38px;}
.reg-progress .bar{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.05);overflow:hidden;max-width:360px;border:1px solid var(--glass-border);}
.reg-progress .bar-fill{height:100%;border-radius:4px;box-shadow:0 0 10px 0 currentColor;transition:width .7s cubic-bezier(.2,.7,.2,1);}
.reg-progress .pctlabel{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;}

/* ============ CHAPTER CHIPS ============ */
.chips{display:flex;gap:9px;margin-bottom:34px;flex-wrap:wrap;}
.chip{
  font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:.02em;padding:9px 16px;border-radius:999px;
  border:1px solid var(--glass-border);background:var(--glass-soft);color:var(--ink-dim);cursor:pointer;
  transition:all .2s cubic-bezier(.2,.7,.2,1);
}
.chip:hover{border-color:var(--ink-faint);color:var(--ink);transform:translateY(-1px);}
.chip.active{
  background:var(--accent);border-color:var(--accent);color:#15141A;font-weight:500;
  box-shadow:0 8px 20px -8px var(--accent);
}

/* ============ LEDGER ============ */
.ledger-label{
  font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);margin:32px 0 6px;display:flex;align-items:center;gap:12px;
}
.ledger-label::after{content:'';flex:1;height:1px;background:var(--line);}

.row{
  display:flex;align-items:center;gap:16px;padding:15px 14px;margin:0 -14px;border-radius:12px;
  border-bottom:1px solid var(--line-soft);transition:background .18s ease;
}
.row:hover{background:var(--glass-soft);}
.row .serial{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-faint);width:30px;flex-shrink:0;font-variant-numeric:tabular-nums;}
.row .rlabel{flex:1;font-size:14.5px;line-height:1.4;}
.row .rlabel .note{display:block;font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-faint);margin-top:4px;letter-spacing:.01em;}

.checkbox{
  width:21px;height:21px;border-radius:7px;border:1.5px solid var(--ink-faint);flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .24s cubic-bezier(.2,.7,.2,1);
  background:var(--glass-soft);
}
.checkbox svg{width:11px;height:11px;opacity:0;transition:opacity .2s ease .05s;}
.row.checked .checkbox{
  background:var(--accent);border-color:var(--accent);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.5), inset 0 -2px 4px rgba(0,0,0,.3), 0 5px 16px -4px var(--accent);
  transform:scale(1.06);
}
.row.checked .checkbox svg{opacity:1;}
.row.checked .rlabel{color:var(--ink);}
.row:not(.checked) .rlabel{color:var(--ink-dim);}
.row.habit.reached{border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.04);}
.row.habit.reached .hmeta{color:var(--good);}

.numfield{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.numfield input{
  width:80px;background:rgba(255,255,255,.04);border:1px solid var(--glass-border);border-radius:8px;color:var(--ink);
  font-family:'DM Mono',monospace;font-size:12.5px;padding:8px 10px;text-align:right;
  transition:border-color .18s, background .18s, box-shadow .18s;
}
.numfield input:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.07);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);}
.numfield .unit{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--ink-faint);white-space:nowrap;}

.direction-list{display:flex;flex-direction:column;}
.dline{
  display:flex;align-items:flex-start;gap:13px;padding:11px 14px;margin:0 -14px;border-radius:10px;cursor:pointer;
  border-bottom:1px solid var(--line-soft);transition:background .16s;
}
.dline:hover{background:var(--glass-soft);}
.dline .mark{font-family:'Playfair Display',serif;font-style:italic;font-size:16px;color:var(--accent);flex-shrink:0;width:14px;}
.dline span{font-size:13.5px;line-height:1.55;}
.dline.checked span{color:var(--ink);}
.dline:not(.checked) span{color:var(--ink-dim);}

.intro-note{
  font-size:13px;color:var(--ink-faint);line-height:1.7;max-width:620px;margin-bottom:8px;
  font-family:'Playfair Display',serif;font-style:italic;
}

/* ============ ENTRÉE (jouée seulement à la navigation) ============ */
.fade-panel.animate{animation:panelFade .42s cubic-bezier(.2,.7,.2,1);}
@keyframes panelFade{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:translateX(0);}}
@keyframes rowIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fade-panel.animate .row,
.fade-panel.animate .dline{animation:rowIn .42s both;animation-delay:calc(var(--i,0)*26ms + 60ms);}
.fade-panel.animate .m-card{animation:rowIn .5s both;animation-delay:calc(var(--mi,0)*70ms + 120ms);}
.fade-panel.animate .m-phase{animation:rowIn .5s both;animation-delay:calc(var(--mi,0)*45ms + 200ms);}

/* ============ MÉRIDIEN — module financier ============ */
.m-gauge{margin:16px 0 4px;}
.m-gauge-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;}
.m-gauge-now{font-family:'Playfair Display',serif;font-weight:560;font-size:clamp(40px,6vw,64px);color:var(--gold);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 28px rgba(230,57,70,.22);}
.m-gauge-now small{font-size:.3em;color:var(--ink-dim);font-family:'DM Mono',monospace;letter-spacing:.1em;margin-left:6px;}
.m-gauge-goal{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-dim);letter-spacing:.1em;text-align:right;text-transform:uppercase;}
.m-gauge-goal b{display:block;color:var(--ink);font-size:18px;letter-spacing:.02em;font-family:'Playfair Display',serif;margin-top:2px;}
.m-meter{position:relative;height:14px;margin-top:16px;background:var(--paper);border:1px solid var(--glass-border);border-radius:8px;overflow:hidden;}
.m-meter-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:8px;background:linear-gradient(90deg,#7a1520,var(--gold) 70%,#ff8a94);transition:width .85s cubic-bezier(.2,.7,.2,1);box-shadow:0 0 16px 0 rgba(230,57,70,.42);}
.m-meter-ticks{display:flex;justify-content:space-between;margin-top:8px;}
.m-meter-ticks span{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-faint);letter-spacing:.08em;}

.m-console{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:36px 0 8px;}
.m-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
.m-card h3{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 16px;font-weight:500;}
.m-field{display:block;}
.m-field+.m-field{margin-top:14px;}
.m-field label{display:block;font-size:12px;color:var(--ink-dim);letter-spacing:.02em;margin:0 0 6px;}
.m-card input[type=number],.m-card select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-family:'DM Mono',monospace;font-size:14.5px;outline:none;transition:border-color .18s, box-shadow .18s;}
.m-card input[type=number]:focus,.m-card select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,57,70,.16);}
.m-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.m-mini-meter{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:13px;}
.m-mini-fill{height:100%;width:0;background:linear-gradient(90deg,#5f7d68,var(--good));transition:width .7s cubic-bezier(.2,.7,.2,1);}
.m-readout{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-dim);margin-top:11px;line-height:1.5;}
.m-readout b{color:var(--ink);}
.m-proj{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
.m-proj-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:8px;}
.m-proj-line span{font-size:13px;color:var(--ink-dim);}
.m-proj-line b{font-family:'Playfair Display',serif;font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums;}
.m-proj-note{font-size:11px;color:var(--ink-faint);margin-top:13px;line-height:1.5;}

.m-phases-head{display:flex;justify-content:space-between;align-items:flex-end;margin:50px 0 8px;flex-wrap:wrap;gap:16px;}
.m-phases-head h3{font-family:'Playfair Display',serif;font-weight:560;font-size:25px;margin:0;}
.m-legend{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--ink-dim);letter-spacing:.04em;display:flex;gap:16px;flex-wrap:wrap;}
.m-legend i{font-style:normal;display:inline-flex;align-items:center;gap:6px;}
.m-dot{width:9px;height:9px;border-radius:2px;transform:rotate(45deg);display:inline-block;}
.m-dot.cur{background:var(--gold);}.m-dot.done{background:var(--good);}.m-dot.todo{background:var(--line);}

.m-rail{position:relative;margin:30px 0 0;padding-left:8px;}
.m-rail::before{content:"";position:absolute;left:23px;top:14px;bottom:34px;width:2px;background:var(--line);z-index:0;}
.m-rail.lit::before{background:linear-gradient(var(--good),var(--gold));}
.m-phase{position:relative;display:grid;grid-template-columns:48px 1fr;gap:20px;padding:0 0 22px;z-index:1;}
.m-node{width:48px;display:flex;justify-content:center;padding-top:4px;}
.m-diamond{width:26px;height:26px;transform:rotate(45deg);border:2px solid var(--line);background:var(--bg);border-radius:5px;display:flex;align-items:center;justify-content:center;transition:all .4s;flex:0 0 auto;}
.m-diamond .num{transform:rotate(-45deg);font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-dim);}
.m-phase.is-done .m-diamond{border-color:var(--good);background:var(--good-soft);}
.m-phase.is-done .m-diamond .num{color:var(--good);}
.m-phase.is-current .m-diamond{border-color:var(--gold);background:rgba(230,57,70,.16);box-shadow:0 0 0 5px rgba(230,57,70,.10),0 0 24px rgba(230,57,70,.28);}
.m-phase.is-current .m-diamond .num{color:var(--gold);}
.m-pcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;transition:border-color .3s;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
.m-phase.is-current .m-pcard{border-color:rgba(230,57,70,.5);}
.m-phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.m-ptag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 6px;}
.m-ptitle{font-family:'Playfair Display',serif;font-size:24px;font-weight:560;line-height:1.05;margin:0;}
.m-pmeta{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap;padding-top:6px;}
.m-pobj{color:var(--ink-dim);font-family:'Playfair Display',serif;font-style:italic;font-size:16px;margin:12px 0 4px;}
.m-checks{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:2px;}
.m-checks li{margin:0;}
.m-checks label{display:flex;gap:11px;align-items:flex-start;cursor:pointer;color:var(--ink);font-size:14px;padding:7px 8px;border-radius:8px;margin:0;transition:background .2s;}
.m-checks label:hover{background:var(--glass-soft);}
.m-checks input{appearance:none;-webkit-appearance:none;width:18px;height:18px;flex:0 0 auto;margin-top:1px;border:1.5px solid var(--line);border-radius:5px;background:var(--bg);cursor:pointer;position:relative;transition:all .2s;}
.m-checks input:checked{border-color:var(--good);background:var(--good-soft);}
.m-checks input:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--good);border-width:0 2px 2px 0;transform:rotate(45deg);}
.m-checks label.ticked span{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--line);}
.m-exit{display:flex;gap:9px;align-items:center;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-dim);}
.m-exit .arrow{color:var(--gold);font-family:'DM Mono',monospace;}
.m-exit b{color:var(--ink);font-weight:500;}
.m-pbar{height:4px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:14px;}
.m-pbar i{display:block;height:100%;width:0;background:var(--good);transition:width .5s cubic-bezier(.2,.7,.2,1);}

footer{
  padding:26px 50px;text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-size:13px;
  color:var(--ink-faint);border-top:1px solid var(--glass-border);background:var(--glass);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
footer .save-state{font-family:'DM Mono',monospace;font-style:normal;font-size:11px;letter-spacing:.04em;color:var(--ink-dim);margin-bottom:10px;}
footer .fine{font-style:normal;font-family:'DM Mono',monospace;font-size:10.5px;line-height:1.7;color:var(--ink-faint);max-width:780px;margin:10px auto 0;letter-spacing:.01em;}

/* ===== Splash d'ouverture ===== */
#splash{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#splash.go{display:flex;animation:splashOut .7s ease 1.5s forwards;}
#splash::before{content:'';position:absolute;inset:0;background:radial-gradient(600px 400px at 50% 42%, rgba(230,57,70,.14), transparent 60%);pointer-events:none;}
.splash-mark{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(46px,10vw,88px);letter-spacing:.1em;color:var(--ink);opacity:0;animation:splashIn 1.05s cubic-bezier(.2,.7,.2,1) forwards;}
.splash-sub{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-faint);opacity:0;animation:splashIn 1s ease .28s forwards;}
@keyframes splashIn{from{opacity:0;transform:translateY(12px) scale(.97);}to{opacity:1;transform:none;}}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none;}}

/* ===== Portail du matin : Vision & Manifeste avant tout le reste ===== */
#morningGate{position:fixed;inset:0;z-index:150;background:var(--bg);overflow-y:auto;
  padding:48px 20px 60px;animation:modalIn .3s ease;}
#morningGate::before{content:'';position:fixed;inset:0;z-index:-1;
  background:radial-gradient(600px 420px at 50% 0%, rgba(230,57,70,.12), transparent 62%);pointer-events:none;}
.mg-inner{max-width:560px;margin:0 auto;}
.mg-eyebrow{text-align:center;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.mg-title{text-align:center;font-family:'Playfair Display',serif;font-weight:700;
  font-size:clamp(26px,5vw,36px);color:var(--ink);margin-bottom:10px;}
.mg-sub{text-align:center;font-size:13.5px;color:var(--ink-dim);line-height:1.5;margin-bottom:32px;}
.mg-enter{display:block;width:100%;margin-top:26px;}
.mg-enter:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4);}

/* ===== Tableau de bord ===== */
.dash-hero{margin:6px 0 40px;}
.dash-hero-text .eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;}
.dash-hero-text .eyebrow::before{content:'';width:22px;height:1px;background:var(--gold);opacity:.8;}
.dash-figure{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:18px;}
.dash-num{font-family:'Playfair Display',serif;font-size:clamp(46px,8vw,74px);font-weight:560;line-height:.9;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(230,57,70,.26);}
.dash-figure-lbl{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}
.dash-overall-bar{height:7px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden;max-width:520px;border:1px solid var(--glass-border);}
.dash-overall-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#7a1520,var(--gold));box-shadow:0 0 12px 0 rgba(230,57,70,.4);transition:width .8s cubic-bezier(.2,.7,.2,1);}
.dash-sub{font-family:'Playfair Display',serif;font-style:italic;color:var(--ink-dim);font-size:16px;margin-top:16px;max-width:48ch;}

.dash-section{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin:34px 0 14px;display:flex;align-items:center;gap:12px;}
.dash-section::after{content:'';flex:1;height:1px;background:var(--line);}

.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.dash-card{text-align:left;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);color:inherit;font:inherit;position:relative;overflow:hidden;}
.dash-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent,var(--gold)) 45%,var(--line));box-shadow:0 14px 30px -18px rgba(0,0,0,.7);}
.dash-card::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent,var(--gold));opacity:0;transition:opacity .2s;}
.dash-card:hover::before{opacity:1;}
.dc-top{display:flex;justify-content:space-between;align-items:baseline;}
.dc-num{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--ink-faint);}
.dc-pct{font-family:'Playfair Display',serif;font-size:26px;font-weight:560;color:var(--accent,var(--gold));font-variant-numeric:tabular-nums;}
.dc-title{font-size:15px;font-weight:500;margin:8px 0 0;color:var(--ink);}
.dc-meta{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--ink-faint);margin-top:5px;}
.dc-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:14px;}
.dc-bar i{display:block;height:100%;border-radius:3px;background:var(--accent,var(--gold));box-shadow:0 0 8px 0 var(--accent,var(--gold));transition:width .7s cubic-bezier(.2,.7,.2,1);}

.attention{display:flex;flex-direction:column;gap:8px;}
.att{display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;background:var(--glass-soft);border:1px solid var(--glass-border);border-left:3px solid var(--ink-faint);border-radius:10px;padding:13px 16px;color:var(--ink-dim);font:inherit;font-size:13.5px;line-height:1.45;transition:background .18s,transform .18s,color .18s;}
.att:hover{background:rgba(255,255,255,.05);transform:translateX(2px);color:var(--ink);}
.att.urgent{border-left-color:var(--garnet);}
.att.todo{border-left-color:var(--gold);}
.att.soft{border-left-color:var(--petrol);}
.att .att-ic{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-faint);flex-shrink:0;}
.att.urgent .att-ic{color:var(--garnet);}
.att.todo .att-ic{color:var(--gold);}
.att.soft .att-ic{color:var(--petrol);}
.att-empty{color:var(--ink-faint);font-family:'Playfair Display',serif;font-style:italic;padding:6px 2px;font-size:14px;}
.fade-panel.animate .dash-card{animation:rowIn .5s both;animation-delay:calc(var(--mi,0)*70ms + 140ms);}
.fade-panel.animate .att{animation:rowIn .45s both;animation-delay:calc(var(--mi,0)*55ms + 280ms);}

/* ===== Momentum ===== */
.momentum{display:grid;grid-template-columns:minmax(220px,1fr) 1.25fr;gap:16px;align-items:stretch;}
.mom-curve{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);display:flex;flex-direction:column;justify-content:center;}
.mom-curve svg{display:block;}
.mom-curve-foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:var(--ink-faint);}
.mom-curve-foot b{font-size:12px;font-weight:500;}
.mom-empty{font-family:'Playfair Display',serif;font-style:italic;color:var(--ink-faint);font-size:14px;padding:8px 2px;line-height:1.5;}
.mom-chips{display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;}
.mom-chip{display:flex;align-items:baseline;gap:6px;background:var(--glass-soft);border:1px solid var(--glass-border);border-radius:12px;padding:11px 15px;}
.mom-chip b{font-family:'Playfair Display',serif;font-size:22px;font-weight:560;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums;}
.mom-chip span{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-faint);}
.mom-chip em{font-style:normal;font-size:12.5px;color:var(--ink-dim);margin-left:5px;}
@media(max-width:760px){.momentum{grid-template-columns:1fr;}}

/* ===== Habitude — bande 7 jours ===== */
.row.habit{align-items:center;}
.tag-habit{color:var(--accent)!important;letter-spacing:.04em;}
.tag-jalon{color:var(--ink-faint)!important;letter-spacing:.1em;text-transform:uppercase;font-size:9.5px!important;}
.habit-side{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0;}
.hstrip{display:flex;gap:5px;}
.hcell{width:27px;height:31px;border-radius:7px;border:1px solid var(--line);background:var(--glass-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .18s cubic-bezier(.2,.7,.2,1);}
.hcell span{font-family:'DM Mono',monospace;font-size:9px;color:var(--ink-faint);text-transform:uppercase;}
.hcell:hover{border-color:var(--ink-faint);transform:translateY(-1px);}
.hcell.on{background:var(--accent);border-color:var(--accent);box-shadow:0 4px 12px -4px var(--accent);}
.hcell.on span{color:#15141A;font-weight:600;}
.hcell.today{outline:2px solid color-mix(in srgb,var(--accent) 42%,transparent);outline-offset:2px;}
.hcell:focus-visible{outline:2px solid var(--ring);outline-offset:2px;}
.hmeta{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-faint);letter-spacing:.04em;}

/* ===== num : rowtop + sparkline + jauge objectif ===== */
.row.num{display:block;}
.row.num .rowtop{display:flex;align-items:center;gap:16px;}
.spark-wrap{flex-shrink:0;display:flex;align-items:center;}
.spark{display:block;opacity:.92;}
.goalbar{display:flex;align-items:center;gap:12px;margin:11px 0 0 46px;}
.goalbar-track{flex:1;max-width:300px;height:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;}
.goalbar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.2,.7,.2,1);}
.goalbar-tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.04em;color:var(--ink-faint);white-space:nowrap;}
.goalbar-tag.reached{color:var(--good);}

/* ===== addiction : carte série ===== */
.row.streak .streak-side{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.streak-num{font-family:'Playfair Display',serif;font-size:30px;font-weight:560;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;}
.streak-num small{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-faint);letter-spacing:.04em;font-weight:400;}
.streak-btn{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:9px 14px;border-radius:999px;cursor:pointer;border:1px solid var(--glass-border);background:var(--glass-soft);color:var(--ink-dim);transition:all .2s;}
.streak-btn:hover{transform:translateY(-1px);color:var(--ink);}
.streak-btn.relapse:hover{border-color:rgba(192,116,116,.5);background:rgba(192,116,116,.1);color:#e0a3a0;}
.streak-btn.start:hover{border-color:rgba(230,57,70,.5);background:rgba(230,57,70,.09);color:var(--ink);}

@media (max-width:680px){
  .row.habit{flex-wrap:wrap;}
  .habit-side{width:100%;align-items:flex-start;margin-top:4px;}
  .hcell{width:100%;max-width:40px;height:30px;}
  .hstrip{width:100%;gap:4px;}
  .goalbar{margin-left:0;}
  .row.streak .streak-side{margin-top:6px;}
}

/* ===== Mode édition ===== */
#editBtn.on{border-color:var(--gold);background:var(--gold);color:#15141A;font-weight:500;}
#editBtn.on:hover{background:var(--gold);color:#15141A;}
.item-edit-wrap{display:flex;align-items:center;gap:10px;margin:0 -6px;}
.item-edit-wrap .row{flex:1;min-width:0;}
body.editing .item-edit-wrap .row{pointer-events:none;}
.item-edit-ctrls{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.iec{width:28px;height:28px;border-radius:7px;border:1px solid var(--glass-border);background:var(--glass-soft);color:var(--ink-dim);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0;transition:all .15s;}
.iec:hover{color:var(--ink);border-color:var(--ink-faint);transform:translateY(-1px);}
.iec.del:hover{color:#e0a3a0;border-color:rgba(192,116,116,.5);background:rgba(192,116,116,.1);}
.domain-edit-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--glass-soft);border:1px solid var(--glass-border);border-left:3px solid var(--accent,var(--gold));border-radius:10px;padding:12px 16px;margin:4px 0 16px;}
.deb-name{font-family:'Playfair Display',serif;font-size:18px;color:var(--ink);}
.deb-actions{display:flex;gap:8px;flex-wrap:wrap;}
.deb-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:8px 12px;border-radius:999px;border:1px solid var(--glass-border);background:transparent;color:var(--ink-dim);cursor:pointer;transition:all .18s;}
.deb-btn:hover{color:var(--ink);border-color:var(--ink-faint);}
.deb-btn.del:hover{color:#e0a3a0;border-color:rgba(192,116,116,.5);background:rgba(192,116,116,.1);}
.edit-add-row{margin:14px 0 6px;}

/* ===== Modale ===== */
.modal-ov{position:fixed;inset:0;z-index:50;background:rgba(8,7,11,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:ovIn .2s ease;}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:448px;max-height:88vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--elev);animation:modalIn .25s cubic-bezier(.2,.7,.2,1);}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal h3{font-family:'Playfair Display',serif;font-weight:560;font-size:22px;margin:0 0 18px;}
.mf{display:block;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:14px;}
.mf input,.mf select{display:block;width:100%;margin-top:7px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-family:'DM Sans',sans-serif;font-size:14px;letter-spacing:0;text-transform:none;outline:none;transition:border-color .18s,box-shadow .18s;}
.mf input:focus,.mf select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,57,70,.16);}
.ie-cond{border-top:1px solid var(--line-soft);padding-top:15px;margin-top:2px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;}
.modal-btn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:11px 18px;border-radius:999px;cursor:pointer;border:1px solid var(--glass-border);background:var(--glass-soft);color:var(--ink-dim);transition:all .18s;}
.modal-btn:hover{color:var(--ink);transform:translateY(-1px);}
.modal-btn.ok{background:var(--gold);border-color:var(--gold);color:#15141A;font-weight:500;}
.modal-btn.ok:hover{box-shadow:0 8px 20px -8px var(--gold);}
.modal.confirm{max-width:400px;}
.cf-msg{font-family:'Playfair Display',serif;font-size:16px;line-height:1.55;color:var(--ink);margin:0 0 20px;}
.modal.rw{max-width:440px;}
.rw-title{color:#E63946 !important;font-size:14px !important;font-family:'DM Mono',monospace !important;
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px !important;}
.rw-body{font-size:14.5px;line-height:1.65;color:var(--ink-dim);margin:0 0 22px;}

/* ===== Volet Plan couple ===== */
.pc-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
.pc-card h4{font-family:'Playfair Display',serif;font-weight:560;font-size:18px;margin:0 0 10px;}
.pc-list{margin:0;padding-left:20px;color:var(--ink-dim);font-size:14px;line-height:1.7;}
.pc-list.two{columns:2;column-gap:26px;margin-top:8px;}
.pc-list.two li{break-inside:avoid;}
.pc-rules{display:flex;flex-direction:column;border-top:1px solid var(--line-soft);}
.pc-rule{display:flex;gap:22px;align-items:flex-start;padding:20px 4px;border-bottom:1px solid var(--line-soft);transition:padding-left .2s ease;}
.pc-rule:hover{padding-left:8px;}
.pc-rule-num{font-family:'Playfair Display',serif;font-weight:560;font-size:34px;color:var(--accent);line-height:1;flex:none;width:52px;opacity:.9;}
.pc-rule h4{font-size:15.5px;margin:2px 0 6px;color:var(--ink);}
.pc-rule p{font-size:13.5px;color:var(--ink-dim);margin:0;line-height:1.6;max-width:560px;}
.pc-quote{background:var(--paper-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);padding:22px 26px;margin:26px 0;font-family:'Playfair Display',serif;font-style:italic;font-size:17px;line-height:1.55;color:var(--ink);}
.pc-quote b{color:var(--accent);font-style:normal;}
.pc-callout{background:var(--glass-soft);border:1px solid var(--glass-border);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:18px 22px;margin:22px 0;font-size:14px;color:var(--ink-dim);line-height:1.6;}
.pc-callout b{color:var(--ink);}
.pc-principes{margin:0;padding-left:20px;color:var(--ink-dim);font-size:14px;line-height:1.85;}
.pc-principes li::marker{color:var(--accent);font-family:'DM Mono',monospace;}
.pc-souv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.pc-souv{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:transform .15s ease,border-color .15s ease;}
.pc-souv:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
.pc-souv h4{font-family:'Playfair Display',serif;font-weight:560;font-size:15px;margin:0 0 6px;color:var(--ink);}
.pc-souv p{font-size:12.5px;color:var(--ink-dim);margin:0;line-height:1.5;}
.pc-group{margin-bottom:24px;}
.pc-group-h{font-family:'Playfair Display',serif;font-weight:560;font-size:19px;color:var(--ink);margin:0 0 12px;}
.pc-cat{margin-bottom:14px;}
.pc-cat-l{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;}
.pc-chips{display:flex;flex-wrap:wrap;gap:7px;}
.pc-chip{font-size:12.5px;padding:8px 13px;border-radius:999px;border:1px solid var(--glass-border);background:var(--glass-soft);color:var(--ink-dim);display:inline-flex;align-items:center;gap:7px;}
.pc-chip-txt{cursor:pointer;transition:color .15s;}
.pc-chip-txt:hover{color:var(--ink);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;}
.pc-chip.wahou{border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:var(--ink);background:color-mix(in srgb,var(--accent) 12%,transparent);}
.pc-selector{display:flex;flex-direction:column;gap:14px;margin-bottom:20px;}
.pc-fam{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;}
.pc-fam-l{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);width:64px;flex:none;}
.pc-fam-chips{display:flex;flex-wrap:wrap;gap:7px;flex:1;min-width:0;}
.pc-typechip{font-family:'DM Mono',monospace;font-size:11.5px;padding:8px 14px;border-radius:999px;border:1px solid var(--glass-border);background:var(--glass-soft);color:var(--ink-dim);cursor:pointer;transition:all .18s ease;}
.pc-typechip:hover{border-color:var(--ink-faint);color:var(--ink);transform:translateY(-1px);}
.pc-typechip.active{background:var(--accent);border-color:var(--accent);color:#15141A;font-weight:500;box-shadow:0 6px 16px -6px var(--accent);}
.pc-ideas{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
.pc-ideas-head{font-family:'Playfair Display',serif;font-size:16px;color:var(--ink-dim);margin-bottom:14px;}
.pc-ideas-head b{color:var(--ink);font-weight:560;}
.pc-chip.custom{display:inline-flex;align-items:center;gap:6px;border-color:color-mix(in srgb,var(--accent) 45%,var(--glass-border));color:var(--ink);}
.pc-del{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:15px;line-height:1;padding:0 0 0 2px;transition:color .15s;}
.pc-del:hover{color:var(--accent);}
.pc-add{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.pc-add input{flex:1;min-width:180px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-family:'DM Sans',sans-serif;font-size:13.5px;outline:none;transition:border-color .18s,box-shadow .18s;}
.pc-add input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent);}
.pc-add button{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:11px 18px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#15141A;font-weight:500;cursor:pointer;transition:all .18s;}
.pc-add button:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px var(--accent);}
@media(max-width:560px){.pc-list.two{columns:1;}}

/* ===== Suppression d'objectif par ligne (toujours visible) ===== */
.item-del-wrap{display:flex;align-items:center;gap:10px;margin:0 -6px;}
.mini-folders{margin-bottom:10px;}
.item-del-wrap>.row,.item-del-wrap>.dline{flex:1;min-width:0;}
.iec.solo{flex:none;width:22px;height:22px;border:none;background:none;color:var(--ink-faint);
  font-size:19px;line-height:1;opacity:.45;transition:opacity .15s,color .15s,transform .15s;}
.iec.solo:hover{opacity:1;color:#ff8a94;background:none;border:none;transform:none;}
.iec.rn{flex:none;width:22px;height:22px;border:none;background:none;color:var(--ink-faint);
  font-size:13px;opacity:.4;transition:opacity .15s,color .15s;}
.iec.rn:hover{opacity:1;color:var(--tangerine,var(--gold));}

/* ===== Volet Red flags ===== */
.rf-golden{background:var(--paper-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);padding:22px 26px;margin:14px 0 30px;}
.rf-golden-l{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
.rf-golden p{font-family:'Playfair Display',serif;font-size:17px;line-height:1.55;color:var(--ink);margin:0;}
.rf-golden b{color:var(--accent);}
.rf-formulas{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.rf-formula{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-dim);background:var(--glass-soft);border:1px solid var(--glass-border);border-radius:8px;padding:9px 13px;}
.rf-sec{margin-bottom:24px;}
.rf-sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line);}
.rf-roman{font-family:'Playfair Display',serif;font-weight:560;font-size:22px;color:var(--accent);line-height:1;flex:none;width:34px;}
.rf-sec-h h4{font-family:'Playfair Display',serif;font-weight:560;font-size:18px;margin:0;color:var(--ink);}
.rf-list{display:flex;flex-direction:column;gap:2px;}
.rf-item{display:flex;gap:13px;align-items:flex-start;padding:10px 8px;border-radius:9px;transition:background .15s ease;cursor:pointer;}
.rf-item.on{background:rgba(230,57,70,.09);}
.rf-item.on b{color:#ff8a94;}
.rf-box{flex:none;width:20px;height:20px;border-radius:6px;margin-top:2px;}
.rf-eval{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:24px;}
.rf-nom{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;margin-bottom:14px;}
.rf-nom:focus{border-color:var(--accent);}
.rf-score{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.rf-score-n{font-family:'Playfair Display',serif;font-weight:700;font-size:30px;}
.rf-score-l{flex:1;font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-faint);}
.rf-verdict{border-left:3px solid var(--line);padding:2px 0 2px 14px;}
.rf-verdict b{display:block;font-family:'Playfair Display',serif;font-size:16px;margin-bottom:10px;}
.rf-verdict p{font-size:13.5px;color:var(--ink-dim);line-height:1.6;margin:0 0 9px;}
.rf-verdict p:last-child{margin-bottom:0;}
.rf-item:hover{background:var(--glass-soft);}
.rf-flag{color:var(--accent);font-size:13px;line-height:1.5;flex:none;opacity:.85;}
.rf-item b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px;font-weight:600;}
.rf-item span{font-size:13px;color:var(--ink-dim);line-height:1.5;}
.rf-tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.rf-test{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px 17px;}
.rf-test b{display:block;font-family:'Playfair Display',serif;font-weight:560;font-size:15px;color:var(--ink);margin-bottom:5px;}
.rf-test span{font-size:12.5px;color:var(--ink-dim);line-height:1.5;}
.rf-notes{margin-top:22px;border-top:1px solid var(--line-soft);padding-top:16px;}
.rf-notes p{font-size:13px;color:var(--ink-dim);line-height:1.65;margin:0 0 10px;font-style:italic;font-family:'Playfair Display',serif;}

/* ===== Pages écriture & vie ===== */
.spark-hit{cursor:pointer;}
.spark:hover .spark-dot{r:2.2;}

/* Manifeste */
.mn-text{width:100%;min-height:280px;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);padding:26px 30px;color:var(--ink);font-family:'Playfair Display',serif;font-size:18px;line-height:1.75;outline:none;resize:none;overflow:hidden;transition:border-color .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
.mn-text:focus{border-color:var(--accent);}
.mn-text::placeholder{color:var(--ink-faint);font-style:italic;}
.mn-save{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--ink-faint);margin-top:10px;text-align:right;}

/* Pilotage */
.pl-head{font-family:'Playfair Display',serif;font-style:italic;font-size:16px;color:var(--accent);margin:8px 0 20px;}
.pl-q{margin-bottom:20px;}
.pl-q label{display:block;font-size:14.5px;color:var(--ink);margin-bottom:8px;line-height:1.4;}
.pl-q textarea{width:100%;min-height:44px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px 14px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.6;outline:none;resize:none;overflow:hidden;transition:border-color .18s,box-shadow .18s;}
.pl-q textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);}
.pl-past{margin-top:30px;}
.pl-old{background:var(--glass-soft);border:1px solid var(--glass-border);border-radius:11px;padding:4px 16px;margin-bottom:8px;}
.pl-old summary{cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-dim);padding:12px 0;letter-spacing:.03em;}
.pl-oldq{padding:6px 0 12px;}
.pl-oldq b{display:block;font-size:13px;color:var(--ink);margin-bottom:3px;}
.pl-oldq p{font-size:13px;color:var(--ink-dim);margin:0;line-height:1.55;white-space:pre-wrap;}

/* Notes (souvenirs / machine à idées) */
.nb-add-row{margin-bottom:16px;}
.nb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start;}
.nb-empty{font-family:'Playfair Display',serif;font-style:italic;color:var(--ink-faint);font-size:15px;padding:8px 2px;}
.nb-card{background:var(--paper);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:12px;padding:14px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
.nb-title{width:100%;background:none;border:none;color:var(--ink);font-family:'Playfair Display',serif;font-weight:560;font-size:16px;outline:none;padding:0 0 6px;}
.nb-title::placeholder{color:var(--ink-faint);}
.nb-body{width:100%;min-height:44px;background:none;border:none;color:var(--ink-dim);font-family:'DM Sans',sans-serif;font-size:13.5px;line-height:1.6;outline:none;resize:none;overflow:hidden;}
.nb-body::placeholder{color:var(--ink-faint);}
.nb-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--line-soft);}
.nb-foot span{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.04em;color:var(--ink-faint);}
.nb-del{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:18px;line-height:1;padding:0 4px;opacity:.5;transition:color .15s,opacity .15s;}
.nb-del:hover{color:#ff8a94;opacity:1;}
.nb-del.sm{font-size:13px;}

/* Bibliothèque */
.lib-sel{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px;}
.lib-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:start;}
.lib-col{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;}
.lib-col-h{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
.lib-items{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.lib-it{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;background:var(--glass-soft);border:1px solid var(--glass-border);border-radius:8px;padding:9px 11px;}
.lib-it span{font-size:13px;color:var(--ink-dim);line-height:1.45;}
.lib-add{display:flex;gap:6px;}
.lib-add input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .18s;}
.lib-add input:focus{border-color:var(--accent);}
.lib-add button{flex:none;width:34px;border:1px solid var(--accent);background:var(--accent);color:#15141A;border-radius:8px;font-size:16px;cursor:pointer;transition:transform .15s;}
.lib-add button:hover{transform:translateY(-1px);}

/* Carte des relations */
.rm-group{margin-bottom:20px;}
.rm-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.rm-card{position:relative;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:15px 17px;cursor:pointer;transition:transform .15s,border-color .15s;}
.rm-card:hover{transform:translateY(-2px);}
.rm-card .nb-del{position:absolute;top:8px;right:8px;}
.rm-name{font-family:'Playfair Display',serif;font-weight:560;font-size:16px;color:var(--ink);padding-right:20px;}
.rm-lien{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:var(--accent);margin-top:3px;}
.rm-note{font-size:12.5px;color:var(--ink-dim);margin-top:8px;line-height:1.5;}

/* ===== Phases d'objectifs ===== */
.phase-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:30px 0 14px;padding:13px 16px;border-radius:11px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent);border:1px solid var(--line);border-left:3px solid var(--accent);}
.phase-head.complete{border-left-color:var(--good);}
.phase-head.complete .ph-count{color:var(--good);}
.ph-left{display:flex;align-items:baseline;gap:11px;min-width:0;}
.ph-num{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
.ph-name{font-family:'Playfair Display',serif;font-weight:600;font-size:17px;color:var(--ink);}
.ph-right{display:flex;align-items:center;gap:12px;}
.ph-count{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--ink-dim);}
.ph-bar{width:88px;height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;}
.ph-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;box-shadow:0 0 8px 0 var(--accent);transition:width .6s cubic-bezier(.2,.7,.2,1);}

/* ===== Calendrier & RDV ===== */
.cal-card{position:relative;display:flex;gap:16px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:9px;cursor:pointer;transition:transform .15s,border-color .15s;}
.cal-card:hover{transform:translateX(3px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
.cal-card.today{border-left:3px solid var(--accent);box-shadow:0 8px 24px -14px var(--accent);}
.cal-date{flex:none;width:48px;text-align:center;padding-top:2px;}
.cal-date b{display:block;font-family:'Playfair Display',serif;font-weight:700;font-size:24px;line-height:1;color:var(--accent);}
.cal-date span{display:block;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:3px;}
.cal-main{flex:1;min-width:0;padding-right:22px;}
.cal-title{font-family:'Playfair Display',serif;font-weight:600;font-size:16px;color:var(--ink);}
.cal-meta{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:var(--ink-faint);margin-top:3px;text-transform:capitalize;}
.cal-note{font-size:13px;color:var(--ink-dim);margin-top:7px;line-height:1.5;}
.cal-card .nb-del{position:absolute;top:12px;right:12px;}
.cal-fait{position:absolute;top:12px;right:40px;width:22px;height:22px;border-radius:7px;
  border:1px solid var(--line);background:var(--bg);color:var(--good);font-size:12px;cursor:pointer;
  transition:all .15s;padding:0;}
.cal-fait:hover{border-color:var(--good);}
.cal-card.fait{opacity:.6;}
.cal-card.fait .cal-fait{background:rgba(63,185,80,.16);border-color:var(--good);}
.cal-card.fait .cal-title{text-decoration:line-through;}
.rj-l.fait{opacity:.55;}
.rj-l.fait .rj-n{text-decoration:line-through;}
.rj-ok{color:var(--good);font-size:12px;flex:none;}
.cal-past{opacity:.5;}

/* ===== Mini-tâches ===== */
.phase-head.section{background:linear-gradient(135deg,rgba(255,255,255,.05),transparent);}
.phase-head.section .ph-num{color:var(--ink-faint);}
.mini-toggle{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px;}
.mt-b{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--glass-soft);
  color:var(--ink-faint);font-family:'DM Mono',monospace;font-size:11.5px;cursor:pointer;transition:all .15s;}
.mt-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--cat,var(--tangerine));
  box-shadow:0 0 5px -1px var(--cat,var(--tangerine));}
.mt-b b{font-weight:500;opacity:.7;}
.mt-b:hover{border-color:var(--cat,var(--tangerine));color:var(--ink-dim);}
.mt-b.active{background:var(--cat,var(--tangerine));border-color:var(--cat,var(--tangerine));color:#15141A;}
.mt-b.active .mt-dot{background:#15141A;box-shadow:none;}
.mt-b.active b{opacity:.85;}
.mini-empty{font-size:13px;color:var(--ink-faint);font-style:italic;padding:10px 4px;}
.mf-check{display:flex !important;align-items:center;gap:9px;text-transform:none;letter-spacing:0;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink-dim);cursor:pointer;}
.mf-check input{width:16px;height:16px;margin:0;accent-color:var(--gold);cursor:pointer;}

/* ===== Phases : onglets ===== */
.phase-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px;}
.phase-tab{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:9px 15px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass-soft);color:var(--ink-dim);cursor:pointer;transition:all .18s ease;text-align:left;}
.phase-tab:hover{transform:translateY(-1px);border-color:var(--ink-faint);color:var(--ink);}
.phase-tab.active{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 26%,transparent),color-mix(in srgb,var(--accent) 8%,transparent));border-color:var(--accent);color:var(--ink);box-shadow:0 8px 22px -10px var(--accent);}
.pt-n{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;}
.phase-tab.active .pt-n{color:var(--accent);opacity:1;}
.pt-name{font-family:'Playfair Display',serif;font-weight:600;font-size:14px;}
.phase-tab.add{justify-content:center;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.05em;border-style:dashed;color:var(--ink-faint);}
.phase-tab.add:hover{color:var(--ink);border-color:var(--accent);}
.ph-rename{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:12px;padding:2px 5px;border-radius:6px;transition:color .15s,background .15s;}
.ph-rename:hover{color:var(--accent);background:var(--glass-soft);}

/* ===== Mini-tâches (orangé) ===== */
.phase-head.mini-head{--accent:var(--tangerine);background:linear-gradient(135deg,rgba(245,158,11,.16),transparent);border-left-color:var(--tangerine);}
.phase-head.mini-head .ph-num,.phase-head.mini-head .ph-name{color:var(--tangerine);}
.phase-head.mini-head .ph-name{color:var(--ink);}
.row.mini-row{border-left:2px solid color-mix(in srgb,var(--accent,var(--tangerine)) 55%,transparent);}
.edit-add.tangerine:hover{border-color:var(--cat,var(--tangerine));color:var(--cat,var(--tangerine));background:rgba(245,158,11,.06);}

/* ===== Routines sociales ===== */
.rt-item{display:flex;align-items:center;gap:13px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin-bottom:8px;transition:border-color .15s;}
.rt-item:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
.rt-n{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-faint);flex:none;}
.rt-txt{flex:1;min-width:0;font-size:14px;color:var(--ink);line-height:1.45;}
.rt-add{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.rt-add input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px 14px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .18s,box-shadow .18s;}
.rt-add input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent);}
.rt-add button{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:500;cursor:pointer;transition:transform .15s,box-shadow .2s;}
.rt-add button:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px var(--accent);}

/* heure du rendez-vous */
.cal-hour{display:inline-block;font-family:'DM Mono',monospace;font-style:normal;font-size:11.5px;font-weight:500;color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:6px;padding:3px 7px;margin-top:7px;letter-spacing:.03em;white-space:nowrap;}
.cal-date{flex:none;width:62px;text-align:center;padding-top:2px;}

.phase-tab.add{display:none;}
.pt-caret{font-size:9px;color:var(--accent);margin-left:2px;}
.phase-tab{position:relative;}
.phase-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:212px;background:#151515;border:1px solid var(--line);border-radius:11px;padding:6px;box-shadow:var(--elev);display:flex;flex-direction:column;gap:2px;animation:modalIn .16s ease;}
.phase-menu button{text-align:left;background:none;border:none;color:var(--ink-dim);font-family:'DM Sans',sans-serif;font-size:13px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s;}
.phase-menu button:hover{background:var(--glass-soft);color:var(--ink);}
.phase-menu button.danger:hover{color:#ff8a94;background:rgba(230,57,70,.12);}

/* ===== Manifeste ===== */
.mf-doc{margin-bottom:30px;}
.mf-sec{margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--line-soft);}
.mf-sec:last-child{border-bottom:none;}
.mf-h{display:flex;align-items:baseline;gap:13px;margin-bottom:12px;}
.mf-r{font-family:'Playfair Display',serif;font-weight:700;font-size:20px;color:var(--accent);line-height:1;flex:none;min-width:34px;}
.mf-h h4{font-family:'Playfair Display',serif;font-weight:600;font-size:20px;margin:0;color:var(--ink);letter-spacing:.005em;}
.mf-sec p{font-family:'Playfair Display',serif;font-size:16px;line-height:1.75;color:var(--ink-dim);margin:0 0 13px;padding-left:47px;}
.mf-sec p:last-child{margin-bottom:0;}
.mf-li{list-style:none;padding:0 0 0 47px;margin:0 0 13px;}
.mf-li li{position:relative;font-family:'Playfair Display',serif;font-size:16px;line-height:1.7;color:var(--ink);padding-left:18px;margin-bottom:7px;}
.mf-li li::before{content:'◆';position:absolute;left:0;top:1px;font-size:8px;color:var(--accent);}
@media(max-width:620px){.mf-sec p,.mf-li{padding-left:0;}}

.phase-tabs{display:none;}
.phase-head.clickable{position:relative;cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s;}
.phase-head.clickable:hover{transform:translateX(2px);box-shadow:0 10px 26px -16px var(--accent);}
.phase-head.clickable:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.ph-caret{font-size:9px;color:var(--accent);margin-left:8px;opacity:.8;}
.phase-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:232px;background:#151515;border:1px solid var(--line);border-radius:11px;padding:6px;box-shadow:var(--elev);display:flex;flex-direction:column;gap:2px;animation:modalIn .16s ease;cursor:default;}
.phase-menu button{text-align:left;background:none;border:none;color:var(--ink-dim);font-family:'DM Sans',sans-serif;font-size:13px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s;}
.phase-menu button:hover{background:var(--glass-soft);color:var(--ink);}
.phase-menu button.danger:hover{color:#ff8a94;background:rgba(230,57,70,.12);}
.pm-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);padding:8px 12px 4px;}
.pm-sep{height:1px;background:var(--line-soft);margin:5px 8px;}

/* sélecteur d'heure */
.time-pick{display:flex;align-items:center;gap:8px;margin-top:7px;}
.time-pick select{flex:0 0 auto;width:82px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px 10px;font-family:'DM Mono',monospace;font-size:15px;text-align:center;outline:none;cursor:pointer;transition:border-color .18s,box-shadow .18s;}
.time-pick select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,57,70,.16);}
.tp-sep{font-family:'DM Mono',monospace;font-size:16px;color:var(--ink-faint);}

.build-stamp{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);opacity:.55;margin-top:10px;}

.phase-menu{display:none;}
.pm-label{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin:4px 0 8px;}
.pm-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.pm-btn{text-align:left;background:var(--glass-soft);border:1px solid var(--glass-border);color:var(--ink-dim);font-family:'DM Sans',sans-serif;font-size:13.5px;padding:12px 14px;border-radius:9px;cursor:pointer;transition:all .16s;}
.pm-btn:hover{background:var(--paper-2);color:var(--ink);border-color:var(--ink-faint);transform:translateX(2px);}
.pm-btn.danger:hover{color:#ff8a94;border-color:rgba(230,57,70,.5);background:rgba(230,57,70,.12);}
.pl-sec{margin-bottom:26px;}
.pl-note{font-family:'Playfair Display',serif;font-style:italic;font-size:14px;line-height:1.6;color:var(--ink-dim);background:var(--glass-soft);border-left:2px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 16px;margin-bottom:16px;}

/* ===== Historique & sauvegardes ===== */
.cloud-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:10px;}
.cloud-head{display:flex;align-items:center;gap:10px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);}
.cloud-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:none;}
.cloud-dot.on{background:var(--good);box-shadow:0 0 10px 0 var(--good);}
.cloud-dot.off{background:var(--ink-faint);}
.cloud-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.cloud-status{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.03em;color:var(--ink-faint);margin-top:10px;min-height:14px;}
.cloud-status.ok{color:var(--good);}
.cloud-status.err{color:#ff8a94;}
.cloud-note{font-size:12.5px;color:var(--ink-faint);line-height:1.6;margin:14px 0 0;}
.hist-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);}
.hist-row:last-child{border-bottom:none;}
.hist-row b{display:block;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:600;color:var(--ink);}
.hist-row span{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-faint);margin-top:2px;}
.pm-btn.sm{padding:8px 14px;font-size:12px;flex:none;}

/* rotation du pilotage */
.pl-rot{font-family:'DM Sans',sans-serif;font-size:13.5px;color:var(--ink-dim);background:var(--glass-soft);border:1px solid var(--glass-border);border-left:2px solid var(--accent);border-radius:0 9px 9px 0;padding:11px 15px;margin-bottom:20px;line-height:1.5;}
.pl-rot b{color:var(--ink);}
.pl-badge{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.1em;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:999px;padding:2px 7px;margin-left:8px;text-transform:uppercase;}

/* ===== Capture rapide ===== */
#quickBtn{position:fixed;right:20px;bottom:20px;z-index:40;width:44px;height:44px;
  border:none;background:none;color:var(--gold);font-size:26px;line-height:1;cursor:pointer;
  opacity:.75;transition:opacity .18s, transform .18s, color .2s;
  text-shadow:0 2px 12px rgba(0,0,0,.9);}
#quickBtn:hover{opacity:1;transform:scale(1.12);}
#quickBtn.done{color:var(--good);opacity:1;transform:scale(1.2);}
@supports(padding:max(0px)){ #quickBtn{bottom:max(22px, calc(env(safe-area-inset-bottom) + 14px));} }
.qc-text{width:100%;min-height:130px;background:var(--bg);border:1px solid var(--line);border-radius:11px;
  padding:14px 16px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;outline:none;resize:vertical;}
.qc-text:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,57,70,.16);}
.qc-hint{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.04em;color:var(--ink-faint);margin:10px 0 16px;}
.qc-hint b{color:var(--ink-dim);}

/* ===== Rendez-vous récurrents ===== */
.cal-rep{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:999px;padding:1px 6px;}

/* ===== Santé & ressenti ===== */
.sn-top{display:flex;gap:26px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:22px 26px;margin-bottom:8px;}
.sn-body{flex:0 0 168px;perspective:800px;}
.sn-svg{width:168px;height:270px;display:block;animation:snFloat 6s ease-in-out infinite;transform-style:preserve-3d;}
@keyframes snFloat{0%,100%{transform:rotateY(-9deg) translateY(0);}50%{transform:rotateY(9deg) translateY(-6px);}}
.sn-hint{fill:var(--ink-faint);font-family:'DM Mono',monospace;font-size:11px;}
.sn-gauge{flex:1;min-width:180px;}
.sn-score{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(40px,7vw,58px);line-height:1;transition:color .4s;}
.sn-score small{font-size:18px;color:var(--ink-faint);margin-left:4px;}
.sn-lib{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:8px;}
.sn-axe{margin-bottom:16px;}
.sn-axe-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
.sn-axe-l{font-size:14px;color:var(--ink);}
.sn-axe-v{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;transition:color .3s;}
.sn-range{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:4px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,#DC2626,#F59E0B,#3FB950);}
.sn-range.vierge{background:rgba(255,255,255,.1);}
.sn-range::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--c,#fff);
  border:2px solid #0A0A0A;box-shadow:0 2px 10px rgba(0,0,0,.6);cursor:pointer;}
.sn-range::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--c,#fff);border:2px solid #0A0A0A;cursor:pointer;}
.sn-ok{font-family:'Playfair Display',serif;font-style:italic;font-size:15px;color:var(--good);
  background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.25);border-radius:10px;padding:14px 18px;margin-top:16px;}
.sn-adv{background:var(--paper);border:1px solid var(--line);border-left:3px solid #F59E0B;border-radius:10px;padding:16px 18px;margin-bottom:10px;}
.sn-adv h4{font-family:'Playfair Display',serif;font-weight:600;font-size:16px;margin:0 0 10px;color:var(--ink);}
.sn-adv ul{margin:0;padding-left:18px;}
.sn-adv li{font-size:13.5px;color:var(--ink-dim);line-height:1.6;margin-bottom:5px;}
.sn-foot{font-size:12px;color:var(--ink-faint);line-height:1.55;margin-top:14px;font-style:italic;}
@media(max-width:560px){.sn-top{gap:16px;}.sn-body{flex:0 0 130px;}.sn-svg{width:130px;height:210px;}}

/* ===== Limite d'objectifs ===== */
.obj-count{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--ink-faint);margin-top:7px;text-align:right;}
.obj-count.plein{color:#F59E0B;}
.edit-add.bloque{border-color:rgba(245,158,11,.45);color:#F59E0B;background:rgba(245,158,11,.06);cursor:not-allowed;}

/* ===== Notes : dossiers, cartes, lecture ===== */
.nb-folders{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
.nb-fchip{display:inline-flex;align-items:center;gap:7px;font-family:'DM Sans',sans-serif;font-size:12.5px;
  padding:8px 13px;border-radius:999px;border:1px solid var(--glass-border);background:var(--glass-soft);
  color:var(--ink-dim);cursor:pointer;transition:all .16s;}
.nb-fchip:hover{color:var(--ink);border-color:var(--ink-faint);}
.nb-fchip.active{color:var(--ink);border-color:var(--fc,var(--gold));background:color-mix(in srgb,var(--fc,var(--gold)) 16%,transparent);}
.nb-fchip b{font-family:'DM Mono',monospace;font-size:10px;opacity:.7;font-weight:500;}
.nb-fchip.edit{padding:8px 11px;}
.nb-dot{width:8px;height:8px;border-radius:50%;flex:none;}
.nb-card{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--nc,var(--accent));
  border-radius:12px;padding:14px 16px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .2s;}
.nb-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px var(--nc,var(--accent));}
.nb-card-h{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.nb-folder-l{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
.nb-card-t{font-family:'Playfair Display',serif;font-weight:600;font-size:16.5px;color:var(--ink);line-height:1.3;margin-bottom:7px;}
.nb-card-b{font-size:13px;color:var(--ink-dim);line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.nb-vide{color:var(--ink-faint);font-style:italic;}
.note-ov{align-items:flex-start;padding:4vh 20px;}
.note-full{width:100%;max-width:780px;max-height:92vh;display:flex;flex-direction:column;background:var(--paper);
  border:1px solid var(--line);border-radius:16px;padding:22px 26px;box-shadow:var(--elev);animation:modalIn .22s ease;}
.note-top{display:flex;align-items:flex-start;gap:12px;}
.note-title{flex:1;background:none;border:none;color:var(--ink);font-family:'Playfair Display',serif;font-weight:600;
  font-size:clamp(21px,3.4vw,29px);outline:none;padding:0 0 6px;}
.note-title::placeholder{color:var(--ink-faint);}
.note-close{background:none;border:none;color:var(--ink-faint);font-size:17px;cursor:pointer;padding:4px 8px;border-radius:8px;}
.note-close:hover{color:var(--ink);background:var(--glass-soft);}
.note-folders{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px;}
.note-body{flex:1;min-height:340px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:18px 20px;
  color:var(--ink);font-family:'DM Sans',sans-serif;font-size:16px;line-height:1.75;outline:none;resize:none;overflow:auto;}
.note-body:focus{border-color:var(--gold);}
.note-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;
  font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-faint);}
.fold-row{display:flex !important;align-items:center;gap:10px;}
.fold-row input{flex:1;margin-top:0 !important;}

/* ===== Pilotage sans friction ===== */
.pl-line{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.pl-lbl{font-size:14px;color:var(--ink);line-height:1.4;}
.pl-yn{display:inline-flex;gap:6px;flex:none;}
.pl-yn button{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.05em;padding:8px 15px;border-radius:999px;
  border:1px solid var(--glass-border);background:var(--glass-soft);color:var(--ink-faint);cursor:pointer;transition:all .16s;}
.pl-yn button:hover{color:var(--ink);border-color:var(--ink-faint);}
.pl-yn button.on.oui{background:rgba(63,185,80,.16);border-color:var(--good);color:var(--good);}
.pl-yn button.on.non{background:rgba(230,57,70,.14);border-color:var(--gold);color:var(--gold);}
.pl-scale{margin-bottom:18px;}
.pl-scale .pl-line{margin-bottom:8px;}
.pl-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;flex:none;}

/* ===== Planning du jour ===== */
.pn-nav{display:flex;align-items:center;gap:9px;margin-bottom:18px;flex-wrap:wrap;}
.pn-day{flex:1;min-width:150px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink-dim);text-transform:capitalize;}
.pn-day b{color:var(--ink);font-weight:600;}
.pn-row{display:flex;align-items:flex-start;gap:14px;background:var(--paper);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:11px;padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:transform .14s;}
.pn-row:hover{transform:translateX(3px);}
.pn-row.rdv{border-left-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,var(--paper));cursor:default;}
.pn-row.done{opacity:.5;}
.pn-row.done .pn-title{text-decoration:line-through;}
.pn-time{flex:none;width:52px;font-family:'DM Mono',monospace;font-size:13px;color:var(--accent);font-weight:500;}
.pn-time small{display:block;font-size:10px;color:var(--ink-faint);margin-top:2px;}
.pn-main{flex:1;min-width:0;}
.pn-title{font-size:14.5px;color:var(--ink);line-height:1.35;}
.pn-meta{font-size:12px;color:var(--ink-faint);margin-top:3px;}
.pn-check{flex:none;width:24px;height:24px;border-radius:7px;border:1px solid var(--glass-border);background:var(--glass-soft);
  color:var(--good);cursor:pointer;font-size:12px;line-height:1;}
.pn-check:hover{border-color:var(--good);}

/* ===== Budget du mois ===== */
.bg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px;}
.bg-f{display:block;}
.bg-f span{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px;}
.bg-f input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  color:var(--ink);font-family:'DM Mono',monospace;font-size:16px;outline:none;transition:border-color .18s;}
.bg-f input:focus{border-color:var(--gold);}
.bg-sum{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:8px;}
.bg-sum.alerte{border-color:rgba(220,38,38,.45);}
.bg-rest{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:12px;}
.bg-rest span{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
.bg-rest b{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(26px,4.4vw,34px);color:var(--ink);}
.bg-sum.alerte .bg-rest b{color:#ff8a94;}
.bg-bar{height:7px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;}
.bg-bar i{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.7,.2,1);}
.bg-line{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-family:'DM Mono',monospace;font-size:10.5px;color:var(--ink-faint);}
.bg-alerte{margin-top:12px;font-size:12.5px;color:#ff8a94;}
.bg-cat{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:8px;}
.bg-cat.over{border-color:rgba(245,158,11,.4);}
.bg-cat-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px;font-size:14px;color:var(--ink);}
.bg-cat-v{font-family:'DM Mono',monospace;font-size:13px;color:var(--ink-dim);}
.bg-cat-v small{color:var(--ink-faint);font-size:11px;}
.bg-cat.over .bg-cat-v{color:#F59E0B;}
.bg-cat-bar{height:4px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:10px;}
.bg-cat-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s;}
.bg-cat.over .bg-cat-bar i{background:#F59E0B;}
.bg-cat-in{display:flex;gap:10px;}
.bg-cat-in label{flex:1;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);}
.bg-cat-in input{width:100%;margin-top:5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;
  color:var(--ink);font-family:'DM Mono',monospace;font-size:13px;outline:none;}
.bg-cat-in input:focus{border-color:var(--accent);}

/* ===== Budget : répartition automatique ===== */
