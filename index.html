/* --- quiz (thème seul ou examen blanc) --- */
function drawQuiz(box, accent, draw){
  const exam=!!codeVue.exam, i=codeVue.th, z=codeVue.qz;
  if(z.fini) return drawResultat(box, accent, draw);
  const cur=z.list[z.idx], donnee=z.rep[z.idx];
  const justes=z.rep.filter(r=>r&&r.ok).length;
  box.innerHTML=`
    <div class="cd-nav">
      <button class="pm-btn sm" id="qzBack" type="button">← Quitter</button>
      <span class="cd-pos">${z.idx+1} / ${z.list.length} · ${justes} juste${justes>1?'s':''}</span>
    </div>
    <div class="qz-bar"><i style="width:${Math.round((z.idx)/z.list.length*100)}%"></i></div>
    <div class="qz-card">
      <div class="qz-th">${exam?'🎓 Examen '+((codeVue.examN||0)+1)+' · ':''}${esc(cur.th)}</div>
      <div class="qz-q">${esc(cur.q)}</div>
      <div class="qz-btns">
        <button class="qz-b vrai${donnee?(cur.v?' bon':(donnee.rep===true?' faux':'')):''}" data-r="1" type="button" ${donnee?'disabled':''}>Vrai</button>
        <button class="qz-b faux${donnee?(!cur.v?' bon':(donnee.rep===false?' faux':'')):''}" data-r="0" type="button" ${donnee?'disabled':''}>Faux</button>
      </div>
      ${donnee?`<div class="qz-exp ${donnee.ok?'ok':'ko'}">
        <b>${donnee.ok?'Correct':'Incorrect'} — la réponse est « ${cur.v?'Vrai':'Faux'} »</b>
        <span>${esc(cur.e)}</span></div>
        <button class="modal-btn ok" id="qzNext" type="button">${z.idx===z.list.length-1?'Voir le résultat':'Question suivante →'}</button>`:''}
    </div>`;
  const $=x=>box.querySelector(x);
  $('#qzBack').onclick=()=>{ uiConfirm('Quitter ? Ta progression sur ce passage sera perdue.',()=>{ codeVue={mode:'liste',th:0,qz:null}; draw(); }); };
  box.querySelectorAll('[data-r]').forEach(b=> b.onclick=()=>{
    const rep=b.dataset.r==='1';
    z.rep[z.idx]={rep, ok:rep===cur.v};
    draw();
  });
  const nx=$('#qzNext');
  if(nx) nx.onclick=()=>{ if(z.idx<z.list.length-1){ z.idx++; } else { z.fini=true; } draw(); };
}

function drawResultat(box, accent, draw){
  const exam=!!codeVue.exam, i=codeVue.th, z=codeVue.qz;
  const justes=z.rep.filter(r=>r&&r.ok).length, total=z.list.length;
  const pct=Math.round(justes/total*100);
  const rates=z.list.map((q,n)=>({q,r:z.rep[n]})).filter(x=>x.r && !x.r.ok);

  if(exam){
    const n=codeVue.examN||0;
    const exams=codeStoreExams(n);
    exams.push({date:Date.now(), score:justes});
    if(exams.length>20) exams.splice(0, exams.length-20);
    save();
    const admis=justes>=EXAM_SEUIL;
    box.innerHTML=`
      <div class="cd-nav"><button class="pm-btn sm" id="qzBack" type="button">← Les examens</button></div>
      <div class="qz-res exam${admis?' admis':' recale'}">
        <div class="cd-pos">Examen ${n+1}</div>
        <div class="qz-score" style="color:${admis?'var(--good)':'#ff8a94'}">${justes}<small>/${total}</small></div>
        <div class="qz-pct">${pct} % · seuil de réussite : ${EXAM_SEUIL}/40</div>
        <p class="qz-verdict">${admis?'Reçu — dans les conditions du vrai examen, tu passerais.':'Non reçu — il te manque '+(EXAM_SEUIL-justes)+' bonne'+(EXAM_SEUIL-justes>1?'s':'')+' réponse'+(EXAM_SEUIL-justes>1?'s':'')+'.'}</p>
        <div class="cd-actions">
          <button class="modal-btn ok" id="qzAgain" type="button">Retenter l'examen ${n+1}</button>
          <button class="modal-btn" id="qzListe" type="button">Retour aux examens</button>
        </div>
      </div>
      ${rates.length?`<div class="ledger-label">À revoir · ${rates.length} question${rates.length>1?'s':''}</div>
        ${rates.map(x=>`<div class="qz-rate"><b>${esc(x.q.q)}</b>
          <span class="qz-rate-r">${esc(x.q.th)} · Réponse : ${x.q.v?'Vrai':'Faux'}</span>
          <span>${esc(x.q.e)}</span></div>`).join('')}`
      :`<div class="sn-ok">Sans faute. Copie blanche parfaite.</div>`}`;
    const $=x=>box.querySelector(x);
    $('#qzBack').onclick=()=>{ codeVue={mode:'liste',th:0,qz:null}; draw(); };
    $('#qzListe').onclick=()=>{ codeVue={mode:'liste',th:0,qz:null}; draw(); };
    $('#qzAgain').onclick=()=>{
      codeVue={mode:'quiz', th:-1, exam:true, examN:n, qz:{list:examQuestions(n), idx:0, rep:[], fini:false}};
      draw();
    };
    return;
  }

  const sc=codeStoreQ();
  if(sc['t'+i]===undefined || justes>sc['t'+i]){ sc['t'+i]=justes; save(); }
  const verdict = pct>=90 ? 'Excellent — ce thème est acquis.'
                : pct>=75 ? 'Bien. Relis les points manqués, tu y es presque.'
                : pct>=50 ? 'Encore fragile. Refais ce quiz jusqu’à ce que ça rentre.'
                          : 'À retravailler sérieusement avant de continuer.';
  box.innerHTML=`
    <div class="cd-nav"><button class="pm-btn sm" id="qzBack" type="button">← Les thèmes</button></div>
    <div class="qz-res">
      <div class="qz-score" style="color:${santeColor(pct/10)}">${justes}<small>/${total}</small></div>
      <div class="qz-pct">${pct} %</div>
      <p class="qz-verdict">${esc(verdict)}</p>
      <div class="cd-actions">
        <button class="modal-btn ok" id="qzAgain" type="button">Refaire le quiz</button>
        <button class="modal-btn" id="qzListe" type="button">Retour aux thèmes</button>
      </div>
    </div>
    ${rates.length?`<div class="ledger-label">À revoir · ${rates.length} question${rates.length>1?'s':''}</div>
      ${rates.map(x=>`<div class="qz-rate"><b>${esc(x.q.q)}</b>
        <span class="qz-rate-r">Réponse : ${x.q.v?'Vrai':'Faux'}</span>
        <span>${esc(x.q.e)}</span></div>`).join('')}`
    :`<div class="sn-ok">Aucune erreur. Tu maîtrises ce thème.</div>`}`;
  const $=x=>box.querySelector(x);
  $('#qzBack').onclick=()=>{ codeVue={mode:'liste',th:0,qz:null}; draw(); };
  $('#qzListe').onclick=()=>{ codeVue={mode:'liste',th:0,qz:null}; draw(); };
  $('#qzAgain').onclick=()=>{
    const q=CODE_QUIZ[i].map((x,n)=>({n,q:x.q,v:x.v,e:x.e,th:CODE_THEMES[i]})).sort(()=>Math.random()-0.5);
    codeVue={mode:'quiz', th:i, exam:false, qz:{list:q, idx:0, rep:[], fini:false}};
    draw();
  };
}

/* ---- Pomodoro ---- */
/* ---- Pomodoro : basé sur l'horloge réelle, pas sur le comptage de « tick »
   — un onglet en arrière-plan ralentit ou suspend setInterval, mais l'horodatage
   de fin ne ment jamais. Persisté pour survivre à un rechargement complet. ---- */
function pomoStore(){ if(!inv().pomodoro || typeof inv().pomodoro!=='object') inv().pomodoro={}; return inv().pomodoro; }
let pomoState={running:false, phase:'travail', left:25*60, endAt:null, cycles:0, dur:{travail:25*60, pause:5*60, longue:15*60}};
let pomoTick=null, pomoInit=false, pomoRedraw=null, pomoAudioCtx=null, pomoVisWired=false;

function pomoLoad(){
  if(pomoInit) return; pomoInit=true;
  const st=pomoStore();
  if(st && Object.keys(st).length){
    pomoState.phase = st.phase || 'travail';
    pomoState.cycles = st.cycles || 0;
    pomoState.dur = Object.assign({travail:25*60,pause:5*60,longue:15*60}, st.dur||{});
    pomoState.running = !!st.running;
    pomoState.endAt = st.endAt || null;
    if(pomoState.running && pomoState.endAt){ pomoCatchUp(); }
    else { pomoState.left = st.left!=null ? st.left : pomoState.dur[pomoState.phase]; }
  }
}
function pomoPersist(){
  const st=pomoStore();
  st.running=pomoState.running; st.phase=pomoState.phase; st.left=pomoState.left;
  st.endAt=pomoState.endAt; st.cycles=pomoState.cycles; st.dur=pomoState.dur;
  save();
}
function pomoNextPhase(){
  if(pomoState.phase==='travail'){ pomoState.cycles++; pomoState.phase=(pomoState.cycles%4===0)?'longue':'pause'; }
  else { pomoState.phase='travail'; }
}
/* Rattrape en silence les phases passées pendant que l'app était fermée/masquée —
   pas de bip rétroactif pour quelque chose arrivé il y a trois heures. */
function pomoCatchUp(){
  let guard=0;
  while(pomoState.running && pomoState.endAt && Date.now()>=pomoState.endAt && guard<100){
    pomoNextPhase();
    pomoState.endAt += pomoState.dur[pomoState.phase]*1000;
    guard++;
  }
  if(pomoState.running && pomoState.endAt) pomoState.left=Math.max(0, Math.round((pomoState.endAt-Date.now())/1000));
}
/* Deux notes brèves, générées à la volée : aucun fichier audio nécessaire. */
/* Quatre sons bien distincts et nettement plus forts, un par moment du cycle —
   plus un simple bip identique à chaque fois qu'on ne repère plus. */
function pomoAudioUnlock(){
  /* Les navigateurs n'autorisent le son qu'après un vrai geste de l'utilisateur.
     On crée (et on débloque) le contexte au moment du clic sur Démarrer. */
  try{
    if(!pomoAudioCtx) pomoAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(pomoAudioCtx.state==='suspended') pomoAudioCtx.resume();
  }catch(e){}
}
function pomoBeep(type){
  type = type || 'debut';
  try{
    if(!pomoAudioCtx) pomoAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx=pomoAudioCtx;
    const jouer=()=>{
      const now=ctx.currentTime;
      const play=(offset,freq,dur,wave,gainMax)=>{
        const osc=ctx.createOscillator(), gain=ctx.createGain();
        osc.type=wave||'sine'; osc.frequency.value=freq;
        gain.gain.setValueAtTime(0, now+offset);
        gain.gain.linearRampToValueAtTime(gainMax||0.42, now+offset+0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, now+offset+dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now+offset); osc.stop(now+offset+dur+0.03);
      };
      if(type==='debut'){
        play(0, 660, 0.18, 'sine', 0.46);
        play(0.16, 880, 0.24, 'sine', 0.46);
      } else if(type==='repos'){
        play(0, 700, 0.22, 'triangle', 0.4);
        play(0.19, 520, 0.32, 'triangle', 0.4);
      } else if(type==='finrepos'){
        play(0, 520, 0.14, 'square', 0.32);
        play(0.12, 660, 0.14, 'square', 0.32);
        play(0.24, 880, 0.24, 'square', 0.36);
      } else if(type==='fin'){
        play(0, 660, 0.42, 'sine', 0.48);
        play(0, 880, 0.42, 'sine', 0.32);
        play(0.05, 990, 0.48, 'sine', 0.3);
      }
    };
    /* resume() est asynchrone : on attend qu'il aboutisse avant de programmer les notes,
       sinon elles partent pendant que le contexte dort et on n'entend rien. */
    if(ctx.state==='suspended'){
      const pr=ctx.resume();
      if(pr && pr.then) pr.then(jouer).catch(()=>{}); else jouer();
    } else {
      jouer();
    }
  }catch(e){}
}
function pomoTickFn(){
  if(!pomoState.running || !pomoState.endAt) return;
  const remaining=Math.round((pomoState.endAt-Date.now())/1000);
  if(remaining<=0){
    const phaseQuiFinit=pomoState.phase;
    if(phaseQuiFinit==='travail') pomoBeep('repos');
    else if(phaseQuiFinit==='pause') pomoBeep('finrepos');
    else pomoBeep('fin');
    if(navigator.vibrate) try{ navigator.vibrate([120,60,120]); }catch(e){}
    pomoNextPhase();
    pomoState.endAt=Date.now()+pomoState.dur[pomoState.phase]*1000;
    pomoState.left=pomoState.dur[pomoState.phase];
    pomoPersist();
  } else {
    pomoState.left=remaining;
  }
  if(pomoRedraw) try{ pomoRedraw(); }catch(e){}
  try{ renderPomoBar(); }catch(e){}
}
function pomoStartTick(){
  if(pomoTick) return;   // déjà en cours (ex. après une navigation) : ne pas dupliquer
  pomoTick=setInterval(pomoTickFn, 500);
  if(!pomoVisWired && typeof document!=='undefined'){
    pomoVisWired=true;
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pomoTickFn(); });
  }
}
function pomoStopTick(){ if(pomoTick){ clearInterval(pomoTick); pomoTick=null; } }

function renderPomodoro(wrap, accent){
  pomoLoad();
  const box=document.createElement('div'); box.className='pomo'; box.style.setProperty('--accent',accent);
  wrap.appendChild(box);
  function fmt(s){ const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }
  function draw(){
    const total=pomoState.dur[pomoState.phase];
    const pct=Math.round((1-pomoState.left/total)*100);
    box.innerHTML=`
      <div class="pomo-phase">${pomoState.phase==='travail'?'Session de travail':(pomoState.phase==='longue'?'Pause longue':'Pause courte')}</div>
      <div class="pomo-ring"><svg viewBox="0 0 120 120">
        <circle class="pomo-bg" cx="60" cy="60" r="52"/>
        <circle class="pomo-fg" cx="60" cy="60" r="52" stroke-dasharray="${pct*3.27},327"/>
      </svg><div class="pomo-time">${fmt(pomoState.left)}</div></div>
      <div class="pomo-btns">
        <button class="modal-btn ok" id="pmToggle" type="button">${pomoState.running?'Pause':'Démarrer'}</button>
        <button class="pm-btn sm" id="pmReset" type="button">Réinitialiser</button>
      </div>
      <div class="pomo-cycles">${pomoState.cycles} session${pomoState.cycles>1?'s':''} aujourd’hui</div>
      <div class="ledger-label">Durées</div>
      <div class="pomo-durs">
        <label>Travail<input type="number" min="1" max="120" id="pmW" value="${pomoState.dur.travail/60}"></label>
        <label>Pause<input type="number" min="1" max="60" id="pmP" value="${pomoState.dur.pause/60}"></label>
        <label>Pause longue<input type="number" min="1" max="60" id="pmL" value="${pomoState.dur.longue/60}"></label>
      </div>`;
    const $=s=>box.querySelector(s);
    $('#pmToggle').onclick=()=>{
      pomoState.running=!pomoState.running;
      if(pomoState.running){ pomoAudioUnlock(); pomoState.endAt=Date.now()+pomoState.left*1000; pomoBeep('debut'); pomoStartTick(); }
      else { pomoState.endAt=null; pomoStopTick(); }
      pomoPersist(); draw();
    };
    $('#pmReset').onclick=()=>{
      pomoStopTick(); pomoState.running=false; pomoState.phase='travail';
      pomoState.left=pomoState.dur.travail; pomoState.endAt=null;
      pomoPersist(); draw();
    };
    ['W','P','L'].forEach((k)=>{
      const map={W:'travail',P:'pause',L:'longue'};
      $('#pm'+k).addEventListener('change',e=>{
        const v=Math.max(1,Math.min(120,+e.target.value||1))*60;
        pomoState.dur[map[k]]=v;
        if(pomoState.phase===map[k] && !pomoState.running) pomoState.left=v;
        pomoPersist(); draw();
      });
    });
  }
  pomoRedraw=draw;
  if(pomoState.running) pomoStartTick();
  draw();
}


/* ---- Dressing ---- */
const DRESS_CATS=[
 {k:'haut',    l:'Hauts'},
 {k:'bas',     l:'Bas'},
 {k:'veste',   l:'Vestes & manteaux'},
 {k:'chaussure',l:'Chaussures'},

function dressStore(){ if(!Array.isArray(inv().dressing)) inv().dressing=[]; return inv().dressing; }
function tenueStore(){ if(!inv().tenues || typeof inv().tenues!=='object') inv().tenues={}; return inv().tenues; }
function renderDressing(wrap, accent){
  const box=document.createElement('div'); box.className='dr'; box.style.setProperty('--accent',accent);
  box.innerHTML=`<div id="drTenue"></div>
    <div class="ledger-label">Ma garde-robe</div>
    <div id="drBody"></div>
    <div class="edit-add-row"><button class="edit-add" id="drAdd" type="button">+ Ajouter un vêtement</button></div>`;
  wrap.appendChild(box);
  const $=x=>box.querySelector(x);
  function draw(){
    const list=dressStore(), j=todayKey(), t=tenueStore();
    if(!t[j]) t[j]={};
    const sel=t[j];
    const choisis=DRESS_CATS.map(c=>{ const id=sel[c.k]; const v=list.find(x=>x.id===id); return v?{c,v}:null; }).filter(Boolean);
    $('#drTenue').innerHTML=`<div class="dr-t">
      <div class="dr-t-h">Ma tenue du jour</div>
      ${choisis.length?`<div class="dr-t-l">${choisis.map(x=>`<span class="dr-chip" style="--dc:${esc(x.v.c||'#8A8A90')}">${esc(x.v.l)}</span>`).join('')}</div>`
        :`<div class="dr-t-v">Rien de choisi. Touche un vêtement ci-dessous pour composer ta tenue.</div>`}
      ${choisis.length?`<button class="pm-btn sm" id="drClear" type="button">Réinitialiser</button>`:''}
    </div>`;
    const cl=$('#drClear'); if(cl) cl.onclick=()=>{ tenueStore()[todayKey()]={}; save(); draw(); };

    $('#drBody').innerHTML=DRESS_CATS.map(c=>{
      const arr=list.filter(x=>x.cat===c.k);
      if(!arr.length) return '';
      return `<div class="dr-cat"><div class="dr-cat-h">${esc(c.l)}</div>
        <div class="dr-grid">${arr.map(v=>{
          const on=sel[c.k]===v.id;
          return `<div class="dr-it${on?' on':''}" data-p="${esc(v.id)}" style="--dc:${esc(v.c||'#8A8A90')}">
            <span class="dr-dot"></span>
            <span class="dr-l">${esc(v.l)}</span>
            <button class="nb-del" data-d="${esc(v.id)}" type="button" aria-label="Retirer">×</button>
          </div>`; }).join('')}</div></div>`;
    }).join('') || `<div class="nb-empty">Ta garde-robe est vide. Ajoute tes vêtements pour composer tes tenues.</div>`;

    $('#drBody').querySelectorAll('[data-p]').forEach(el=> el.addEventListener('click',e=>{
      if(e.target.closest('[data-d]')) return;
      const v=dressStore().find(x=>x.id===el.dataset.p); if(!v) return;
      const tt=tenueStore(), jj=todayKey(); if(!tt[jj]) tt[jj]={};
      tt[jj][v.cat] = (tt[jj][v.cat]===v.id) ? null : v.id;
      save(); draw();
    }));
    $('#drBody').querySelectorAll('[data-d]').forEach(b=> b.onclick=e=>{ e.stopPropagation();
      uiConfirm('Retirer ce vêtement de ta garde-robe ?',()=>{
        const i=dressStore().findIndex(x=>x.id===b.dataset.d); if(i>=0) dressStore().splice(i,1); save(); draw(); }); });
  }
  $('#drAdd').onclick=()=>openVetement(draw);
  draw();
}
function openVetement(after){
  const COULEURS=[['#F4F4F5','Blanc'],['#1C1C1E','Noir'],['#8A8A90','Gris'],['#3B5BA5','Bleu'],
    ['#4A5D3A','Kaki'],['#8B5E3C','Beige'],['#E63946','Rouge'],['#D8B26C','Camel']];
  const ov=document.createElement('div'); ov.className='modal-ov';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>Nouveau vêtement</h3>
    <label class="mf">Intitulé<input id="v-l" type="text" placeholder="ex. Chemise blanche oversize"></label>
    <label class="mf">Catégorie<select id="v-c">${DRESS_CATS.map(c=>`<option value="${c.k}">${c.l}</option>`).join('')}</select></label>
    <div class="mf">Couleur<div class="dr-cols">${COULEURS.map((c,i)=>`<button type="button" class="dr-col${i===0?' on':''}" data-col="${c[0]}" title="${c[1]}" style="background:${c[0]}"></button>`).join('')}</div></div>
    <div class="modal-actions"><button class="modal-btn cancel" type="button">Annuler</button><button class="modal-btn ok" type="button">Ajouter</button></div></div>`;
  document.body.appendChild(ov);
  const $=x=>ov.querySelector(x);
  let col=COULEURS[0][0];
  ov.querySelectorAll('[data-col]').forEach(b=> b.onclick=()=>{
    col=b.dataset.col; ov.querySelectorAll('[data-col]').forEach(x=>x.className='dr-col'); b.className='dr-col on'; });
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',k); };
  function k(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown',k);
  $('.cancel').onclick=close; ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  setTimeout(()=>{ try{$('#v-l').focus();}catch(e){} },30);
  $('.ok').onclick=()=>{
    const l=$('#v-l').value.trim(); if(!l){ $('#v-l').focus(); return; }
    dressStore().push({id:'v'+Date.now(), l, cat:$('#v-c').value, c:col});
    save(); close(); after&&after();
  };
}

/* ---- Notes : dossiers colorés, titre, lecture en grand ---- */
const NB_COLORS=[
  {k:'gris',   l:'Sans dossier', c:'#8A8A90'},
  {k:'rouge',  l:'Urgent',       c:'#E63946'},
  {k:'ambre',  l:'Idées',        c:'#F59E0B'},
  {k:'vert',   l:'Fait',         c:'#3FB950'},
  {k:'bleu',   l:'Projets',      c:'#4C8DFF'},
  {k:'violet', l:'Perso',        c:'#A97BFF'},
];
function nbColor(k){ const f=NB_COLORS.find(x=>x.k===k); return f?f.c:NB_COLORS[0].c; }
function nbFolders(dk){
  const st=inv();
  const key='nbf_'+dk;
  if(!Array.isArray(st[key])) st[key]=NB_COLORS.map(c=>({k:c.k,l:c.l,c:c.c}));
  return st[key];
}
function nbFolderLabel(dk,k){ const f=nbFolders(dk).find(x=>x.k===k); return f?f.l:'Sans dossier'; }

let nbFilter={}, nbQuery={};
/* Les mini-tâches se choisissent simplement entre Travail et Perso — rien de plus. */
const MINI_FOLDERS=[
  {k:'sinbury',    l:'Sinbury',          c:'#E63946'},
  {k:'strawberry', l:'Strawberry Prod',  c:'#F59E0B'},
  {k:'travail',    l:'Travail',          c:'#4C8DFF'},
  {k:'perso',      l:'Perso',            c:'#A97BFF'},
  {k:'achats',     l:'Achats',           c:'#3FB950'},
];
let miniFilter={};
function miniFolder(it){ return MINI_FOLDERS.some(f=>f.k===it.folder) ? it.folder : 'perso'; }
/* Barre de bascule générique : un bouton par catégorie, avec son compte. */
function miniToggleBar(minis, miniKey){
  if(!MINI_FOLDERS.some(f=>f.k===miniFilter[miniKey])) miniFilter[miniKey]=MINI_FOLDERS[0].k;
  const tbar=document.createElement('div'); tbar.className='mini-toggle';
  tbar.innerHTML=MINI_FOLDERS.map(f=>{
    const n=minis.filter(it=>miniFolder(it)===f.k).length;
    return `<button class="mt-b${miniFilter[miniKey]===f.k?' active':''}" data-f="${f.k}" style="--cat:${f.c}">
      <span class="mt-dot"></span>${esc(f.l)} <b>${n}</b></button>`;
  }).join('');
  tbar.querySelectorAll('[data-f]').forEach(b=> b.onclick=()=>{ miniFilter[miniKey]=b.dataset.f; render(); });
  return tbar;
}
function miniFolderInfo(k){ return MINI_FOLDERS.find(f=>f.k===k) || MINI_FOLDERS[1]; }
function surli(html,q){
  if(!q) return html;
  try{ return html.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); }
  catch(e){ return html; }
}
function extrait(txt,q){
  if(!q) return txt.slice(0,150)+'…';
  const i=txt.toLowerCase().indexOf(q);
  if(i<0) return txt.slice(0,150)+'…';
  const a=Math.max(0,i-60);
  return (a>0?'…':'')+txt.slice(a,a+150)+'…';
}
function renderNotes(dk, wrap, accent){
  const box=document.createElement('div'); box.className='nb'; box.style.setProperty('--accent',accent);
  box.innerHTML=`<div class="nb-search"><input type="search" id="nbQ" placeholder="Rechercher dans les notes…" autocomplete="off"><button class="nb-qx" id="nbQX" type="button" aria-label="Effacer">×</button></div>
    <div class="nb-folders" id="nbFolders"></div>
    <div class="nb-add-row"><button class="edit-add" id="nbNew" type="button">+ Nouvelle note</button></div>
    <div class="nb-grid" id="nbGrid"></div>`;
  wrap.appendChild(box);
  const grid=box.querySelector('#nbGrid'), fbar=box.querySelector('#nbFolders');
  const qIn=box.querySelector('#nbQ');
  if(!nbFilter[dk]) nbFilter[dk]='*';
  if(!nbQuery[dk]) nbQuery[dk]='';
  qIn.value=nbQuery[dk];

  function drawFolders(){
    const list=nbList(dk);
    const counts={};
    list.forEach(n=>{ const k=n.folder||'gris'; counts[k]=(counts[k]||0)+1; });
    fbar.innerHTML=`<button class="nb-fchip${nbFilter[dk]==='*'?' active':''}" data-f="*">Toutes <b>${list.length}</b></button>`
      + nbFolders(dk).map(f=>`<button class="nb-fchip${nbFilter[dk]===f.k?' active':''}" data-f="${esc(f.k)}" style="--fc:${f.c}">
          <span class="nb-dot" style="background:${f.c}"></span>${esc(f.l)} <b>${counts[f.k]||0}</b></button>`).join('')
      + `<button class="nb-fchip edit" id="nbFedit" title="Renommer les dossiers">✎</button>`;
    fbar.querySelectorAll('[data-f]').forEach(b=> b.onclick=()=>{ nbFilter[dk]=b.dataset.f; drawFolders(); draw(); });
    fbar.querySelector('#nbFedit').onclick=()=>openFolderEditor(dk, ()=>{ drawFolders(); draw(); });
  }

  function draw(){
    const all=nbList(dk);
    const q=(nbQuery[dk]||'').trim().toLowerCase();
    let list = nbFilter[dk]==='*' ? all : all.filter(n=>(n.folder||'gris')===nbFilter[dk]);
    if(q) list = list.filter(n=> ((n.title||'')+' '+(n.text||'')).toLowerCase().indexOf(q)>=0 );
    grid.innerHTML = list.length ? '' : `<div class="nb-empty">${q?'Aucune note ne contient « '+esc(q)+' ».':(all.length?'Aucune note dans ce dossier.':'Rien encore. Clique « Nouvelle note » pour commencer.')}</div>`;
    list.forEach(n=>{
      const col=nbColor(n.folder||'gris');
      const c=document.createElement('div'); c.className='nb-card'; c.style.setProperty('--nc',col);
      const apercu=(n.text||'').trim();
      const long=apercu.length>150;
      c.innerHTML=`<div class="nb-card-h"><span class="nb-dot" style="background:${col}"></span><span class="nb-folder-l">${esc(nbFolderLabel(dk,n.folder||'gris'))}</span></div>
        <div class="nb-card-t">${surli(esc(n.title||'Sans titre'), q)}</div>
        <div class="nb-card-b">${surli(esc(long?extrait(apercu,q):apercu), q)||'<span class="nb-vide">Vide</span>'}</div>
        <div class="nb-foot"><span>${esc(fmtDate(n.ts))}</span><button class="nb-del" type="button" aria-label="Supprimer">×</button></div>`;
      grid.appendChild(c);
      c.addEventListener('click', e=>{ if(e.target.closest('.nb-del')) return; openNote(dk,n,()=>{ drawFolders(); draw(); }); });
      c.querySelector('.nb-del').addEventListener('click',e=>{ e.stopPropagation();
        uiConfirm('Supprimer cette note ?',()=>{ const i=nbList(dk).indexOf(n); if(i>=0) nbList(dk).splice(i,1); save(); drawFolders(); draw(); }); });
    });
  }
  let qt=null;
  qIn.addEventListener('input',()=>{ nbQuery[dk]=qIn.value; clearTimeout(qt); qt=setTimeout(draw,180); });
  box.querySelector('#nbQX').addEventListener('click',()=>{ nbQuery[dk]=''; qIn.value=''; draw(); qIn.focus(); });
  box.querySelector('#nbNew').addEventListener('click',()=>{
    const n={id:'n'+Date.now(),title:'',text:'',ts:Date.now(),folder:(nbFilter[dk]==='*'?'gris':nbFilter[dk])};
    nbList(dk).unshift(n); save(); drawFolders(); draw();
    openNote(dk,n,()=>{ drawFolders(); draw(); });
  });
  drawFolders(); draw();
}

/* Lecture / écriture en grand */
function openNote(dk, n, after){
  const ov=document.createElement('div'); ov.className='modal-ov note-ov';
  ov.style.setProperty('--nc', nbColor(n.folder||'gris'));
  ov.innerHTML=`<div class="note-full" role="dialog" aria-modal="true">
    <div class="note-top">
      <input class="note-title" id="ntT" placeholder="Titre de la note">
      <button class="note-close" id="ntX" type="button" aria-label="Fermer">✕</button>
    </div>
    <div class="note-folders" id="ntF"></div>
    <textarea class="note-body" id="ntB" placeholder="Écris ici…"></textarea>
    <div class="note-foot"><span id="ntI"></span><button class="modal-btn ok" id="ntOk" type="button">Terminé</button></div>
  </div>`;
  document.body.appendChild(ov);
  const $=x=>ov.querySelector(x);
  const ti=$('#ntT'), bo=$('#ntB');
  ti.value=n.title||''; bo.value=n.text||'';
  function info(){ const t=(bo.value||'').trim(); $('#ntI').textContent=(t?t.split(/\s+/).length:0)+' mots · '+fmtDate(n.ts); }
  function folders(){
    $('#ntF').innerHTML=nbFolders(dk).map(f=>`<button class="nb-fchip${(n.folder||'gris')===f.k?' active':''}" data-k="${esc(f.k)}" style="--fc:${f.c}"><span class="nb-dot" style="background:${f.c}"></span>${esc(f.l)}</button>`).join('');
    $('#ntF').querySelectorAll('[data-k]').forEach(b=> b.onclick=()=>{
      n.folder=b.dataset.k; save();
      ov.style.setProperty('--nc', nbColor(n.folder||'gris'));
      folders();
    });
  }
  ti.addEventListener('input',()=>{ n.title=ti.value; save(); });
  bo.addEventListener('input',()=>{ n.text=bo.value; save(); info(); });
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',k); after&&after(); };
  function k(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown',k);
  $('#ntX').onclick=close; $('#ntOk').onclick=close;
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  folders(); info();
  setTimeout(()=>{ try{ (n.title?bo:ti).focus(); }catch(e){} },40);
}

/* ---- Planning du jour ---- */
let planDay=null;
function planStore(){ if(!inv().planning || typeof inv().planning!=='object') inv().planning={}; return inv().planning; }
function planList(day){ const s=planStore(); if(!Array.isArray(s[day])) s[day]=[]; return s[day]; }
function renderPlanning(wrap, accent){
  if(!planDay) planDay=todayKey();
  const box=document.createElement('div'); box.className='pn'; box.style.setProperty('--accent',accent);
  box.innerHTML=`<div class="pn-nav">
      <button class="pm-btn sm" id="pnPrev" type="button">←</button>
      <div class="pn-day" id="pnDay"></div>
      <button class="pm-btn sm" id="pnNext" type="button">→</button>
      <button class="pm-btn sm" id="pnToday" type="button">Aujourd'hui</button>
    </div>
    <div id="pnBody"></div>
    <div class="edit-add-row">
      <button class="edit-add" id="pnPull" type="button">↓ Tirer d'un objectif</button>
      <button class="edit-add" id="pnAdd" type="button">+ Ajouter un bloc libre</button>
    </div>`;
  wrap.appendChild(box);
  const $=x=>box.querySelector(x);

  function draw(){
    $('#pnDay').innerHTML=`<b>${esc(fmtWeekday(planDay))}</b> ${esc(fmtDate(Date.parse(planDay+'T12:00:00')))}`;
    const blocs=planList(planDay).slice().sort((a,b)=>(a.start||'').localeCompare(b.start||''));
    const rdv=calList().filter(e=>e.date===planDay).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const items=blocs.map(b=>({type:'bloc',o:b})).concat(rdv.map(e=>({type:'rdv',o:e})))
      .sort((a,b)=>((a.o.start||a.o.time||'99')+'').localeCompare((b.o.start||b.o.time||'99')+''));
    if(!items.length){ $('#pnBody').innerHTML=`<div class="mini-empty">Journée vide. Ajoute un bloc pour la structurer.</div>`; return; }
    $('#pnBody').innerHTML=items.map(it=>{
      if(it.type==='rdv'){
        return `<div class="pn-row rdv"><div class="pn-time">${esc(it.o.time||'—')}</div>
          <div class="pn-main"><div class="pn-title">${esc(it.o.title)}</div><div class="pn-meta">Rendez-vous${it.o.note?' · '+esc(it.o.note):''}</div></div></div>`;
      }
      const b=it.o;
      const lie = b.src ? findItemAnywhere(b.src) : null;
      return `<div class="pn-row${b.done?' done':''}${lie?' lie':''}" data-id="${esc(b.id)}">
        <div class="pn-time">${esc(b.start||'—')}${b.end?'<small>'+esc(b.end)+'</small>':''}</div>
        <div class="pn-main"><div class="pn-title">${esc(b.title)}${lie?' <span class="pn-lien">objectif</span>':''}</div>${b.note?`<div class="pn-meta">${esc(b.note)}</div>`:''}</div>
        <button class="pn-check" data-done="${esc(b.id)}" type="button" aria-label="Fait">${b.done?'✓':''}</button>
        <button class="nb-del" data-del="${esc(b.id)}" type="button" aria-label="Supprimer">×</button></div>`;
    }).join('');
    $('#pnBody').querySelectorAll('[data-done]').forEach(b=> b.onclick=()=>{
      const x=planList(planDay).find(y=>y.id===b.dataset.done);
      if(!x) return;
      x.done=!x.done;
      if(x.src){                       // le bloc vient d'un objectif : on le coche aussi
        const src=findItemAnywhere(x.src);
        if(src && src.it.kind==='bool' && !isHabit(src.it)) inv()[x.src]=x.done;
      }
      save(); draw(); });
    $('#pnBody').querySelectorAll('[data-del]').forEach(b=> b.onclick=()=>{
      uiConfirm('Supprimer ce bloc ?',()=>{ const l=planList(planDay); const i=l.findIndex(y=>y.id===b.dataset.del); if(i>=0)l.splice(i,1); save(); draw(); }); });
    $('#pnBody').querySelectorAll('.pn-row[data-id]').forEach(r=> r.addEventListener('click',e=>{
      if(e.target.closest('button')) return;
      openBlocEditor(planList(planDay).find(y=>y.id===r.dataset.id), draw); }));
  }
  const shift=n=>{ const d=new Date(planDay+'T12:00:00'); d.setDate(d.getDate()+n); planDay=dateKey(d); draw(); };
  $('#pnPrev').onclick=()=>shift(-1);
  $('#pnNext').onclick=()=>shift(1);
  $('#pnToday').onclick=()=>{ planDay=todayKey(); draw(); };
  $('#pnAdd').onclick=()=>openBlocEditor(null, draw);
  $('#pnPull').onclick=()=>openPullPicker(draw);
  draw();
}
/* Retrouve un item (objectif ou mini-tâche) où qu'il soit */
function findItemAnywhere(id){
  const doms=DOMS();
  for(const dk in doms){
    const it=(doms[dk].items||[]).find(x=>x.id===id);
    if(it) return {dk, it};
  }
  return null;
}
/* Ce qui reste à faire, objectifs et mini-tâches confondus */
function tachesOuvertes(){
  const out=[];
  REGS().forEach(r=>(r.domains||[]).forEach(dk=>{
    const d=domain(dk); if(!d || d.special) return;
    (d.items||[]).forEach(it=>{
      if(it.kind!=='bool') return;      // une mesure (poids, revenu) n'est pas une tâche à planifier
      if(isHabit(it)) return;
      if(itemDone(it)) return;
      out.push({ id:it.id, label:it.label, mini:!!it.mini, phase:it.phase||1, reg:r.title, accent:r.accent });
    });
  }));
  return out.sort((a,b)=> (a.mini?1:0)-(b.mini?1:0) || a.phase-b.phase);
}
function openPullPicker(after){
  const list=tachesOuvertes();
  const ov=document.createElement('div'); ov.className='modal-ov';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <h3>Tirer d'un objectif</h3>
    ${list.length?`<p class="pk-i">Choisis ce que tu places dans la journée. Cocher le bloc cochera l'objectif.</p>
      <div class="pk-list">${list.map(x=>`<button class="pk-it" type="button" data-id="${esc(x.id)}" style="--accent:${x.accent}">
        <span class="pk-dot"></span>
        <span class="pk-l"><b>${esc(x.label)}</b><small>${esc(x.reg)}${x.mini?' · mini-tâche':' · objectif · phase '+x.phase}</small></span>
      </button>`).join('')}</div>`
    :`<p class="pk-i">Rien à tirer : tous tes objectifs et mini-tâches sont validés.</p>`}
    <div class="modal-actions"><button class="modal-btn cancel" type="button">Fermer</button></div></div>`;
  document.body.appendChild(ov);
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',k); };
  function k(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown',k);
  ov.querySelector('.cancel').onclick=close;
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  ov.querySelectorAll('[data-id]').forEach(b=> b.onclick=()=>{
    const x=list.find(y=>y.id===b.dataset.id);
    close();
    openBlocEditor(null, after, { title:x.label, src:x.id });
  });
}

function openBlocEditor(bloc, after, prefill){
  const ov=document.createElement('div'); ov.className='modal-ov';
  const hrs=Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
  const mns=['00','15','30','45'];
  const sel=(id,arr,val)=>`<select id="${id}"><option value="">--</option>${arr.map(x=>`<option value="${x}"${val===x?' selected':''}>${x}</option>`).join('')}</select>`;
  const st=(bloc&&bloc.start||'').split(':'), en=(bloc&&bloc.end||'').split(':');
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${bloc?'Modifier le bloc':'Nouveau bloc'}</h3>
    <label class="mf">Intitulé<input id="b-title" type="text" placeholder="ex. Deep work Sinbury"></label>
    <div class="mf">Début<div class="time-pick">${sel('b-sh',hrs,st[0])}<span class="tp-sep">:</span>${sel('b-sm',mns,st[1])}</div></div>
    <div class="mf">Fin (optionnel)<div class="time-pick">${sel('b-eh',hrs,en[0])}<span class="tp-sep">:</span>${sel('b-em',mns,en[1])}</div></div>
    <label class="mf">Note (optionnel)<input id="b-note" type="text"></label>
    <div class="modal-actions"><button class="modal-btn cancel" type="button">Annuler</button><button class="modal-btn ok" type="button">${bloc?'Enregistrer':'Ajouter'}</button></div></div>`;
  document.body.appendChild(ov);
  const $=x=>ov.querySelector(x);
  if(bloc){ $('#b-title').value=bloc.title||''; $('#b-note').value=bloc.note||''; }
  else if(prefill){ $('#b-title').value=prefill.title||''; }
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',k); };
  function k(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown',k);
  $('.cancel').onclick=close; ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  setTimeout(()=>{ try{$('#b-title').focus();}catch(e){} },30);
  $('.ok').onclick=()=>{
    const t=$('#b-title').value.trim(); if(!t){ $('#b-title').focus(); return; }
    const start=$('#b-sh').value?($('#b-sh').value+':'+($('#b-sm').value||'00')):'';
    const end=$('#b-eh').value?($('#b-eh').value+':'+($('#b-em').value||'00')):'';
    const data={title:t,start:start,end:end,note:$('#b-note').value.trim()};
    if(bloc){ Object.assign(bloc,data); }
    else {
      const nb=Object.assign({id:'b'+Date.now(),done:false},data);
      if(prefill && prefill.src) nb.src=prefill.src;
      planList(planDay).push(nb);
    }
    save(); close(); after&&after();
  };
}

/* ---- Budget du mois ----
   Charges fixes réelles + répartition automatique du reste, en parts.
   Tu saisis ce que tu gagnes : tout le reste se calcule. */
const CHARGES_DEF=[
  {id:'c1', l:'Courses',           m:50},
  {id:'c2', l:'Salle de sport',    m:50},
  {id:'c3', l:'Navigo',            m:22},
  {id:'c4', l:'Abonnement Claude', m:20},
  {id:'c5', l:'Carte UGC',         m:20},
  {id:'c6', l:'Coiffeur',          m:15},
  {id:'c7', l:'Carte SIM',         m:10},
];
/* Parts calibrées sur tes cibles : 500 épargne / 250 projets / 125 sorties / 125 imprévus */
const POSTES_DEF=[
  {k:'epargne',  l:'Épargne, projets & investissement', parts:6, min:0,   d:'Mis de côté avant tout le reste — épargne, projets, investissement'},
  {k:'sorties',  l:'Sorties',                  parts:1, min:100, d:'Restaurants, dates, loisirs'},
];
let budMonth=null;
function monthKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function budStore(){ if(!inv().budget || typeof inv().budget!=='object') inv().budget={}; return inv().budget; }
/* Deux objectifs d'épargne fixes, suivis à part du budget mensuel courant. */
const EPARGNE_OBJECTIFS=[
  {k:'securite', l:'Épargne de sécurité', cible:3000},
  {k:'appart', l:'Épargne appartement', cible:5000},
];
function epargneObjStore(){ if(!inv().epargneObj || typeof inv().epargneObj!=='object') inv().epargneObj={}; return inv().epargneObj; }
function renderJaugesEpargne(box){
  const st=epargneObjStore();
  const el=document.createElement('div'); el.className='eo-wrap';
  el.innerHTML=`<div class="ledger-label">Objectifs d'épargne</div>
    ${EPARGNE_OBJECTIFS.map(o=>{
      const v=Math.max(0, +st[o.k]||0), pct=Math.min(100, Math.round(v/o.cible*100)), atteint=v>=o.cible;
      return `<div class="eo-item${atteint?' atteint':''}">
        <div class="eo-h"><b>${esc(o.l)}</b><span>${fmtEur(v)} / ${fmtEur(o.cible)}${atteint?' ✓':''}</span></div>
        <div class="eo-bar"><i style="width:${pct}%"></i></div>
        <input type="number" min="0" step="10" data-eo="${o.k}" value="${st[o.k]||''}" placeholder="Montant déjà épargné">
      </div>`;
    }).join('')}`;
  box.appendChild(el);
  el.querySelectorAll('[data-eo]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ epargneObjStore()[inp.dataset.eo]=inp.value; save(); });
    inp.addEventListener('blur', ()=>{
      const parent=inp.closest('.eo-wrap');
      if(parent && parent.parentNode){ const p=parent.parentNode; parent.remove(); renderJaugesEpargne(p); }
    });
  });
}
function budMois(m){
  const s=budStore();
  if(!s[m]) s[m]={revenus:'',charges:null,parts:{},depense:{}};
  if(!Array.isArray(s[m].charges)) s[m].charges=CHARGES_DEF.map(c=>({id:c.id,l:c.l,m:String(c.m)}));
  if(!s[m].parts) s[m].parts={};
  if(!s[m].depense) s[m].depense={};
  return s[m];
}
function budNum(v){ const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isNaN(n)?0:n; }
function fmtEur(n){ return Math.round(n).toLocaleString('fr-FR')+' €'; }
function budParts(m,k){ const b=budMois(m), v=b.parts[k]; const def=(POSTES_DEF.find(x=>x.k===k)||{}).parts||0; return (v===undefined||v==='')?def:budNum(v); }
function chargesTotal(m){ return budMois(m).charges.reduce((a,c)=>a+budNum(c.m),0); }
function monthLabel(m){
  try{ const a=m.split('-'); return new Date(+a[0],+a[1]-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}); }
  catch(e){ return m; }
}
/* Au-delà d'un certain reste, l'argent ne doit plus se répartir en proportion fixe :
   sinon un revenu deux ou trois fois plus élevé multiplie les sorties d'autant, ce qui n'a pas de sens.
   Le premier palier suit les parts choisies (comme avant). Au-delà, l'essentiel de l'excédent
   va à l'épargne, et le reste se répartit entre projets et sorties — pour que le confort augmente
   sans s'emballer. */
const BUD_PALIER=1000;        // reste au-delà duquel le calcul devient plus prudent
const BUD_PART_EPARGNE_EXCEDENT=0.75;   // part de l'excédent qui va à l'épargne
const BUD_SORTIES_MAX=500;   // plafond absolu : au-delà, ça ne sert plus le projet
function budCalc(m){
  const b=budMois(m), rev=budNum(b.revenus), fixes=chargesTotal(m);
  const reste=Math.max(0, rev-fixes);
  const totParts=POSTES_DEF.reduce((a,p)=>a+budParts(m,p.k),0)||1;

  const palier=Math.min(reste, BUD_PALIER);
  const excedent=Math.max(0, reste-BUD_PALIER);
  const autresParts=POSTES_DEF.filter(p=>p.k!=='epargne').reduce((a,p)=>a+budParts(m,p.k),0)||1;

  const alloc={}, sous=[];
  POSTES_DEF.forEach(p=>{
    let v = palier*budParts(m,p.k)/totParts;
    if(excedent>0){
      if(p.k==='epargne') v += excedent*BUD_PART_EPARGNE_EXCEDENT;
      else v += excedent*(1-BUD_PART_EPARGNE_EXCEDENT)*budParts(m,p.k)/autresParts;
    }
    alloc[p.k]=v;
  });
  // Les sorties sont plafonnées : quel que soit le revenu, le surplus repart à l'épargne.
  let plafonne=false;
  if(alloc.sorties>BUD_SORTIES_MAX){
    const surplus=alloc.sorties-BUD_SORTIES_MAX;
    alloc.sorties=BUD_SORTIES_MAX;
    alloc.epargne=(alloc.epargne||0)+surplus;
    plafonne=true;
  }
  POSTES_DEF.forEach(p=>{ if(p.min && alloc[p.k]<p.min) sous.push(p); });
  return { rev, fixes, reste, alloc, sous, excedent, plafonne, deficit: rev>0 && rev<fixes };
}
function renderBudget(wrap, accent){
  if(!budMonth) budMonth=monthKey();
  const box=document.createElement('div'); box.className='bg'; box.style.setProperty('--accent',accent);
  box.innerHTML=`<div class="pn-nav">
      <button class="pm-btn sm" id="bgPrev" type="button">←</button>
      <div class="pn-day" id="bgMonth"></div>
      <button class="pm-btn sm" id="bgNext" type="button">→</button>
    </div>
    <div class="bg-rev">
      <label for="bgRev">Ce que je gagne ce mois-ci</label>
      <div class="bg-rev-in"><input id="bgRev" type="text" inputmode="decimal" placeholder="0"><span>€</span></div>
    </div>
    <div id="bgOut"></div>`;
  wrap.appendChild(box);
  const $=x=>box.querySelector(x);
  $('#bgRev').value=budMois(budMonth).revenus||'';

  const COL={ fixes:'#8A8A90', epargne:'#3FB950', projets:'var(--accent)', sorties:'#F0546A' };

  function donut(parts, total){
    const R=68, C=2*Math.PI*R;
    let off=0;
    const segs=parts.map(p=>{
      const frac = total>0 ? p.v/total : 0;
      const len = C*frac;
      const el = `<circle class="dn-seg" r="${R}" cx="90" cy="90" fill="none" stroke="${p.c}" stroke-width="26"
        stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
      off+=len; return el;
    }).join('');
    return `<svg viewBox="0 0 180 180" class="dn">
      <circle r="${R}" cx="90" cy="90" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="26"/>
      <g transform="rotate(-90 90 90)">${segs}</g>
      <text x="90" y="86" class="dn-t">${fmtEur(total)}</text>
      <text x="90" y="104" class="dn-s">à répartir</text>
    </svg>`;
  }

  function draw(){
    const b=budMois(budMonth), c=budCalc(budMonth);
    $('#bgMonth').innerHTML=`<b>${esc(monthLabel(budMonth))}</b>`;
    if(c.rev<=0){
      $('#bgOut').innerHTML=`<div class="bg-empty">Indique tes revenus : le cercle te dira quoi mettre où.</div>${chargesBloc(b)}`;
      wireCharges(); return;
    }
    const parts=[{k:'fixes',l:'Charges fixes',v:c.fixes,c:COL.fixes,d:'Immuables, déjà engagées'}]
      .concat(POSTES_DEF.map(p=>({k:p.k,l:p.l,v:c.alloc[p.k],c:COL[p.k],d:p.d})));

    $('#bgOut').innerHTML=`
      <div class="bg-top">
        <div class="bg-donut">${donut(parts, c.rev)}</div>
        <div class="bg-leg">${parts.map(p=>`
          <div class="bg-lg">
            <span class="bg-lg-d" style="background:${p.c}"></span>
            <span class="bg-lg-l">${esc(p.l)}<small>${esc(p.d)}</small></span>
            <span class="bg-lg-v">${fmtEur(p.v)}</span>
          </div>`).join('')}</div>
      </div>
      ${c.deficit?`<div class="bg-warn">Tes charges fixes (${fmtEur(c.fixes)}) dépassent tes revenus ce mois-ci.</div>`:''}
      ${(!c.deficit && c.sous.length)?`<div class="bg-warn">${c.sous.map(p=>esc(p.l)+' tombe sous ton plancher de '+p.min+' €').join(' · ')}</div>`:''}
      ${(!c.deficit && c.excedent>0)?`<div class="bg-info">Revenu au-dessus de ${fmtEur(BUD_PALIER)} de reste : l'excédent (${fmtEur(c.excedent)}) va surtout à l'épargne, pour que le confort augmente sans s'emballer.</div>`:''}
      <div class="ledger-label">Ajuster la répartition</div>
      <div class="bg-list">${POSTES_DEF.map(p=>`
        <div class="bg-item">
          <div class="bg-item-h">
            <div class="bg-item-l"><b>${esc(p.l)}</b></div>
            <div class="bg-item-m" style="color:${p.k==='projets'?'var(--accent)':COL[p.k]}">${fmtEur(c.alloc[p.k])}<small>${budParts(budMonth,p.k)} part${budParts(budMonth,p.k)>1?'s':''}</small></div>
          </div>
          <input type="range" min="0" max="8" step="1" value="${budParts(budMonth,p.k)}" data-p="${p.k}" class="sn-range" style="--c:${p.k==='projets'?'var(--accent)':COL[p.k]}">
        </div>`).join('')}</div>
      <div class="edit-add-row"><button class="edit-add" id="bgReset" type="button">Répartition conseillée</button></div>
      ${chargesBloc(b)}`;

    $('#bgOut').querySelectorAll('input[data-p]').forEach(r=>{
      r.addEventListener('input',()=>{ budMois(budMonth).parts[r.dataset.p]=+r.value; save(); draw(); });
    });
    const rb=$('#bgReset'); if(rb) rb.onclick=()=>{ budMois(budMonth).parts={}; save(); draw(); };
    wireCharges();
  }

  function chargesBloc(b){
    return `<div class="ledger-label">Charges fixes · ${fmtEur(chargesTotal(budMonth))}</div>
      <div class="bg-charges">${b.charges.map((c,i)=>`
        <div class="bg-ch">
          <input class="bg-ch-l" type="text" data-cl="${i}" value="${esc(c.l)}" placeholder="Intitulé">
          <div class="bg-ch-m"><input type="text" inputmode="decimal" data-cm="${i}" value="${esc(c.m)}" placeholder="0"><span>€</span></div>
          <button class="nb-del" data-cx="${i}" type="button" aria-label="Retirer">×</button>
        </div>`).join('')}
        <button class="edit-add sm" id="bgChAdd" type="button">+ Ajouter une charge fixe</button>
      </div>`;
  }
  function wireCharges(){
    box.querySelectorAll('input[data-cl]').forEach(inp=>{
      inp.addEventListener('input',()=>{ budMois(budMonth).charges[+inp.dataset.cl].l=inp.value; save(); });
    });
    box.querySelectorAll('input[data-cm]').forEach(inp=>{
      inp.addEventListener('input',()=>{ budMois(budMonth).charges[+inp.dataset.cm].m=inp.value; save(); soft(inp.dataset.cm); });
    });
    box.querySelectorAll('[data-cx]').forEach(b2=>{
      b2.onclick=()=>{ budMois(budMonth).charges.splice(+b2.dataset.cx,1); save(); draw(); };
    });
    const add=box.querySelector('#bgChAdd');
    if(add) add.onclick=()=>{ budMois(budMonth).charges.push({id:'c'+Date.now(),l:'',m:''}); save(); draw(); };
  }

  let t=null;
  function soft(key){ clearTimeout(t); t=setTimeout(()=>{
    draw();
    const el=box.querySelector('input[data-cm="'+key+'"]');
    if(el){ try{ el.focus(); el.setSelectionRange(el.value.length,el.value.length); }catch(e){} }
  }, 450); }

  $('#bgRev').addEventListener('input',()=>{ budMois(budMonth).revenus=$('#bgRev').value; save(); clearTimeout(t); t=setTimeout(draw,350); });
  const shiftM=n=>{ const a=budMonth.split('-').map(Number); budMonth=monthKey(new Date(a[0],a[1]-1+n,1)); $('#bgRev').value=budMois(budMonth).revenus||''; draw(); };
  $('#bgPrev').onclick=()=>shiftM(-1);
  $('#bgNext').onclick=()=>shiftM(1);
  draw();

  // Patrimoine & investissement vit maintenant ici, sous le budget du mois.
  renderJaugesEpargne(box);
  box.appendChild(ledgerLabel('Patrimoine & investissement'));
  const patri=document.createElement('div');
  box.appendChild(patri);
  renderPatrimoinePage(patri, accent);
}

/* ---- Bibliothèque de vie ---- */
const LIB_AREAS=['Argent & Carrière','Création','Corps & Santé','Relations','Esprit & Transversal'];
const LIB_COLS=[['lessons','Leçons apprises'],['errors','Erreurs à ne plus faire'],['quotes','Citations inspirantes']];
let libActive=null;
function libStore(){ if(!inv().library||typeof inv().library!=='object') inv().library={}; return inv().library; }
function libArea(a){ const s=libStore(); if(!s[a]||typeof s[a]!=='object') s[a]={lessons:[],errors:[],quotes:[]}; ['lessons','errors','quotes'].forEach(k=>{ if(!Array.isArray(s[a][k])) s[a][k]=[]; }); return s[a]; }
function renderLibrary(wrap, accent){
  if(!libActive || LIB_AREAS.indexOf(libActive)<0) libActive=LIB_AREAS[0];
  const box=document.createElement('div'); box.className='lib'; box.style.setProperty('--accent',accent);
  box.innerHTML=`<div class="lib-sel">${LIB_AREAS.map(a=>`<button class="pc-typechip${a===libActive?' active':''}" data-a="${esc(a)}" type="button">${esc(a)}</button>`).join('')}</div><div class="lib-cols" id="libCols"></div>`;
  wrap.appendChild(box);
  box.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{ libActive=b.dataset.a; renderLibCols(box); }));
  renderLibCols(box);
}
function renderLibCols(box){
  const area=libArea(libActive), cols=box.querySelector('#libCols');
  cols.innerHTML=LIB_COLS.map(([k,l])=>`<div class="lib-col" data-k="${k}"><div class="lib-col-h">${l}</div><div class="lib-items">${area[k].map((it,i)=>`<div class="lib-it"><span>${esc(it)}</span><button class="nb-del sm" data-i="${i}" aria-label="Supprimer">×</button></div>`).join('')}</div><div class="lib-add"><input placeholder="Ajouter…"><button type="button">+</button></div></div>`).join('');
  cols.querySelectorAll('.lib-col').forEach(col=>{
    const k=col.dataset.k, input=col.querySelector('.lib-add input');
    const add=()=>{ const v=input.value.trim(); if(!v)return; libArea(libActive)[k].push(v); save(); renderLibCols(box); };
    col.querySelector('.lib-add button').addEventListener('click',add);
    input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });
    col.querySelectorAll('.nb-del').forEach(b=>b.addEventListener('click',()=>{ libArea(libActive)[k].splice(+b.dataset.i,1); save(); renderLibCols(box); }));
  });
}

const SANTE_SEUIL = 5;   // en dessous : zone rouge, des conseils apparaissent

function santeStore(){ if(!inv().sante || typeof inv().sante!=='object') inv().sante={}; return inv().sante; }
function santeToday(){ const s=santeStore(), k=semaineKey(); if(!s[k]) s[k]={}; return s[k]; }
function santeScore(id){ const v=santeToday()[id]; return (v===undefined||v===null||v==='')?null:+v; }
function santeZone(zone){
  const axes=SANTE_AXES.filter(a=>a.zone===zone);
  const vals=axes.map(a=>santeScore(a.id)).filter(v=>v!==null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function santeGlobal(){
  const vals=SANTE_AXES.map(a=>santeScore(a.id)).filter(v=>v!==null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
/* rouge (0) → ambre (5) → vert (10) */
function santeColor(v){
  if(v===null) return '#3a3a3a';
  const t=Math.max(0,Math.min(10,v))/10;
  const stops=[[220,38,38],[245,158,11],[63,185,80]];
  const seg = t<0.5 ? 0 : 1;
  const f = t<0.5 ? t/0.5 : (t-0.5)/0.5;
  const a=stops[seg], b=stops[seg+1];
  return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')';
}

/* Conseils santé, extraits pour être réutilisés hors de la page Santé (bilan du soir). */
function santeAdviceHtml(){
  const bas=SANTE_AXES.filter(a=>{ const v=santeScore(a.id); return v!==null && v<SANTE_SEUIL; });
  if(!bas.length){

    return g===null ? '' : `<div class="sn-ok">Rien dans le rouge aujourd’hui. Continue comme ça.</div>`;

    + `<p class="sn-foot">Ces repères sont des pistes générales, pas un avis médical. Si quelque chose reste durablement bas ou t’inquiète, parles-en à un médecin ou à un professionnel de santé.</p>`;

function measurableRow(m, accent, idx){
  const row = document.createElement('div');
  row.style.setProperty('--accent', accent);

  if(m.kind==='bool' && isHabit(m)){
    const weekly=m.cadence==='weekly';
    const days=weekly?weekKeys():last7Keys();
    const cells=days.map(k=>{
      const on=habitOn(m.id,k), isT=k===todayKey();
      return `<button class="hcell${on?' on':''}${isT?' today':''}" type="button" data-day="${k}" title="${k}${isT?" · aujourd'hui":''}" aria-pressed="${on?'true':'false'}"><span>${dayShort(k)}</span></button>`;
    }).join('');
    const doneCount=days.filter(k=>habitOn(m.id,k)).length;
    const streak=habitStreak(m.id);
    const wtar=m.htarget||7;
    const meta = weekly ? `cette semaine · ${doneCount}/${wtar}${doneCount>=wtar?' ✓':''}`
                        : (streak>0 ? `série · ${streak} j` : 'série rompue');
    row.className='row habit'+(weekly && doneCount>=wtar ? ' reached' : '');
    row.innerHTML=`
      <div class="serial">${serialNum(idx)}</div>
      <div class="rlabel">${esc(m.label.replace(/\s*\((?:aujourd.?hui)\)/i,''))}<span class="note tag-habit">Habitude · ${weekly?'hebdo':'quotidienne'}</span></div>
      <div class="habit-side">
        <div class="hstrip">${cells}</div>
        <div class="hmeta">${meta}</div>
      </div>`;
    row.querySelectorAll('.hcell').forEach(btn=> btn.addEventListener('click', ()=> toggleHabit(m.id, btn.dataset.day)));

  } else if(m.kind==='bool'){
    const checked=!!inv()[m.id];
    row.className='row'+(checked?' checked':'');
    row.innerHTML=`
      <div class="serial">${serialNum(idx)}</div>
      <div class="checkbox">${checked?checkSvg():''}</div>
      <div class="rlabel">${esc(m.label)}${m.note?`<span class="note">${esc(m.note)}</span>`:''}<span class="note tag-jalon">Jalon</span></div>`;
    row.setAttribute('aria-pressed', checked?'true':'false');
    if(m.mini){
      // une mini-tâche cochée n'a plus rien à montrer : elle disparaît tout de suite
      clickable(row, ()=> deleteMiniInstant(m.id));
    } else {
      clickable(row, ()=> setVal(m.id,!checked));
    }

  } else {
    const val=inv()[m.id]!==undefined?inv()[m.id]:'';
    const gs=goalState(m,val), hasGoal=!!parseGoal(m);
    row.className='row num';
    row.innerHTML=`
      <div class="rowtop">
        <div class="serial">${serialNum(idx)}</div>
        <div class="rlabel">${esc(m.label)}${m.target?`<span class="note">cible : ${esc(m.target)}${m.unit?' '+esc(m.unit):''}</span>`:''}</div>
        <div class="spark-wrap">${sparkline(m.id,accent)}</div>
        <div class="numfield"><input type="number" step="any" value="${val}" placeholder="—"/>${m.unit?`<span class="unit">${esc(m.unit)}</span>`:''}</div>
      </div>
      ${hasGoal?`<div class="goalbar"><div class="goalbar-track"><div class="goalbar-fill" style="width:${gs?gs.fill:0}%;background:${gs&&gs.reached?'var(--good)':accent};color:${gs&&gs.reached?'var(--good)':accent}"></div></div><span class="goalbar-tag${gs&&gs.reached?' reached':''}">${gs?(gs.reached?'objectif atteint ✓':'en progression'):'à renseigner'}</span></div>`:''}`;
    const input=row.querySelector('input');
    input.oninput=()=>{ inv()[m.id]=input.value; save(); };
    input.onblur=()=>{ recordNum(m.id,input.value); render(); };
  }
  return row;
}

function uiPrompt(msg, def, onOk){
  const ov=document.createElement('div'); ov.className='modal-ov';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3></h3>
    <label class="mf">Nom<input id="up-in" type="text"></label>
    <div class="modal-actions"><button class="modal-btn cancel" type="button">Annuler</button><button class="modal-btn ok" type="button">Valider</button></div></div>`;
  ov.querySelector('h3').textContent=msg;
  document.body.appendChild(ov);
  const inp=ov.querySelector('#up-in'); inp.value=def||'';
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',k); };
  const go=()=>{ const v=inp.value.trim(); close(); if(v) onOk(v); };
  function k(e){ if(e.key==='Escape') close(); else if(e.key==='Enter') go(); }
  document.addEventListener('keydown',k);
  ov.querySelector('.cancel').onclick=close;

  ov.querySelector('.ok').onclick=go;

function purgeItemData(id){ delete inv()[id]; delete inv()['h_'+id]; delete inv()['s_'+id]; delete inv()['a_'+id]; }
/* Une mini-tâche cochée sort immédiatement de la liste : elle a fait son travail. */
function deleteMiniInstant(id){
  const found=findItemAnywhere(id);
  if(!found) return;
  domain(found.dk).items = domain(found.dk).items.filter(x=>x.id!==id);
  purgeItemData(id);
  save(); render();
}

function rememberRemoval(key){
  const sc=state.schema; if(!sc) return;
  if(!Array.isArray(sc.removed)) sc.removed=[];
  if(sc.removed.indexOf(key)<0) sc.removed.push(key);
}
function deleteItem(dk,id){
  const it=findItem(dk,id); if(!it) return;
  uiConfirm(`Supprimer « ${it.label} » ? Les données associées seront effacées.`, ()=>{
    domain(dk).items = domain(dk).items.filter(x=>x.id!==id);
    rememberRemoval(id);          // pour qu'une mise à jour ne le fasse pas réapparaître

function moveItem(dk,id,dir){
  const items=domain(dk).items, i=items.findIndex(x=>x.id===id); if(i<0) return;
  const kind=items[i].kind; let j=i+dir;
  while(j>=0 && j<items.length && items[j].kind!==kind) j+=dir;
  if(j<0||j>=items.length) return;
  const tmp=items[i]; items[i]=items[j]; items[j]=tmp;
  save(); render();
}

function renderProjection(){
  const age=+mer().age||0, ret=(+mer().ret||0)/100, mo=+mer().monthly||0, cap=+mer().capital||0;
  const at40=document.getElementById('projAt40'), mil=document.getElementById('projMillion');
  if(!at40||!mil) return;
  if(age<16||age>=40){ at40.textContent="—"; mil.textContent= age>=40?"objectif dépassé ✓":"âge ?"; return; }
  const rm=ret/12, months=(40-age)*12;
  let fv=cap*Math.pow(1+rm,months);
  fv += rm>0 ? mo*((Math.pow(1+rm,months)-1)/rm) : mo*months;
  at40.textContent=fmtK(fv);
  let bal=cap, m=0;
  if(cap>=GOAL){ mil.textContent=age+" ans ✓"; return; }
  while(bal<GOAL && m<12*60){ bal=bal*(1+rm)+mo; m++; }
  if(bal>=GOAL){
    const reachedAge=age+m/12;
    const yr=new Date().getFullYear()+Math.round(m/12);
    mil.textContent=reachedAge.toFixed(1).replace('.',',')+" ans";
    mil.title="≈ "+yr;
  } else { mil.textContent="> 60 ans"; }
}

/* =====================================================================
   SYNCHRONISATION AUTOMATIQUE + HISTORIQUE
   Le jeton vit côté serveur : rien à saisir, rien à configurer ici.
   ===================================================================== */
const META_KEY='hamza_meta';       // {savedAt, sha}
const SNAP_KEY='hamza_snapshots';  // sauvegardes locales
const SNAP_MAX=20;

let cloud={ available:null, busy:false, msg:'', tone:'', lastAt:0, cause:'', detail:'' };

function meta(){
  try{ const r=localStorage.getItem(META_KEY); if(r) return Object.assign({savedAt:0,sha:null}, JSON.parse(r)); }catch(e){}
  return {savedAt:0, sha:null};
}
function metaSet(patch){
  const m=Object.assign(meta(),patch);
  try{ localStorage.setItem(META_KEY, JSON.stringify(m)); }catch(e){}
  return m;
}

/* ---- sauvegardes locales ---- */
function snapList(){ try{ const r=localStorage.getItem(SNAP_KEY); if(r) return JSON.parse(r)||[]; }catch(e){} return []; }
function snapSave(l){ try{ localStorage.setItem(SNAP_KEY, JSON.stringify(l.slice(0,SNAP_MAX))); }catch(e){} }
function snapTake(label){
  const list=snapList(), payload=JSON.stringify(state);
  if(list.length && list[0].data===payload) return list;
  list.unshift({ ts:Date.now(), label:label||'auto', data:payload });
  snapSave(list); return list;
}
function snapRestore(ts){
  const s=snapList().find(x=>x.ts===ts); if(!s) return false;
  try{
    const parsed=JSON.parse(s.data);
    snapTake('avant restauration');
    state=normalize({state:parsed});
    save(); render(); return true;
  }catch(e){ return false; }
}

/* ---- appels API ---- */
function apiHeaders(){ return { 'Content-Type':'application/json' }; }
function apiOpts(extra){ return Object.assign({ credentials:'same-origin', headers:apiHeaders() }, extra||{}); }

async function cloudFetchState(){
  const r=await fetch('/api/state', apiOpts());
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function cloudPutState(){
  const m=meta(), savedAt=Date.now();
  const r=await fetch('/api/state', apiOpts({
    method:'PUT',
    body:JSON.stringify({ state:state, savedAt:savedAt, expectedSha:m.sha })
  }));
  if(r.status===409){
    const j=await r.json();
    if(j && j.state){          // le distant est plus récent : on l'adopte
      snapTake('avant fusion cloud');
      state=normalize({state:j.state});
      metaSet({savedAt:j.savedAt, sha:j.sha});
      await Store.set(JSON.stringify(state));
      render();
      return {adopted:true};
    }
  }
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  metaSet({ savedAt:j.savedAt, sha:j.sha });
  return j;
}

function cloudSetStatus(msg, tone, busy){
  cloud.msg=msg; cloud.tone=tone||''; cloud.busy=!!busy;
  const el=document.getElementById('cloudStatus');
  if(el){ el.textContent=msg; el.className='cloud-status '+(tone||''); }
  const s=document.getElementById('saveState');
  if(s){
    clearTimeout(savedTimer);
    s.textContent = busy ? 'Synchronisation en cours…' : idleSaveLabel();
  }
}
function fmtDateTime(ts){
  try{ return new Date(ts).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; }
}

/* ---- démarrage : récupère ou envoie, automatiquement ---- */
async function cloudBoot(){
  if(localOnly){ cloud.available=false; cloudSetStatus('',''); return; }
  try{
    const j=await cloudFetchState();
    if(!j || j.configured===false){
      // Le serveur répond, mais il n'a pas de jeton GitHub : la synchro n'est pas configurée.
      cloud.available=false; cloud.cause='config'; cloudSetStatus('',''); return;
    }
    cloud.available=true;
    const localAt=meta().savedAt||0;
    if(!j.exists){                       // rien en ligne : on envoie
      await cloudPutState(); cloud.lastAt=Date.now(); cloudSetStatus('Sauvegardé en ligne','ok');
    } else if((j.savedAt||0) > localAt){ // le cloud est plus récent : on l'adopte
      snapTake('avant récupération cloud');
      state=normalize({state:j.state});
      metaSet({savedAt:j.savedAt, sha:j.sha});
      await Store.set(JSON.stringify(state));
      cloud.lastAt=j.savedAt; render(); cloudSetStatus('Données récupérées','ok');
    } else if(localAt > (j.savedAt||0)){ // le local est plus récent : on envoie
      metaSet({sha:j.sha});
      await cloudPutState(); cloud.lastAt=Date.now(); cloudSetStatus('Synchronisé','ok');
    } else {
      metaSet({sha:j.sha}); cloud.lastAt=j.savedAt||0; cloudSetStatus('À jour','ok');
    }
  }catch(e){
    // Le serveur est injoignable, ou il a renvoyé une erreur (jeton expiré, dépôt inaccessible…).
    cloud.available=false;
    cloud.cause = (e && /HTTP 5/.test(e.message)) ? 'serveur'
                : (e && /HTTP 4/.test(e.message)) ? 'acces' : 'reseau';
    cloud.detail = (e && e.message) || '';
    cloudSetStatus('','');
  }
}

/* ---- envoi automatique après chaque modification ---- */
let syncTimer=null, syncQueued=false, syncEnAttente=false;
/* Envoi immédiat, sans attendre le délai : utilisé quand l'app passe en arrière-plan
   ou se ferme, pour qu'une modification faite juste avant ne soit jamais perdue. */
async function cloudFlush(){
  if(cloud.available===false || !syncEnAttente) return;
  clearTimeout(syncTimer);
  syncEnAttente=false;
  try{
    // sendBeacon survit à la fermeture de l'onglet, contrairement à fetch
    const payload=JSON.stringify({ state:state, savedAt:Date.now(), expectedSha:meta().sha });
    if(navigator.sendBeacon){
      const blob=new Blob([payload], {type:'application/json'});
      if(navigator.sendBeacon('/api/state?beacon=1', blob)) return;
    }
    await cloudPutState();
  }catch(e){}
}
function cloudAutoSync(){
  if(cloud.available===false) return;
  syncEnAttente=true;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async ()=>{
    syncEnAttente=false;
    if(cloud.busy){ syncQueued=true; return; }
    cloudSetStatus('Synchronisation…','',true);
    try{
      await cloudPutState();
      cloud.lastAt=Date.now(); cloudSetStatus('Synchronisé','ok');
      if(cloud.available===null) cloud.available=true;
    }catch(e){
      cloudSetStatus('Hors ligne — sauvegarde locale conservée','err');
    }
    cloud.busy=false;
    if(syncQueued){ syncQueued=false; cloudAutoSync(); }
  }, 2500);
}

/* ---- vérification périodique (autres appareils) ---- */
async function cloudPoll(){
  if(cloud.available!==true || cloud.busy) return;
  try{
    const j=await cloudFetchState();
    if(j && j.exists && (j.savedAt||0) > (meta().savedAt||0)){
      snapTake('avant mise à jour distante');
      state=normalize({state:j.state});
      metaSet({savedAt:j.savedAt, sha:j.sha});
      await Store.set(JSON.stringify(state));
      cloud.lastAt=j.savedAt; render(); cloudSetStatus('Mis à jour depuis un autre appareil','ok');
    }
  }catch(e){}
}

/* ---- page Historique ---- */
async function cloudDiagnostic(){
  const out=document.getElementById('cloudDiagOut');
  if(!out) return;
  out.innerHTML='<div class="cloud-diag">Test en cours…</div>';
  const lignes=[];
  try{
    const r=await fetch('/api/state', apiOpts());
    lignes.push('Réponse du serveur : HTTP '+r.status);
    let j=null; try{ j=await r.json(); }catch(e){}
    if(j && j.configured===false){
      lignes.push('→ Le serveur tourne, mais aucun jeton GitHub n\'est configuré.');
      lignes.push('À faire : sur Vercel, Settings → Environment Variables, ajoute GITHUB_TOKEN (et GITHUB_OWNER / GITHUB_REPO si absents), puis redéploie.');
    } else if(j && j.configured===true){
      lignes.push('→ Synchronisation configurée et joignable.');
      lignes.push(j.exists ? ('Dernière sauvegarde en ligne : '+fmtDateTime(j.savedAt||0)) : 'Aucune sauvegarde en ligne pour l\'instant.');
    } else if(j && j.error){
      lignes.push('→ Erreur renvoyée : '+j.error);
      lignes.push('Souvent un jeton GitHub expiré ou révoqué. Régénère-le sur GitHub, puis remplace GITHUB_TOKEN sur Vercel.');
    } else {
      lignes.push('→ Réponse inattendue du serveur.');
    }
  }catch(e){
    lignes.push('Impossible de joindre le serveur : '+((e&&e.message)||'erreur réseau'));
    lignes.push('Vérifie ta connexion, puis que le déploiement Vercel est bien en ligne.');
  }
  out.innerHTML='<div class="cloud-diag">'+lignes.map(l=>'<p>'+esc(l)+'</p>').join('')+'</div>';
}
function renderCloud(panel){
  panel.innerHTML=`
    <div class="reg-head" style="--accent:var(--gold)">
      <div class="eyebrow">Système</div>
      <h2>Historique &amp; sauvegardes</h2>
    </div>

    <div class="cloud-card">
      <div class="cloud-head"><span class="cloud-dot" id="cloudDot"></span><span id="cloudLine">Vérification…</span></div>
      <div class="cloud-status" id="cloudStatus"></div>
      <p class="cloud-note">La synchronisation est automatique : tes modifications partent en ligne toutes les quelques secondes, et l'application récupère seule la version la plus récente à l'ouverture.</p>
      <div class="cloud-actions"><button class="pm-btn sm" id="cloudDiag" type="button">Tester la connexion</button></div>
      <div id="cloudDiagOut"></div>
    </div>

    <div class="ledger-label">Versions en ligne</div>
    <div class="cloud-card"><div id="revList"><div class="mini-empty">Chargement…</div></div></div>

    <div class="ledger-label">Sauvegardes locales</div>
    <div class="cloud-card"><div id="snapListBox"></div>
      <div class="cloud-actions">
        <button class="modal-btn" id="cSnap" type="button">Créer une sauvegarde</button>
        <button class="modal-btn" id="cExport" type="button">Exporter un fichier</button>
        <button class="modal-btn" id="cImport" type="button">Importer un fichier</button>
      </div>
    </div>
  `;
  const $=s=>panel.querySelector(s);

  const line=$('#cloudLine'), dot=$('#cloudDot');
  if(cloud.available===true){ line.textContent='Synchronisation active'+(cloud.lastAt?(' · dernière : '+fmtDateTime(cloud.lastAt)):''); dot.className='cloud-dot on'; }
  else if(cloud.available===false){
    line.textContent = cloud.cause==='config' ? 'Mode local — jeton GitHub absent sur le serveur'
                     : cloud.cause==='acces'  ? 'Mode local — accès au dépôt refusé (jeton expiré ?)'
                     : cloud.cause==='serveur'? 'Mode local — erreur côté serveur'
                     : cloud.cause==='reseau' ? 'Mode local — serveur injoignable'
                     : 'Mode local — synchronisation non configurée';
    dot.className='cloud-dot off';
  }
  else { line.textContent='Vérification…'; dot.className='cloud-dot'; }
  $('#cloudDiag').addEventListener('click', cloudDiagnostic);

  (async ()=>{
    const box=$('#revList');
    if(cloud.available!==true){ box.innerHTML='<div class="mini-empty">Disponible une fois la synchronisation en place.</div>'; return; }
    try{
      const r=await fetch('/api/history', apiOpts());
      const j=await r.json();
      const list=(j&&j.commits)||[];
      if(!list.length){ box.innerHTML='<div class="mini-empty">Aucune version enregistrée pour l\'instant.</div>'; return; }
      box.innerHTML=list.map(c=>`<div class="hist-row"><div><b>${esc(fmtDateTime(Date.parse(c.date)))}</b><span>${esc(String(c.sha).slice(0,7))}</span></div><button class="pm-btn sm" data-sha="${esc(c.sha)}" type="button">Restaurer</button></div>`).join('');
      box.querySelectorAll('[data-sha]').forEach(b=> b.onclick=()=>{
        uiConfirm('Restaurer cette version ? Une sauvegarde locale est créée avant.', async ()=>{
          try{
            const rr=await fetch('/api/history?sha='+encodeURIComponent(b.dataset.sha), apiOpts());
            const jj=await rr.json();
            if(!jj || !jj.state) throw new Error('Version illisible');
            snapTake('avant restauration de version');
            state=normalize({state:jj.state});
            save(); render();
            cloudSetStatus('Version restaurée','ok');
          }catch(e){ cloudSetStatus('Échec : '+e.message,'err'); }
        });
      });
    }catch(e){ box.innerHTML='<div class="mini-empty">Historique indisponible.</div>'; }
  })();

  function drawSnaps(){
    const box=$('#snapListBox'), list=snapList();
    box.innerHTML = list.length
      ? list.map(s=>`<div class="hist-row"><div><b>${esc(fmtDateTime(s.ts))}</b><span>${esc(s.label)} · ${Math.round(s.data.length/1024)} ko</span></div><button class="pm-btn sm" data-ts="${s.ts}" type="button">Restaurer</button></div>`).join('')
      : '<div class="mini-empty">Aucune sauvegarde locale pour l\'instant.</div>';
    box.querySelectorAll('[data-ts]').forEach(b=> b.onclick=()=>{
      uiConfirm('Restaurer cette sauvegarde locale ?', ()=>{ if(snapRestore(+b.dataset.ts)) render(); });
    });
  }
  $('#cSnap').onclick=()=>{ snapTake('manuelle'); drawSnaps(); };
  $('#cExport').onclick=()=>{
    const blob=new Blob([JSON.stringify({source:'hamza-gestion-de-vie',version:1,savedAt:Date.now(),state:state},null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`hamza-gestion-de-vie-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  $('#cImport').onclick=()=>{ const f=document.getElementById('importFile'); if(f) f.click(); };
  drawSnaps();
  cloudSetStatus(cloud.msg, cloud.tone, cloud.busy);
}

/* =====================================================================
   INIT — porte privée, splash, navigation clavier
   ===================================================================== */
let appReady=false, localOnly=false;
async function enterApp(){
  const s=document.getElementById('splash');
  if(s){
    let reduce=false; try{ reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    s.classList.add('go');
    setTimeout(()=>{ if(s.parentNode) s.remove(); }, reduce?40:2350);
  }
  await loadState();
  try{ snapTake('ouverture'); }catch(e){}
  appReady=true;
  try{ await cloudBoot(); }catch(e){}
  // Décision unique, une fois l'état réconcilié avec le cloud : si un autre appareil
  // a déjà validé la lecture du jour, elle compte — pas la peine de la relire ici.
  if(manifesteVuAujourdhui()){ render(); } else { openMorningGate(); }
  try{
    setInterval(cloudPoll, 90000);
    window.addEventListener('focus', cloudPoll);
    // L'app passe en arrière-plan (verrouillage du téléphone, changement d'onglet) :
    // on envoie tout de suite au lieu d'attendre, et on vérifie au retour.
    document.addEventListener('visibilitychange', ()=>{
      if(document.hidden) cloudFlush(); else cloudPoll();
    });
    window.addEventListener('pagehide', cloudFlush);
  }catch(e){}
}

/* Plus de porte d'entrée : l'application s'ouvre directement. */
enterApp();

/* --- capture rapide : noter une idée sans naviguer --- */
function openQuickCapture(){
  if(document.querySelector('.modal-ov')) return;
  const ov=document.createElement('div'); ov.className='modal-ov';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <h3>Capture rapide</h3>
    <textarea id="qcText" class="qc-text" placeholder="Une idée, une réflexion, un truc à ne pas oublier…"></textarea>
    <div class="qc-hint">Enregistré dans <b>Machine à idées</b> · Cmd/Ctrl + Entrée pour valider</div>
    <div class="modal-actions"><button class="modal-btn cancel" type="button">Annuler</button><button class="modal-btn ok" type="button">Enregistrer</button></div>
  </div>`;
  document.body.appendChild(ov);
  const ta=ov.querySelector('#qcText');
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',k); };
  function k(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown',k);
  ov.querySelector('.cancel').onclick=close;
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  const go=()=>{
    const v=ta.value.trim(); if(!v){ close(); return; }
    const first=v.split('\n')[0].slice(0,60);
    const rest=v.split('\n').slice(1).join('\n').trim();
    nbList('machineidees').unshift({ id:'n'+Date.now(), title:first, text:rest, ts:Date.now() });
    save(); close();
    if(activeView==='registre' && activeChapter==='machineidees') render();
    flashCapture();
  };
  ov.querySelector('.ok').onclick=go;
  ta.addEventListener('keydown', e=>{ if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); go(); } });
  setTimeout(()=>{ try{ ta.focus(); }catch(e){} }, 40);
}
function flashCapture(){
  const b=document.getElementById('quickBtn'); if(!b) return;
  b.classList.add('done'); setTimeout(()=>b.classList.remove('done'), 900);
}
(function(){
  const b=document.getElementById('quickBtn');
  if(b) b.addEventListener('click', openQuickCapture);
  const f=document.getElementById('footHist');
  if(f) f.addEventListener('click', ()=>{ activeView='cloud'; render(); window.scrollTo({top:0,behavior:'smooth'}); });
})();

/* --- installation mobile : fonctionnement hors ligne --- */
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); });
}

/* --- navigation « jeu vidéo » au clavier --- */
function navList(){ return REGS().map(r=>({type:'reg',id:r.id})); }
function currentNavIndex(){ const l=navList(); const i=l.findIndex(x=>x.type==='reg'&&x.id===activeReg); return i<0?0:i; }
function navGo(idx){
  const l=navList(); idx=(idx+l.length)%l.length; const t=l[idx];
  activeView='registre'; activeReg=t.id;
  const r=REGS().find(x=>x.id===t.id); if(r) activeChapter=r.domains[0];
  render();
}
function chapterNav(dir){
  if(activeView!=='registre') return; const reg=currentReg(); if(reg.domains.length<2) return;
  let i=reg.domains.indexOf(activeChapter); i=(i+dir+reg.domains.length)%reg.domains.length; activeChapter=reg.domains[i]; render();
}
document.addEventListener('keydown', e=>{
  if(!appReady) return;
  const t=e.target;
  if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return;
  if(document.querySelector('.modal-ov')) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); navGo(currentNavIndex()+1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); navGo(currentNavIndex()-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); chapterNav(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); chapterNav(-1); }
  else if(e.key==='n'||e.key==='N'){ e.preventDefault(); openQuickCapture(); }
  else if(/^[1-9]$/.test(e.key)){ const n=+e.key-1, l=navList(); if(n<l.length){ e.preventDefault(); navGo(n); } }
});
