function renderChapter(dKey, accent){
  const d = domain(dKey);
  const wrap = document.createElement('div');
  let order = 0;
  const stagger = el => { el.style.setProperty('--i', Math.min(order++, 18)); return el; };

  if(editMode) wrap.appendChild(domainEditBar(dKey, accent));

  // Les rendez-vous du jour remontent ici : c'est la page qu'on ouvre en premier
  if(dKey==='socle'){
    const rj=bandeauRdvDuJour(); if(rj) wrap.appendChild(rj);
    const st=bandeauStopTravail(); if(st) wrap.appendChild(st);
    const bs=bandeauBilanSoir(); if(bs) wrap.appendChild(bs);
  }

  if(d.note){
    const note = document.createElement('div');
    note.className = 'intro-note';
    note.textContent = d.note;
    wrap.appendChild(note);
  }

  if(d.special==='plancouple'){ renderPlanCouple(wrap, accent); return wrap; }
  if(d.special==='redflag'){ renderRedFlag(wrap, accent); return wrap; }
  if(d.special==='boite'){ renderBoite(wrap, accent); return wrap; }
  if(d.special==='routines'){ renderRoutines(wrap, accent); return wrap; }
  if(d.special==='manifest'){ renderManifest(wrap, accent); return wrap; }
  if(d.special==='pilotage'){ renderPilotage(wrap, accent); return wrap; }
  if(d.special==='notes'){ renderNotes(dKey, wrap, accent); return wrap; }
  if(d.special==='code'){ renderCode(wrap, accent); return wrap; }
  if(d.special==='sante'){ renderSante(wrap, accent); return wrap; }
  if(d.special==='maison'){ renderMaison(wrap, accent); return wrap; }
  if(d.special==='objvie'){ renderObjectifsVie(dKey, wrap, accent, stagger); return wrap; }
  if(d.special==='patrimoine'){ renderPatrimoinePage(wrap, accent); return wrap; }
  if(d.special==='charme'){ renderFicheDeck(wrap, accent, CHARME, 'charme'); return wrap; }
  if(d.special==='pomodoro'){ renderPomodoro(wrap, accent); return wrap; }
  if(d.special==='budget'){ renderBudget(wrap, accent); return wrap; }
  if(d.special==='calendar'){ renderCalendar(wrap, accent); return wrap; }

  const measurables = (d.items||[]).filter(it=> it.kind==='bool'||it.kind==='num');
  let addObjectiveBtn = true;
  if(measurables.length){
    if(measurables.some(it=>it.phase)){
      const used=[...new Set(measurables.map(it=>it.phase||1))];
      PHASES_().forEach(p=>{ if(used.indexOf(p.n)<0) used.push(p.n); });
      used.sort((a,b)=>a-b);
      if(used.indexOf(activePhase)<0) activePhase=used[0];
      const p=activePhase;

      const all=measurables.filter(it=>(it.phase||1)===p);
      const objs=all.filter(it=>!it.mini);
      const minis=all.filter(it=>it.mini);   // une mini-tâche cochée disparaît directement, pas de section « faites »

      wrap.appendChild(phaseHeader(p, objs, accent, used));
      objs.forEach((it,i)=>{
        const row = renderItem(it, accent, i+1);
        wrap.appendChild(stagger(editMode ? wrapEditable(row, dKey, it) : wrapDeletable(row, dKey, it, {move:objs.length>1})));
      });
      if(!objs.length){ const e=document.createElement('div'); e.className='mini-empty'; e.textContent='Aucune action pour cet objectif de vie.'; wrap.appendChild(e); }
      const total=objs.length, faits=objs.filter(itemDone).length;
      const plein=total>=OBJ_MAX;
      const tousFaits=total>0 && faits===total;
      const oa=document.createElement('div'); oa.className='edit-add-row';
      oa.innerHTML=`<button class="edit-add${plein?' bloque':''}" type="button">${plein?'Limite atteinte — '+total+'/'+OBJ_MAX+' objectifs':'+ Ajouter un objectif'}</button>
        <div class="obj-count${plein?' plein':''}${tousFaits?' fini':''}">${faits}/${total} validé${faits>1?'s':''} · maximum ${OBJ_MAX} par objectif de vie</div>`;
      oa.querySelector('button').addEventListener('click', ()=>{
        if(plein){
          uiConfirm('Cet objectif de vie contient déjà '+total+' actions, et la limite est de '+OBJ_MAX+".\n\nValide-les avant d'en ajouter d'autres.", ()=>{});
          return;
        }
        openItemEditor(dKey, null, {phase:p});
      });
      wrap.appendChild(oa);

      wrap.appendChild(sectionHeaderMini('Mini-tâches', minis.length));
      const miniKey=dKey+':'+p;
      if(minis.length) wrap.appendChild(miniToggleBar(minis, miniKey));
      else if(!MINI_FOLDERS.some(f=>f.k===miniFilter[miniKey])) miniFilter[miniKey]=MINI_FOLDERS[0].k;
      const minisVus = minis.filter(it=>miniFolder(it)===miniFilter[miniKey]);
      minisVus.forEach((it,i)=>{
        const couleurCat=miniFolderInfo(miniFolder(it)).c;
        const row = renderItem(it, couleurCat, i+1);
        row.classList.add('mini-row');
        wrap.appendChild(stagger(editMode ? wrapEditable(row, dKey, it) : wrapDeletable(row, dKey, it, {rename:true})));
      });
      if(!minis.length){ const e=document.createElement('div'); e.className='mini-empty';
        e.textContent='Aucune mini-tâche pour cet objectif de vie.';
        wrap.appendChild(e); }
      else if(!minisVus.length){ const e=document.createElement('div'); e.className='mini-empty';
        e.textContent='Aucune mini-tâche dans cette catégorie.';
        wrap.appendChild(e); }
      const ma=document.createElement('div'); ma.className='edit-add-row';
      ma.innerHTML=`<button class="edit-add tangerine" type="button" style="--cat:${miniFolderInfo(miniFilter[miniKey]).c}">+ Ajouter une mini-tâche · ${esc(miniFolderInfo(miniFilter[miniKey]).l)}</button>`;
      ma.querySelector('button').addEventListener('click', ()=> openItemEditor(dKey, null, {phase:p, mini:true, folder:miniFilter[miniKey]}));
      wrap.appendChild(ma);
      addObjectiveBtn=false;
    } else {
      wrap.appendChild(ledgerLabel('Pièces mesurables'));
      measurables.forEach((it,i)=>{
        const row = renderItem(it, accent, i+1);
        wrap.appendChild(stagger(editMode ? wrapEditable(row, dKey, it) : wrapDeletable(row, dKey, it)));
      });
    }
  }
  // Le détail de la routine grooming vit avec les habitudes du corps, pas dans Maison.
  if(dKey==='corps'){
    wrap.appendChild(ledgerLabel('Routine grooming'));
    const gr=document.createElement('div');
    wrap.appendChild(gr);
    renderGrooming(gr, accent);
  }
  [ { kinds:['addiction'], label:'Jours consécutifs sans —' } ].forEach(g=>{
    const list = (d.items||[]).filter(it=> g.kinds.includes(it.kind));
    if(!list.length) return;
    wrap.appendChild(ledgerLabel(g.label));
    list.forEach((it,i)=>{
      const row = renderItem(it, accent, i+1);
      const node = editMode ? wrapEditable(row, dKey, it) : wrapDeletable(row, dKey, it);
      wrap.appendChild(stagger(node));
    });
  });

  // bouton d'ajout global — uniquement si la page n'est pas déjà organisée par phases
  if(addObjectiveBtn){
    const add=document.createElement('div');
    add.className='edit-add-row';
    add.innerHTML=`<button class="edit-add" type="button">+ Ajouter un objectif</button>`;
    add.querySelector('button').addEventListener('click', ()=> openItemEditor(dKey, null));
    wrap.appendChild(add);
  }
  return wrap;
}

/* enveloppe légère : bouton supprimer toujours visible, ligne reste interactive.
   Un appui long sur la ligne déclenche le glisser-déposer, comme les icônes d'iPhone —
   plus discret que des flèches en permanence à l'écran. */
function wrapDeletable(row, dk, it, opts){
  opts=opts||{};
  const w=document.createElement('div'); w.className='item-del-wrap';
  if(opts.move) attachLongPressReorder(row, w, dk, it.id);
  if(opts.rename){
    const rn=document.createElement('button');
    rn.className='iec rn'; rn.type='button'; rn.title='Modifier'; rn.setAttribute('aria-label','Modifier ce texte'); rn.textContent='✎';
    rn.addEventListener('click', e=>{ e.stopPropagation();
      uiPrompt('Modifier', it.label||'', v=>{ const t=(v||'').trim(); if(t){ it.label=t; save(); render(); } });
    });
    w.appendChild(rn);
  }
  const b=document.createElement('button');
  b.className='iec del solo'; b.type='button'; b.title='Supprimer'; b.setAttribute('aria-label','Supprimer cet objectif'); b.textContent='×';
  b.addEventListener('click', e=>{ e.stopPropagation(); deleteItem(dk, it.id); });
  w.appendChild(b); w.appendChild(row);
  return w;
}

/* Glisser-déposer par appui long. Un tap court garde son comportement normal
   (cocher l'objectif) ; tenir ~400ms puis bouger déclenche le réordonnancement. */
function attachLongPressReorder(row, wrap, dk, id){
  const HOLD=380, SLOP=9;
  let timer=null, dragging=false, startY=0, startX=0, offsetY=0;
  let placeholder=null, siblings=[], rowH=0;

  const cancelTimer=()=>{ if(timer){ clearTimeout(timer); timer=null; } };

  const beginDrag=(clientY)=>{
    dragging=true;
    row.classList.add('dragging');
    if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
    const list=wrap.parentElement; if(!list) return;
    siblings=Array.from(list.children).filter(c=>c!==wrap);
    const r=wrap.getBoundingClientRect(); rowH=r.height;
    placeholder=document.createElement('div');
    placeholder.className='item-drag-slot'; placeholder.style.height=rowH+'px';
    wrap.style.position='fixed'; wrap.style.left=r.left+'px'; wrap.style.top=r.top+'px';
    wrap.style.width=r.width+'px'; wrap.style.zIndex='500';
    list.insertBefore(placeholder, wrap);
    document.body.appendChild(wrap);
    offsetY=clientY-r.top;
  };
  const moveDrag=(clientY)=>{
    wrap.style.top=(clientY-offsetY)+'px';
    const list=placeholder.parentElement; if(!list) return;
    const centerY=clientY;
    let target=null;
    for(const sib of Array.from(list.children)){
      if(sib===placeholder) continue;
      const r=sib.getBoundingClientRect();
      if(centerY < r.top+r.height/2){ target=sib; break; }
    }
    if(target) list.insertBefore(placeholder, target);
    else list.appendChild(placeholder);
  };
  const endDrag=()=>{
    row.classList.remove('dragging');
    const list=placeholder ? placeholder.parentElement : null;
    if(list && placeholder){
      list.insertBefore(wrap, placeholder);
      placeholder.remove();
    }
    wrap.style.position=''; wrap.style.left=''; wrap.style.top=''; wrap.style.width=''; wrap.style.zIndex='';
    dragging=false; placeholder=null;
    if(list){
      const order=Array.from(list.children).map(c=>c.dataset && c.dataset.itemId).filter(Boolean);
      if(order.length) reorderItems(dk, order);
    }
  };

  wrap.dataset.itemId=id;

  const onDown=e=>{
    if(e.target.closest('.iec.del')) return;   // le bouton supprimer garde son comportement
    const p = e.touches ? e.touches[0] : e;
    startX=p.clientX; startY=p.clientY;
    cancelTimer();
    timer=setTimeout(()=>beginDrag(startY), HOLD);
  };
  const onMove=e=>{
    const p = e.touches ? e.touches[0] : e;
    if(dragging){ e.preventDefault(); moveDrag(p.clientY); return; }
    if(timer && (Math.abs(p.clientX-startX)>SLOP || Math.abs(p.clientY-startY)>SLOP)) cancelTimer();
  };
  const onUp=()=>{ cancelTimer(); if(dragging) endDrag(); };

  wrap.addEventListener('pointerdown', onDown);
  wrap.addEventListener('pointermove', onMove);
  wrap.addEventListener('pointerup', onUp);
  wrap.addEventListener('pointercancel', onUp);
  wrap.addEventListener('pointerleave', e=>{ if(!dragging) cancelTimer(); });
}
function reorderItems(dk, orderedIds){
  const items=domain(dk).items;
  const byId={}; items.forEach(it=>{ byId[it.id]=it; });
  const moved=orderedIds.map(id=>byId[id]).filter(Boolean);
  let mi=0;
  // seuls les items du groupe déplacé changent de position ; tout le reste (autres phases, minis) reste en place
  domain(dk).items = items.map(it=> orderedIds.indexOf(it.id)>=0 ? moved[mi++] : it);
  save(); render();
}

function renderItem(it, accent, idx){
  if(it.kind==='bool' || it.kind==='num') return measurableRow(it, accent, idx);
  if(it.kind==='addiction') return counterRow(it, accent, idx);
  return qualRow(it, accent);
}

/* Ce qui est fixé aujourd'hui — affiché en tête du Socle */
/* ---- Le bilan du soir : l'app vient demander, pas l'inverse ----
   Chaque item se répond en un clic (Oui/Non) et met à jour la vraie donnée
   (habitude cochée, addiction craquée ou tenue, révision du code faite). */
function checkinStore(){ if(!inv().checkin || typeof inv().checkin!=='object') inv().checkin={}; return inv().checkin; }
function checkinFaitAujourdhui(){ return !!checkinStore()[todayKey()]; }
function bilanItems(){
  const today=todayKey(), items=[];
  Object.keys(DOMS()).forEach(dk=>{
    (domain(dk).items||[]).forEach(it=>{
      if(it.kind==='bool' && isHabit(it) && !habitOn(it.id,today)){
        items.push({type:'habit', id:it.id, label:it.label});
      }
      if(it.kind==='addiction'){
        items.push({type:'addiction', id:it.id, label:it.label});
      }
    });
  });
  if(!habitOn('code_revision', today) && DOMS().code){
    items.push({type:'habit', id:'code_revision', label:'Révision du code de la route'});
  }
  return items;
}
function openBilanSoir(){
  const items=bilanItems();
  let idx=0;
  const ov=document.createElement('div'); ov.className='modal-ov';
  ov.innerHTML=`<div class="modal bilan" role="dialog" aria-modal="true">
    <h3>Bilan du soir</h3>
    <div id="bsBody"></div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',k); };
  function k(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown',k);
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  const body=ov.querySelector('#bsBody');

  function drawQuestion(){
    if(idx>=items.length){ drawRessenti(); return; }
    const it=items[idx];
    const q = it.type==='addiction' ? 'Aujourd’hui, tu as évité : ' + it.label + ' ?' : it.label + ' — fait aujourd’hui ?';
    body.innerHTML=`<div class="bs-pos">${idx+1} / ${items.length+1}</div>
      <div class="bs-q">${esc(q)}</div>
      <div class="bs-btns">
        <button class="qz-b bon" id="bsOui" type="button">Oui</button>
        <button class="qz-b faux" id="bsNon" type="button">Non</button>
      </div>`;
    body.querySelector('#bsOui').onclick=()=>{ answer(it,true); };
    body.querySelector('#bsNon').onclick=()=>{ answer(it,false); };
  }
  function answer(it, oui){
    if(it.type==='habit'){
      if(oui && !habitOn(it.id, todayKey())) toggleHabit(it.id, todayKey());
      idx++; drawQuestion();
    } else if(it.type==='addiction'){
      if(oui){
        const o=streakObj(it.id); if(!o.start) startStreak(it.id);
        idx++; drawQuestion();
      } else {
        openRelapseWarning(it.id, it.label, ()=>{ relapseStreak(it.id); idx++; drawQuestion(); });
      }
    } else {
      idx++; drawQuestion();
    }
  }
  /* Le ressenti du corps est hebdomadaire (Pilotage du dimanche) : on ne le redemande plus chaque soir. */
  function drawRessenti(){ drawReflexion(); }
  const BS_SUJETS=['Hamza','Travail','Sinbury','Vie sentimentale'];
  function drawReflexion(){
    body.innerHTML=`<div class="bs-pos">${items.length+1} / ${items.length+1}</div>
      <div class="bs-q">Une réflexion à écrire aujourd’hui ?</div>
      <div class="bs-topics">${BS_SUJETS.map(s=>`<button class="bs-topic" data-s="${esc(s)}" type="button">${esc(s)}</button>`).join('')}</div>
      <div class="modal-actions"><button class="modal-btn cancel" id="bsSkip" type="button">Pas aujourd’hui</button></div>`;
    body.querySelectorAll('[data-s]').forEach(b=> b.onclick=()=> drawReflexionText(b.dataset.s));
    body.querySelector('#bsSkip').onclick=()=>{ checkinStore()[todayKey()]=true; save(); close(); };
  }
  function drawReflexionText(sujet){
    body.innerHTML=`<div class="bs-pos">${esc(sujet)}</div>
      <textarea class="qc-text" id="bsTxt" placeholder="Écris ce qui te passe par la tête…"></textarea>
      <div class="modal-actions"><button class="modal-btn cancel" id="bsBack" type="button">Retour</button><button class="modal-btn ok" id="bsSave" type="button">Enregistrer</button></div>`;
    body.querySelector('#bsBack').onclick=()=> drawReflexion();
    body.querySelector('#bsSave').onclick=()=>{
      const v=(body.querySelector('#bsTxt').value||'').trim();
      if(v) nbList('machineidees').unshift({id:'n'+Date.now(), title:sujet+' — '+fmtDateShort(todayKey()), text:v, ts:Date.now(), folder:'violet'});
      checkinStore()[todayKey()]=true; save(); close();
    };
    setTimeout(()=>{ try{ body.querySelector('#bsTxt').focus(); }catch(e){} },30);
  }
  drawQuestion();
}

function ledgerLabel(text){ const d=document.createElement('div'); d.className='ledger-label'; d.textContent=text; return d; }

let activePhase = 1;
const PHASE_NAMES={1:'Fondations',2:'Construction',3:'Envergure',4:'Consolidation',5:'Horizon'};
function itemDone(it){
  if(it.kind==='bool'){ return isHabit(it) ? habitDoneNow(it) : !!inv()[it.id]; }
  if(it.kind==='num'){ const g=goalState(it, inv()[it.id]); return !!(g && g.reached); }
  return !!inv()[it.id];
}
function phaseHeader(p, list, accent, used){
  const done=list.filter(itemDone).length, total=list.length;
  const pct=total?Math.round(done/total*100):0;
  const o=objVie(p);
  const el=document.createElement('div');
  el.className='phase-head clickable objvie'+(total&&pct===100?' complete':'');
  el.style.setProperty('--accent',accent);
  el.setAttribute('role','button');
  el.setAttribute('tabindex','0');
  el.innerHTML=`
    <div class="ph-left"><span class="ph-num">Objectif ${o.n}</span><span class="ph-name">${esc(o.t)}</span><span class="ph-caret">▾</span>
      <span class="ph-desc">${esc(o.d)}</span></div>
    <div class="ph-right"><span class="ph-count">${total?done+'/'+total+(pct===100?' ✓':''):'—'}</span><div class="ph-bar"><i style="width:${pct}%"></i></div></div>`;
  const open=e=>{ e.stopPropagation(); openPhaseMenu(el, used||[p]); };
  el.addEventListener('click', open);
  el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(e); } });
  return el;
}

/* ---- Calendrier & RDV ---- */
function calList(){ if(!Array.isArray(inv().calendar)) inv().calendar=[]; return inv().calendar; }
/* La grille du mois : ce qui manquait vraiment — un vrai calendrier, pas qu'une liste. */
let calGridMonth=null;   // 'YYYY-MM' ; null = mois en cours
function renderCalGrid(host, accent){
  if(!calGridMonth) calGridMonth=monthKey();
  function draw(){
    const [y,m]=calGridMonth.split('-').map(Number);
    const premier=new Date(y, m-1, 1);
    const nbJours=new Date(y, m, 0).getDate();
    const decalage=(premier.getDay()+6)%7;   // lundi=0
    const today=todayKey();
    const parJour={};
    calList().forEach(e=>{ if(e.date){ (parJour[e.date]=parJour[e.date]||[]).push(e); } });

    const titre=premier.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    let cells='';
    for(let i=0;i<decalage;i++) cells+='<div class="cg-cell vide"></div>';
    for(let d=1; d<=nbJours; d++){
      const k=dateKey(new Date(y,m-1,d));
      const evts=(parJour[k]||[]);
      const cats=[...new Set(evts.map(e=>rdvCat(e).c))];
      // Assez de place pour un intitulé quand il y a peu de rendez-vous ce jour-là ;
      // au-delà, on retombe sur les pastilles pour ne pas surcharger la case.
      const titres = evts.length<=2
        ? evts.map(e=>`<span class="cg-titre-mini" style="color:${rdvCat(e).c}">${esc(e.title||'')}</span>`).join('')
        : '';
      cells+=`<div class="cg-cell${k===today?' auj':''}${evts.length?' a-des-rdv':''}" data-day="${k}">
        <span class="cg-n">${d}</span>
        ${titres || (cats.length?`<span class="cg-dots">${cats.slice(0,4).map(c=>`<i style="background:${c}"></i>`).join('')}</span>`:'')}
      </div>`;
    }
    host.innerHTML=`<div class="cg-head">
        <button class="pm-btn sm" id="cgPrev" type="button">←</button>
        <div class="cg-titre">${esc(titre)}</div>
        <button class="pm-btn sm" id="cgNext" type="button">→</button>
      </div>
      <div class="cg-dow">${['L','M','M','J','V','S','D'].map(j=>`<span>${j}</span>`).join('')}</div>
      <div class="cg-grid">${cells}</div>`;
    const $=s=>host.querySelector(s);
    const shift=n=>{ const d=new Date(y,m-1+n,1); calGridMonth=monthKey(d); draw(); };
    $('#cgPrev').onclick=()=>shift(-1);
    $('#cgNext').onclick=()=>shift(1);
    host.querySelectorAll('[data-day]').forEach(c=> c.addEventListener('click', ()=>{
      const k=c.dataset.day, evts=parJour[k]||[];
      if(evts.length) openJourPopover(k, evts); else openEventEditor(null, ()=>render(), k);
    }));
  }
  draw();
}

  const ov=document.createElement('div'); ov.className='modal-ov';

  ov.addEventListener('click',ev=>{ if(ev.target===ov) close(); });

function renderCalendar(wrap, accent){
  const box=document.createElement('div'); box.className='cal'; box.style.setProperty('--accent',accent);
  box.innerHTML=`<div id="calGrid"></div><div class="nb-add-row"><button class="edit-add" id="calNew" type="button">+ Ajouter un rendez-vous</button></div><div id="calBody"></div>`;
  wrap.appendChild(box);
  renderCalGrid(box.querySelector('#calGrid'), accent);
  const body=box.querySelector('#calBody');
  function draw(){
    const today=todayKey();
    const now=new Date(today+'T12:00:00');
    // fin de la semaine courante (dimanche)
    const finSem=new Date(now); finSem.setDate(now.getDate()+(7-((now.getDay()+6)%7)-1));
    const finSemK=dateKey(finSem);
    const finMoisK=dateKey(new Date(now.getFullYear(), now.getMonth()+1, 0));

    const list=calList().slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'') || (a.time||'').localeCompare(b.time||''));
    const passes=list.filter(e=>(e.date||'')<today || e.fait).reverse();
    const aVenir=list.filter(e=>(e.date||'')>=today && !e.fait);
    const semaine=aVenir.filter(e=>e.date<=finSemK);
    const mois=aVenir.filter(e=>e.date>finSemK && e.date<=finMoisK);
    const apres=aVenir.filter(e=>e.date>finMoisK);

    if(!list.length){ body.innerHTML=`<div class="nb-empty">Aucun rendez-vous. Ajoute ce qui est fixé dans le temps.</div>`; return; }

    const card=e=>{
      const soon=e.date===today;
      const cat=rdvCat(e);
      return `<div class="cal-card${soon?' today':''}${e.fait?' fait':''}" data-id="${esc(e.id)}" style="--cat:${cat.c}">
        <div class="cal-date"><b>${esc(fmtDayNum(e.date))}</b><span>${esc(fmtMonthShort(e.date))}</span>${e.allday?`<em class="cal-hour jour">journée</em>`:(e.time?`<em class="cal-hour">${esc(e.time)}</em>`:'')}</div>
        <div class="cal-main"><div class="cal-title">${esc(e.title||'—')}</div>
          <div class="cal-meta">${esc(fmtWeekday(e.date))}${e.allday?' · toute la journée':(e.time?' · '+esc(e.time):'')}${soon?' · aujourd’hui':''}${e.rid?' · <span class="cal-rep">série</span>':''}${e.fait?' · effectué':''}<span class="cal-cat">${esc(cat.l)}</span></div>
          ${e.note?`<div class="cal-note">${esc(e.note)}</div>`:''}</div>
        <button class="cal-fait cd-box" data-fait="${esc(e.id)}" type="button" aria-label="Marquer comme effectué">${e.fait?'✓':''}</button>
        <button class="nb-del" data-del="${esc(e.id)}" aria-label="Supprimer">×</button></div>`;
    };
    const bloc=(titre,arr)=> arr.length?`<div class="ledger-label">${titre} <span class="cal-n">${arr.length}</span></div>${arr.map(card).join('')}`:'';
    const repli=(titre,arr)=> arr.length?`<details class="cal-fold"><summary>${titre} <span class="cal-n">${arr.length}</span></summary>${arr.map(card).join('')}</details>`:'';

    body.innerHTML = bloc('Cette semaine', semaine)
      + bloc('Ce mois-ci', mois)
      + repli('Les prochains mois', apres)
      + (passes.length?`<details class="cal-fold pass"><summary>Passés <span class="cal-n">${passes.length}</span></summary>${passes.map(card).join('')}</details>`:'')
      + ((!semaine.length && !mois.length)?`<div class="nb-empty">Rien de prévu d'ici la fin du mois.</div>`:'');

    body.querySelectorAll('[data-fait]').forEach(b=>b.addEventListener('click',ev=>{ ev.stopPropagation();
      const x=calList().find(y=>y.id===b.dataset.fait); if(x){ x.fait=!x.fait; save(); render(); }
    }));
    body.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',ev=>{ ev.stopPropagation();
      const target=calList().find(x=>x.id===b.dataset.del);
      const removeOne=()=>{ const i=calList().findIndex(x=>x.id===b.dataset.del); if(i>=0)calList().splice(i,1); save(); render(); };
      if(target && target.rid){
        const n=calList().filter(x=>x.rid===target.rid).length;
        uiChoice('Ce rendez-vous fait partie d’une série de '+n+' occurrences.',
          [{label:'Supprimer cette occurrence', fn:removeOne},
           {label:'Supprimer toute la série', danger:true, fn:()=>{ inv().calendar=calList().filter(x=>x.rid!==target.rid); save(); render(); }}]);
      } else {
        uiConfirm('Supprimer ce rendez-vous ?', removeOne);
      }
    }));
    body.querySelectorAll('.cal-card').forEach(c=>c.addEventListener('click',ev=>{ if(ev.target.closest('[data-del]'))return; openEventEditor(c.dataset.id, ()=>render()); }));
  }
  box.querySelector('#calNew').addEventListener('click',()=> openEventEditor(null, ()=>render()));
  draw();
}

/* Développe une récurrence en dates concrètes (plafonné, pour rester sain) */
function expandRecurrence(start, rep, until){
  if(!rep) return [start];
  const out=[];
  const d=new Date(start+'T12:00:00');
  const end = until ? new Date(until+'T12:00:00') : new Date(d.getTime()+365*86400000);
  let guard=0;
  while(d<=end && out.length<400 && guard++<1000){
    const dow=d.getDay();
    if(rep!=='weekdays' || (dow>=1 && dow<=5)) out.push(dateKey(d));
    if(rep==='daily' || rep==='weekdays') d.setDate(d.getDate()+1);
    else if(rep==='weekly') d.setDate(d.getDate()+7);
    else if(rep==='monthly') d.setMonth(d.getMonth()+1);
    else break;
  }
  return out.length?out:[start];
}

function pcAllCats(){ const out=[]; PC_BOITE.forEach(g=>g.cats.forEach(c=>out.push(Object.assign({fam:g.label},c)))); return out; }
function pcCatByKey(k){ return pcAllCats().find(c=>c.k===k); }
function pcCustomStore(){ if(!inv().pc_custom || typeof inv().pc_custom!=='object') inv().pc_custom={}; return inv().pc_custom; }
function pcCustomFor(k){ return pcCustomStore()[k] || []; }
/* Toutes les idées d'une catégorie — celles d'origine comme celles ajoutées — deviennent
   une seule liste modifiable, matérialisée une fois puis stockée telle quelle. */
function pcItems(k){
  const st=pcCustomStore();
  const cur=st[k];
  if(!Array.isArray(cur) || (cur.length>0 && typeof cur[0]==='string')){
    const c=pcCatByKey(k);
    const usine=(c?c.items:[]).map(txt=>({txt}));
    const deja=(Array.isArray(cur)?cur:[]).map(txt=>({txt}));   // anciennes idées ajoutées (ancien format texte)
    st[k]=usine.concat(deja);
  }
  return st[k];
}

    head.innerHTML=`<div class="phase-head${n>=ROUTINE_GOAL?' complete':''}" style="--accent:${accent}">
      <div class="ph-left"><span class="ph-num">Objectif</span><span class="ph-name">Au moins ${ROUTINE_GOAL} routines</span></div>
      <div class="ph-right"><span class="ph-count">${n}/${ROUTINE_GOAL}${n>=ROUTINE_GOAL?' ✓':''}</span><div class="ph-bar"><i style="width:${pct}%"></i></div></div></div>`;
    body.innerHTML = n ? list.map((r,i)=>`<div class="rt-item"><span class="rt-n">${String(i+1).padStart(2,'0')}</span><span class="rt-txt">${esc(r)}</span><button class="nb-del" data-i="${i}" aria-label="Supprimer">×</button></div>`).join('')
                       : `<div class="mini-empty">Aucune routine notée. Ajoute celles que tu tiens déjà.</div>`;
    body.querySelectorAll('.nb-del').forEach(b=>b.addEventListener('click',()=>{ routList().splice(+b.dataset.i,1); save(); draw(); }));
  }
  const add=()=>{ const v=input.value.trim(); if(!v) return; routList().push(v); input.value=''; save(); draw(); };
  box.querySelector('#rtBtn').addEventListener('click', add);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });
  draw();
}

function buildPcBoite(box){
  const cats=pcAllCats();
  if(!pcActiveCat || !pcCatByKey(pcActiveCat)) pcActiveCat = cats[0].k;
  const sel=box.querySelector('#pcSel');
  sel.innerHTML = PC_BOITE.map(g=>`
    <div class="pc-fam">
      <span class="pc-fam-l">${esc(g.label)}</span>
      <div class="pc-fam-chips">${g.cats.map(c=>`<button class="pc-typechip${c.k===pcActiveCat?' active':''}${c.wahou?' wahou':''}" type="button" data-cat="${c.k}">${esc(c.l)}</button>`).join('')}</div>
    </div>`).join('');
  sel.querySelectorAll('[data-cat]').forEach(btn=> btn.addEventListener('click', ()=>{ pcActiveCat=btn.dataset.cat; buildPcBoite(box); }));
  renderPcIdeas(box);
}

function renderPcIdeas(box){
  const c=pcCatByKey(pcActiveCat); if(!c) return;
  const ideas=box.querySelector('#pcIdeas');
  const items=pcItems(c.k);
  const chips=items.map((it,i)=>`<span class="pc-chip${c.wahou?' wahou':''}">
    <span class="pc-chip-txt" data-edit="${i}" title="Modifier">${esc(it.txt)}</span>
    <button class="pc-del" type="button" data-i="${i}" aria-label="Supprimer">×</button></span>`).join('');
  ideas.innerHTML=`
    <div class="pc-ideas-head">${esc(c.fam)} · <b>${esc(c.l)}</b></div>
    <div class="pc-chips">${chips || '<span class="mini-empty">Aucune idée dans cette catégorie.</span>'}</div>
    <div class="pc-add">
      <input type="text" id="pcAddIn" placeholder="Ajouter une idée à « ${esc(c.l)} »…" maxlength="120">
      <button type="button" id="pcAddBtn">Ajouter</button>
    </div>`;
  const input=ideas.querySelector('#pcAddIn');
  const add=()=>{ const v=input.value.trim(); if(!v) return; pcItems(c.k).push({txt:v}); save(); renderPcIdeas(box); };
  ideas.querySelector('#pcAddBtn').addEventListener('click', add);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });
  ideas.querySelectorAll('[data-edit]').forEach(el=> el.addEventListener('click', ()=>{
    const i=+el.dataset.edit, arr=pcItems(c.k);
    uiPrompt("Modifier l'idée", arr[i].txt, v=>{ const t=(v||'').trim(); if(!t) return; arr[i].txt=t; save(); renderPcIdeas(box); });
  }));
  ideas.querySelectorAll('.pc-del').forEach(b=> b.addEventListener('click', e=>{
    e.stopPropagation();
    pcItems(c.k).splice(+b.dataset.i,1); save(); renderPcIdeas(box);
  }));
}

/* ---- volet référence : Red flags ---- */
/* Mode évaluation : on coche les red flags observés chez une personne,
   et l'app en tire un verdict avec des suggestions concrètes. */
function rfEvalStore(){ if(!inv().rfEval || typeof inv().rfEval!=='object') inv().rfEval={nom:'', coches:{}}; if(!inv().rfEval.coches) inv().rfEval.coches={}; return inv().rfEval; }
function rfAllItems(){ const out=[]; RF_SECTIONS.forEach((s,si)=> s.items.forEach((it,ii)=> out.push({k:'s'+si+'i'+ii, t:it.t, d:it.d, sec:s.title}))); return out; }
function rfVerdict(n, total){
  if(n===0) return {t:'Aucun red flag coché', c:'var(--good)', p:["Rien d'alarmant identifié pour l'instant. Continue simplement d'observer les actes plutôt que les promesses — c'est la seule donnée fiable."]};
  if(n===1) return {t:'1 red flag — une alerte', c:'#F59E0B', p:[
    "Un red flag isolé est une alerte, pas une sentence. Il peut relever du contexte, d'un mauvais moment, ou d'un angle mort réparable.",
    "Ce qu'il faut faire : nomme-le clairement à la personne, une fois, sans dramatiser. Puis observe si le comportement change dans les semaines qui suivent.",
    "Le vrai signal n'est pas le flag lui-même — c'est la réaction quand tu le soulèves. Défensive et retournement de responsabilité : c'est plus grave que le flag d'origine."]};
  if(n===2) return {t:'2 red flags — vigilance sérieuse', c:'#F59E0B', p:[
    "Deux flags simultanés ne relèvent plus du hasard. Il y a un schéma, pas un accident.",
    "Ce qu'il faut faire : ralentis. N'accélère pas l'engagement (exclusivité, projets communs, présentation aux proches) tant que ce n'est pas clarifié.",
    "Fixe-toi une échéance mentale — six à huit semaines — et observe s'il y a une amélioration réelle et spontanée, pas seulement après une dispute.",
    "Attention au piège : plus tu investis, plus il devient coûteux de partir. C'est maintenant que la décision est la moins chère."]};
  if(n<=4) return {t:n+' red flags — la sentence', c:'#ff8a94', p:[
    "Ta propre règle est claire : un red flag est une alerte, trois sont une sentence. Tu y es.",
    "Ce qu'il faut faire : arrête d'espérer un changement. Tu n'es pas un centre de rééducation pour quelqu'un qui ne veut pas guérir — et vouloir guérir se prouve par des actes, pas par des excuses.",
    "Vérifie honnêtement ce qui te retient : l'attachement réel, ou la peur du vide et l'énergie déjà investie ? Ce ne sont pas les mêmes raisons.",
    "Si tu choisis de rester malgré tout, fixe une limite explicite et une date. Sans limite, ce n'est pas un choix, c'est une dérive."]};
  return {t:n+' red flags — sortie', c:'#ff8a94', p:[
    "À ce niveau, ce n'est plus une question d'analyse mais de décision. Le schéma est massif et documenté par tes propres observations.",
    "Ce qu'il faut faire : organise la sortie proprement et sans négociation prolongée. Les longues explications donnent surtout prise à la manipulation.",
    "Protège-toi concrètement : réduis le contact, préviens une ou deux personnes de confiance, et évite de rester seul avec la décision.",
    "Si tu ressens de la peur à l'idée de partir, ou si la relation implique intimidation ou contrôle, parles-en à quelqu'un — un proche, ou le 3919 (violences conjugales, gratuit et anonyme)."]};
}
function renderRedFlag(wrap, accent){
  const box=document.createElement('div');
  box.className='rf';
  box.style.setProperty('--accent',accent);
  wrap.appendChild(box);

  function draw(){
    const st=rfEvalStore();
    const items=rfAllItems();
    const n=items.filter(x=>st.coches[x.k]).length;
    const v=rfVerdict(n, items.length);
    const sections = RF_SECTIONS.map((s,si)=>`
      <div class="rf-sec">
        <div class="rf-sec-h"><span class="rf-roman">${s.roman}</span><h4>${esc(s.title)}</h4></div>
        <div class="rf-list">${s.items.map((it,ii)=>{
          const k='s'+si+'i'+ii, on=!!st.coches[k];
          return `<div class="rf-item${on?' on':''}" data-k="${k}" role="button" tabindex="0">
            <button class="cd-box rf-box" type="button" data-k="${k}">${on?'✓':''}</button>
            <div><b>${esc(it.t)}</b><span>${esc(it.d)}</span></div>
          </div>`;}).join('')}</div>
      </div>`).join('');

    box.innerHTML=`
      <div class="rf-golden">
        <div class="rf-golden-l">Règle d'or</div>
        <p>Un red flag est une <b>alerte</b>. Trois red flags sont une <b>sentence</b>. Ne deviens pas un centre de rééducation pour quelqu'un qui ne veut pas guérir.</p>
        <div class="rf-formulas">${RF_FORMULAS.map(f=>`<div class="rf-formula">${esc(f)}</div>`).join('')}</div>
      </div>

      <div class="rf-eval">
        <input class="rf-nom" id="rfNom" type="text" placeholder="Qui évalues-tu ? (facultatif)" value="${esc(st.nom||'')}">
        <div class="rf-score"><span class="rf-score-n" style="color:${v.c}">${n}</span><span class="rf-score-l">red flag${n>1?'s':''} coché${n>1?'s':''} sur ${items.length}</span>
          <button class="pm-btn sm" id="rfReset" type="button">Réinitialiser</button></div>
        <div class="rf-verdict" style="border-color:${v.c}">
          <b style="color:${v.c}">${esc(v.t)}</b>
          ${v.p.map(x=>`<p>${esc(x)}</p>`).join('')}
        </div>
      </div>

      ${sections}

      <div class="ledger-label">🛠 Tests rapides de détection</div>
      <div class="rf-tests">${RF_TESTS.map(t=>`<div class="rf-test"><b>${esc(t.t)}</b><span>${esc(t.d)}</span></div>`).join('')}</div>

      <div class="rf-notes">${RF_NOTES.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`;

    box.querySelectorAll('.rf-item').forEach(el=> el.addEventListener('click', ()=>{
      const k=el.dataset.k; const s2=rfEvalStore();
      s2.coches[k]=!s2.coches[k]; save(); draw();
    }));
    box.querySelector('#rfNom').addEventListener('input', e=>{ rfEvalStore().nom=e.target.value; save(); });
    box.querySelector('#rfReset').addEventListener('click', ()=>{
      uiConfirm('Réinitialiser cette évaluation ?', ()=>{ inv().rfEval={nom:'',coches:{}}; save(); draw(); });
    });
  }
  draw();
}

/* Lecteur générique de fiches paginées — même mécanique que le Manifeste, réutilisé
   pour toute page de lecture (patrimoine, charme…) sans dupliquer le code. */
let ficheIdx={};
function renderFicheDeck(wrap, accent, data, key){
  if(ficheIdx[key]===undefined || ficheIdx[key]>=data.length) ficheIdx[key]=0;
  const box=document.createElement('div'); box.className='mn'; box.style.setProperty('--accent',accent);
  box.innerHTML=`<div class="mf-dots" id="fdDots"></div>
    <div class="mf-card" id="fdCard"></div>
    <div class="mf-nav">
      <button class="pm-btn sm" id="fdPrev" type="button">← Précédent</button>
      <span class="mf-pos" id="fdPos"></span>
      <button class="pm-btn sm" id="fdNext" type="button">Suivant →</button>
    </div>`;
  wrap.appendChild(box);
  const $=x=>box.querySelector(x);
  function draw(){
    const i=ficheIdx[key], sec=data[i];
    $('#fdCard').innerHTML=`
      <div class="mf-h">${sec.r?`<span class="mf-r">${esc(sec.r)}</span>`:''}<h4>${esc(sec.t)}</h4></div>
      ${(sec.p||[]).map(t=>`<p>${esc(t)}</p>`).join('')}
      ${sec.li?`<ul class="mf-li">${sec.li.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}`;
    $('#fdPos').textContent=(i+1)+' / '+data.length;
    $('#fdDots').innerHTML=data.map((x,k)=>`<button class="mf-dot${k===i?' on':''}" data-k="${k}" type="button" title="${esc(x.t)}" aria-label="${esc(x.t)}"></button>`).join('');
    $('#fdDots').querySelectorAll('[data-k]').forEach(b=> b.onclick=()=>{ ficheIdx[key]=+b.dataset.k; draw(); });
    $('#fdPrev').disabled = i===0;
    $('#fdNext').disabled = i===data.length-1;
  }
  $('#fdPrev').onclick=()=>{ if(ficheIdx[key]>0){ ficheIdx[key]--; draw(); } };
  $('#fdNext').onclick=()=>{ if(ficheIdx[key]<data.length-1){ ficheIdx[key]++; draw(); } };
  draw();
}
function renderManifest(wrap, accent, onNav){
  if(mfIdx>=MANIFESTE.length) mfIdx=0;
  const box=document.createElement('div'); box.className='mn'; box.style.setProperty('--accent',accent);
  box.innerHTML=`<div class="mf-dots" id="mfDots"></div>
    <div class="mf-card" id="mfCard"></div>
    <div class="mf-nav">
      <button class="pm-btn sm" id="mfPrev" type="button">← Précédent</button>
      <span class="mf-pos" id="mfPos"></span>
      <button class="pm-btn sm" id="mfNext" type="button">Suivant →</button>
    </div>`;
  wrap.appendChild(box);
  const $=x=>box.querySelector(x);

  function draw(){
    const sec=MANIFESTE[mfIdx];
    $('#mfCard').innerHTML=`
      <div class="mf-h"><span class="mf-r">${sec.r}</span><h4>${esc(sec.t)}</h4></div>
      ${(sec.p||[]).map(t=>`<p>${esc(t)}</p>`).join('')}
      ${sec.li?`<ul class="mf-li">${sec.li.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
      ${sec.p2?sec.p2.map(t=>`<p>${esc(t)}</p>`).join(''):''}`;
    $('#mfPos').textContent=(mfIdx+1)+' / '+MANIFESTE.length;
    $('#mfDots').innerHTML=MANIFESTE.map((x,k)=>`<button class="mf-dot${k===mfIdx?' on':''}" data-k="${k}" type="button" title="${esc(x.t)}" aria-label="${esc(x.t)}"></button>`).join('');
    $('#mfDots').querySelectorAll('[data-k]').forEach(b=> b.onclick=()=>{ mfIdx=+b.dataset.k; draw(); });
    $('#mfPrev').disabled = mfIdx===0;
    $('#mfNext').disabled = mfIdx===MANIFESTE.length-1;
    if(onNav) onNav(mfIdx, MANIFESTE.length);
  }
  $('#mfPrev').onclick=()=>{ if(mfIdx>0){ mfIdx--; draw(); } };
  $('#mfNext').onclick=()=>{ if(mfIdx<MANIFESTE.length-1){ mfIdx++; draw(); } };
  draw();
}

/* ---- Conseiller patrimoine & investissement ----
   Principes généraux d'éducation financière, pas des recommandations personnalisées :
   Claude n'est pas conseiller financier, et ce n'en est pas un non plus. */
/* ---- Conseiller patrimoine automatique — même esprit que le budget intelligent :
   des règles générales appliquées à tes chiffres, jamais une recommandation de produit précis. */
function patriStore(){ if(!inv().patrimoine || typeof inv().patrimoine!=='object') inv().patrimoine={}; return inv().patrimoine; }
const PATRI_PROFILS={
  prudent:{l:'Prudent', inv:0.4},
  equilibre:{l:'Équilibré', inv:0.6},
  dynamique:{l:'Dynamique', inv:0.8},
};
function patriCalc(){
  const s=patriStore();
  const depenses=+s.depenses||0, precaution=+s.precaution||0, capacite=+s.capacite||0;
  const profil=PATRI_PROFILS[s.profil]?s.profil:'equilibre';
  const cible=depenses*4;   // milieu de la fourchette usuelle de 3 à 6 mois de dépenses
  const manque=Math.max(0, cible-precaution);
  let versPrecaution, versInvest, versEpargne;
  if(manque>0){
    versPrecaution=Math.min(capacite, manque);
    const reste=capacite-versPrecaution;
    versInvest=reste*PATRI_PROFILS[profil].inv;
    versEpargne=reste-versInvest;
  } else {
    versPrecaution=0;
    versInvest=capacite*PATRI_PROFILS[profil].inv;
    versEpargne=capacite-versInvest;
  }
  return {depenses, precaution, capacite, cible, manque, versPrecaution, versInvest, versEpargne, profil};
}
/* Les 10 objectifs de vie SONT la liste. Rien à ouvrir, rien à modifier :
   ils cadrent tout le reste. Les mini-tâches restent en dessous, elles. */
function renderObjectifsVie(dKey, wrap, accent, stagger){
  stagger = stagger || (el=>el);
  const box=document.createElement('div');
  box.style.setProperty('--accent',accent);
  box.innerHTML=`
    <div class="ov-homme-card">
      <div class="ov-homme-l">L'homme que je dois être</div>
      <p>${esc(HOMME_CIBLE)}</p>
    </div>
    ${OBJECTIFS_VIE.map(o=>`
      <div class="ov-row">
        <span class="ov-row-n">${String(o.n).padStart(2,'0')}</span>
        <div class="ov-row-m"><b>${esc(o.t)}</b><p>${esc(o.d)}</p></div>
      </div>`).join('')}`;
  wrap.appendChild(box);

  // Mini-tâches, inchangées : Travail / Perso
  const d=domain(dKey);
  const minis=(d.items||[]).filter(it=>it.mini);
  wrap.appendChild(sectionHeaderMini('Mini-tâches', minis.length));
  const miniKey=dKey+':ov';
  if(minis.length) wrap.appendChild(miniToggleBar(minis, miniKey));
  else if(!MINI_FOLDERS.some(f=>f.k===miniFilter[miniKey])) miniFilter[miniKey]=MINI_FOLDERS[0].k;
  const vus=minis.filter(it=>miniFolder(it)===miniFilter[miniKey]);
  vus.forEach((it,i)=>{
    const couleurCat=miniFolderInfo(miniFolder(it)).c;
    const row=renderItem(it,couleurCat,i+1);
    row.classList.add('mini-row');
    wrap.appendChild(stagger(editMode ? wrapEditable(row, dKey, it) : wrapDeletable(row, dKey, it, {rename:true})));
  });
  if(!minis.length){ const e=document.createElement('div'); e.className='mini-empty'; e.textContent='Aucune mini-tâche.'; wrap.appendChild(e); }
  else if(!vus.length){ const e=document.createElement('div'); e.className='mini-empty'; e.textContent='Aucune mini-tâche dans cette catégorie.'; wrap.appendChild(e); }
  const ma=document.createElement('div'); ma.className='edit-add-row';
  ma.innerHTML=`<button class="edit-add tangerine" type="button" style="--cat:${miniFolderInfo(miniFilter[miniKey]).c}">+ Ajouter une mini-tâche · ${esc(miniFolderInfo(miniFilter[miniKey]).l)}</button>`;
  ma.querySelector('button').addEventListener('click', ()=> openItemEditor(dKey, null, {mini:true, folder:miniFilter[miniKey]}));
  wrap.appendChild(ma);
}

/* ---- Consommer moins, mieux : quotas hebdomadaires stricts ----
   Une œuvre ne compte que si tu peux dire ce que tu en retiens. Quota atteint = fermé,
   pas de dépassement possible. La semaine repart le lundi. */
function semaineKey(){ return weekKeys()[0]; }   // le lundi identifie la semaine
function renderPatrimoinePage(wrap, accent){
  const box=document.createElement('div'); box.className='patri'; box.style.setProperty('--accent',accent);
  wrap.appendChild(box);
  function draw(){
    const c=patriCalc();
    box.innerHTML=`
      <div class="cd-exam">
        <div class="cd-exam-h"><span class="cd-exam-ic">🧭</span>
          <div><b>Conseiller automatique</b><small>Des règles générales appliquées à tes chiffres — pas une recommandation personnalisée.</small></div></div>
        <div class="bg-fields">
          <label>Dépenses mensuelles<div class="numfield"><input type="number" min="0" id="paDep" value="${c.depenses||''}" placeholder="0"><span class="unit">€</span></div></label>
          <label>Épargne de précaution actuelle<div class="numfield"><input type="number" min="0" id="paPre" value="${c.precaution||''}" placeholder="0"><span class="unit">€</span></div></label>
          <label>Capacité d'épargne ce mois<div class="numfield"><input type="number" min="0" id="paCap" value="${c.capacite||''}" placeholder="0"><span class="unit">€</span></div></label>
        </div>
        <div class="ledger-label">Profil</div>
        <div class="patri-profils">${Object.keys(PATRI_PROFILS).map(k=>`
          <button class="pm-btn sm${c.profil===k?' on':''}" data-profil="${k}" type="button">${PATRI_PROFILS[k].l}</button>`).join('')}</div>
        ${c.capacite?`<div class="patri-result">
          <div class="ledger-label">Répartition suggérée ce mois</div>
          ${c.manque>0?`<div class="bg-info">Ton épargne de précaution vise ${fmtEur(c.cible)} (4 mois de dépenses) — il manque ${fmtEur(c.manque)}. Tant qu'elle n'est pas atteinte, elle passe avant l'investissement.</div>`:''}
          <div class="patri-bars">
            ${c.versPrecaution>0?`<div class="patri-b"><span>Épargne de précaution</span><b>${fmtEur(c.versPrecaution)}</b></div>`:''}
            ${c.versInvest>0?`<div class="patri-b"><span>Investissement diversifié</span><b>${fmtEur(c.versInvest)}</b></div>`:''}
            ${c.versEpargne>0?`<div class="patri-b"><span>Épargne disponible</span><b>${fmtEur(c.versEpargne)}</b></div>`:''}
          </div>
        </div>`:''}
      </div>
      <div id="paFiches"></div>`;
    const $=s=>box.querySelector(s);
    ['paDep','paPre','paCap'].forEach(id=>{
      $('#'+id).addEventListener('input', e=>{
        const k={paDep:'depenses',paPre:'precaution',paCap:'capacite'}[id];
        patriStore()[k]=e.target.value; save();
      });
      $('#'+id).addEventListener('blur', draw);
    });
    box.querySelectorAll('[data-profil]').forEach(b=> b.onclick=()=>{
      patriStore().profil=b.dataset.profil; save(); draw();
    });
    renderFicheDeck($('#paFiches'), accent, PATRIMOINE.concat(FINANCE_NOTES), 'patrimoine');
  }
  draw();
}

ernée.", "Éponger / contenir l'eau.", "Documenter : photos / vidéos, heure et origine supposée.", "Qui appeler : plombier, propriétaire / syndic, assurance habitation (sous 5 jours).", "À ne pas faire : ignorer une petite fuite, attendre que « ça sèche »."]}, {"t": "Panne de chauffage / eau chaude", "li": ["Vérifications rapides : thermostat, pression chaudière, disjoncteur, gaz ouvert.", "Qui appeler : propriétaire / syndic, chauffagiste, SAV si contrat d'entretien."]}, {"t": "Panne internet / téléphone", "li": ["Redémarrer box + routeur.", "Tester avec un autre appareil.", "Vérifier les voyants.", "Qui appeler : fournisseur internet. Vérifier s'il y a une panne réseau locale."]}, {"t": "Électroménager en panne", "li": ["Avant d'appeler : vérifier prise + disjoncteur, lire le code erreur, nettoyer filtres / joints.", "Qui appeler : SAV si sous garantie, réparateur local. Envisager le remplacement si trop ancien."]}, {"t": "Incendie / odeur de brûlé", "p": ["Urgence absolue."], "li": ["Couper gaz / électricité.", "Quitter le logement.", "Appeler le 18 ou le 112.", "À ne jamais faire : rentrer chercher des objets, utiliser de l'eau sur un feu électrique."]}, {"t": "Porte claquée / serrure bloquée", "li": ["Vérifier si un double existe.", "Ne jamais forcer.", "Qui appeler : serrurier — demander un devis AVANT."]}, {"t": "Déclaration & suivi", "li": ["À conserver : factures, devis, rapports d'intervention, échanges mails / SMS.", "Délais importants : assurance 5 jours ouvrés. Dégâts graves : immédiat."]}], "eauelec": [{"t": "Eau — réduire la consommation", "li": ["Douche plutôt que bain : 5–10 min max → 30–50 L par douche contre 150–200 L pour un bain.", "Robinets : fermer l'eau pendant le brossage des dents / la vaisselle.", "Économiseurs / aérateurs de robinet : réduisent le débit sans perdre en pression.", "WC : installer un double flush si possible.", "Machine à laver / lave-vaisselle : remplir complètement avant de lancer, privilégier les cycles éco."]}, {"t": "Chauffage — optimiser et réduire", "li": ["Baisser la température : 19 °C dans les pièces à vivre, 16–17 °C dans les chambres.", "Programmer le chauffage : éviter de chauffer quand personne n'est là.", "Isolation : vérifier portes, fenêtres, volets ; calfeutrer si besoin.", "Rideaux / stores : ouverts en journée pour profiter du soleil, fermés la nuit pour garder la chaleur.", "Entretien : purger les radiateurs et vérifier la chaudière régulièrement."]}, {"t": "Électricité — consommation intelligente", "li": ["Éteindre plutôt que veille : lampes, appareils, téléviseurs, ordinateurs.", "Ampoules LED : consomment 5 à 10 fois moins que les anciennes ampoules.", "Appareils électroménagers : utiliser les cycles éco, débrancher les chargeurs inutilisés.", "Four / micro-ondes : privilégier le micro-ondes pour les petites portions, moins énergivore.", "Réfrigérateur / congélateur : 4–5 °C pour le frigo, –18 °C pour le congélateur. Ne pas ouvrir souvent et laisser refroidir les aliments chauds avant de stocker.", "Multiprises avec interrupteur : couper plusieurs appareils en même temps."]}], "secu": [{"t": "Sécurité des accès", "li": ["Porte d'entrée bien fermée (à clé, pas juste claquée).", "Serrure en bon état.", "Fenêtres fermées en mon absence.", "Porte palière jamais bloquée."]}, {"t": "Clés", "li": ["1 double chez une personne de confiance.", "Jamais étiquetées avec mon adresse.", "Pas cachées à l'extérieur."]}, {"t": "Incendie & gaz", "li": ["Équipements obligatoires : détecteur de fumée fonctionnel, extincteur (si possible), couverture anti-feu (cuisine).", "Ne pas surcharger les multiprises.", "Ne jamais laisser une flamme sans surveillance.", "Fermer le gaz après usage prolongé.", "Nettoyer hotte et plaques.", "À ne jamais faire : bougies sans surveillance, appareils défectueux branchés, sécher du linge sur un radiateur."]}, {"t": "Électricité", "li": ["Pas de multiprises en cascade.", "Câbles non abîmés.", "Appareils débranchés en cas d'absence prolongée.", "Disjoncteur accessible et identifié."]}, {"t": "Eau & inondation", "li": ["Repérer l'arrivée d'eau générale.", "Vérifier joints, flexibles, siphons.", "Ne pas laisser la machine à laver tourner en mon absence."]}, {"t": "Fenêtres & balcons", "li": ["Garde-corps solides.", "Rien à escalader à proximité.", "Pas d'objets lourds exposés au vent.", "Stores et volets en bon état."]}, {"t": "Voisinage & environnement", "li": ["Connaître au moins un voisin.", "Repérer les sorties de secours.", "Lire les affichages du syndic.", "À éviter : ouvrir à un inconnu sans vérification, donner des infos personnelles, signaler une absence sur les réseaux."]}, {"t": "Situation suspecte", "li": ["Si tu entends ou vois quelque chose : ne pas intervenir seul, ne pas confronter, appeler le 17 (police) en cas de doute sérieux.", "Si quelqu'un sonne : regarder par l'œilleton, ne jamais ouvrir sans certitude, demander à passer par le syndic."]}, {"t": "Absence prolongée", "li": ["Fermer eau / gaz.", "Débrancher les appareils.", "Simuler une présence (lumière, volets).", "Prévenir un voisin de confiance."]}, {"t": "Réflexes personnels & assurance", "li": ["Téléphone toujours chargé.", "Numéros d'urgence enregistrés.", "Lampe torche accessible.", "Clés toujours au même endroit.", "Assurance habitation active.", "Savoir quoi déclarer.", "Photos de l'état du logement.", "Inventaire des objets importants."]}], "secours": [{"t": "Protocole général ABCDE", "li": ["A — Airway (voies aériennes) : vérifier si la victime respire, dégager les voies aériennes.", "B — Breathing (respiration) : surveiller la respiration, insufflation, respiration artificielle si nécessaire.", "C — Circulation : contrôler pouls, saignements, signes de choc, compression hémorragique.", "D — Disability (conscience / neurologique) : évaluer l'état mental, la réponse aux stimuli.", "E — Exposure (exposition / environnement) : protéger du froid/chaleur, observer les blessures invisibles."]}, {"t": "Signes vitaux à connaître", "li": ["Pouls (radial, carotidien).", "Fréquence respiratoire.", "Tension artérielle (si matériel disponible).", "Saturation en oxygène (SpO₂ si oxymètre).", "Température corporelle.", "Niveau de conscience (AVPU : Alert, Verbal, Pain, Unresponsive)."]}, {"t": "Réanimation cardio-pulmonaire (RCP)", "li": ["Adultes : 30 compressions / 2 insufflations.", "Bébé/enfant : 15/2 (selon formation).", "Technique : mains au centre du thorax, 5–6 cm de profondeur, rythme 100–120/min.", "Défibrillateur automatique externe (DAE) : savoir placer les électrodes et suivre les instructions."]}, {"t": "Obstruction des voies aériennes", "li": ["Adultes : Heimlich ou compressions abdominales.", "Bébé/enfant : tapotements dans le dos et compressions thoraciques.", "Victime inconsciente : dégager la bouche, RCP si nécessaire."]}, {"t": "Hémorragies", "li": ["Compression directe sur la plaie.", "Élévation du membre.", "Utilisation d'un garrot si saignement majeur.", "Pansement compressif pour les plaies graves."]}, {"t": "Choc et brûlures", "li": ["Choc : allonger la victime, maintenir la chaleur, surveiller signes vitaux et respiration.", "Brûlures : refroidir sous eau froide 10–20 min, retirer bijoux/ceintures, pansement stérile non adhésif, ne pas percer les cloques."]}, {"t": "Fractures et traumatismes", "li": ["Immobilisation avec attelles ou objets rigides.", "Ne jamais repositionner un os fracturé en cas de trauma sévère.", "Transport sûr vers un établissement médical."]}, {"t": "Crises médicales spécifiques", "li": ["Crise cardiaque / infarctus : rester calme, alerter les secours, position semi-assise, aspirine si disponible.", "AVC : FAST — Face, Arm, Speech, Time (visage, bras, parole, temps).", "Crise d'épilepsie : protéger la tête, ne pas restreindre les mouvements, surveiller la durée.", "Diabète (hypo/hyperglycémie) : sucre rapide si conscient, éviter toute alimentation orale si inconscient."]}, {"t": "Urgences environnementales", "li": ["Hypothermie : réchauffer graduellement, éviter /* Rappels ménagers : tâches hebdomadaires simples, remises à zéro chaque semaine. */
const RAPPELS_MENAGERS=[
  "Poussière (salon/chambre)","Sols","Douche / baignoire","Joints & calcaire","WC",
  "Dégraisser les plaques","Laver le micro-ondes","Nettoyer le filtre de l'aspirateur","Évier & miroir",
];
function rappelsStore(){ const s=inv(); if(!s.rappelsMenagers || typeof s.rappelsMenagers!=='object') s.rappelsMenagers={}; const k=semaineKey(); if(!Array.isArray(s.rappelsMenagers[k])) s.rappelsMenagers[k]=[]; return s.rappelsMenagers[k]; }
function renderRappelsMenagers(host, accent){
  host.style.setProperty('--accent', accent||'var(--gold)');
  function draw(){
    const done=rappelsStore();
    host.innerHTML=`<p class="qt-intro">Remis à zéro chaque lundi.</p>
      ${RAPPELS_MENAGERS.map((t,i)=>{ const on=done.indexOf(i)>=0;
        return `<div class="row${on?' checked':''}" data-r="${i}" style="cursor:pointer">
          <div class="checkbox">${on?checkSvg():''}</div><div class="rlabel">${esc(t)}</div></div>`;
      }).join('')}`;
    host.querySelectorAll('[data-r]').forEach(el=> el.addEventListener('click', ()=>{
      const i=+el.dataset.r, arr=rappelsStore(), pos=arr.indexOf(i);
      if(pos>=0) arr.splice(pos,1); else arr.push(i);
      save(); draw();
    }));
  }
  draw();
}

];
const GROOMING_SOIR=[
  {t:"Nettoyant visage", ic:"🧴"},
  {t:"Crème hydratante riche", ic:"💧"},
  {t:"Masque hydratant ou purifiant (1×/semaine)", ic:"🎭"},

function groomingStore(){ const s=inv(); if(!s.grooming || typeof s.grooming!=='object') s.grooming={}; const k=todayKey(); if(!s.grooming[k]) s.grooming[k]={matin:[],soir:[]}; return s.grooming[k]; }
/* Les étapes elles-mêmes sont désormais modifiables : on les matérialise une seule fois
   à partir de la liste d'origine, puis elles vivent comme n'importe quelle liste éditable. */
function groomingListeStore(){
  const s=inv();
  if(!s.groomingListe || !Array.isArray(s.groomingListe.matin) || !Array.isArray(s.groomingListe.soir)){
    s.groomingListe = {
      matin: GROOMING_MATIN.map((e,i)=>({id:'m'+i, txt:e.t, ic:e.ic})),
      soir:  GROOMING_SOIR.map((e,i)=>({id:'s'+i, txt:e.t, ic:e.ic})),
    };
  }
  return s.groomingListe;
}
function renderGrooming(host, accent){
  host.style.setProperty('--accent', accent||'var(--gold)');
  /* On n'affiche que le moment pertinent : le matin jusqu'à 17h, le soir ensuite.
     Un bouton permet de basculer manuellement si besoin. */
  let vue = null;   // null = on suit l'heure
  function momentAuto(){ return new Date().getHours() < 17 ? 'matin' : 'soir'; }
  function draw(){
    const cle = vue || momentAuto();
    const st = groomingStore();
    const liste = groomingListeStore()[cle];
    const faits = st[cle].length;
    const autre = cle==='matin' ? 'soir' : 'matin';

    host.innerHTML='';
    const head=document.createElement('div');
    head.className='gr-head';
    head.innerHTML=`<div class="gr-h-l"><b>${cle==='matin'?'Matin':'Soir'}</b>
        <small>${faits}/${liste.length}${liste.length && faits===liste.length?' ✓':''}</small></div>
      <button class="pm-btn sm" id="grSwap" type="button">Voir le ${autre}</button>`;
    host.appendChild(head);

    liste.forEach((etape)=>{
      const on = st[cle].indexOf(etape.id)>=0;
      const row=document.createElement('div');
      row.className='row gr-row'+(on?' checked':'');
      // Renfort visuel direct, en plus de la classe CSS : impossible à manquer une fois coché.
      if(on){ row.style.background='color-mix(in srgb, var(--accent, var(--gold)) 10%, transparent)'; }
      row.innerHTML=`<div class="checkbox">${on?checkSvg():''}</div>
        <span class="gr-ic">${etape.ic||''}</span>
        <div class="rlabel">${esc(etape.txt)}</div>
        <button class="gr-edit" data-edit="${etape.id}" type="button" aria-label="Modifier">✎</button>
        <button class="nb-del" data-del="${etape.id}" type="button" aria-label="Supprimer">×</button>`;
      row.querySelector('.rlabel').addEventListener('click', ()=>{
        const arr=groomingStore()[cle], idx=arr.indexOf(etape.id);
        if(idx>=0) arr.splice(idx,1); else arr.push(etape.id);
        save(); draw();
      });
      row.querySelector('.checkbox').addEventListener('click', ()=>{
        const arr=groomingStore()[cle], idx=arr.indexOf(etape.id);
        if(idx>=0) arr.splice(idx,1); else arr.push(etape.id);
        save(); draw();
      });
      row.querySelector('[data-edit]').addEventListener('click', e=>{
        e.stopPropagation();
        uiPrompt("Modifier l'étape", etape.txt, v=>{
          const t=(v||'').trim(); if(!t) return;
          etape.txt=t; save(); draw();
        });
      });
      row.querySelector('[data-del]').addEventListener('click', e=>{
        e.stopPropagation();
        const gl=groomingListeStore();
        gl[cle]=gl[cle].filter(x=>x.id!==etape.id);
        groomingStore()[cle]=groomingStore()[cle].filter(id=>id!==etape.id);
        save(); draw();
      });
      host.appendChild(row);
    });
    if(!liste.length){
      const e=document.createElement('div'); e.className='mini-empty'; e.textContent='Aucune étape pour ce moment.';
      host.appendChild(e);

function meublesStore(){ if(!inv().meubles || typeof inv().meubles!=='object') inv().meubles={}; return inv().meubles; }
function renderMeubles(host, accent){
  host.style.setProperty('--accent', accent||'var(--gold)');
  function draw(){
    const st=meublesStore();
    let total=0, achete=0;
    MEUBLES_LISTE.forEach(g=> g.items.forEach(it=>{ total+=it.prix; if(st[it.t]) achete+=it.prix; }));
    host.innerHTML=`<div class="ledger-label">Budget</div>
      <div class="me-total"><b>${fmtEur(achete)}</b> acheté sur <b>${fmtEur(total)}</b> · reste ${fmtEur(total-achete)}</div>
      ${MEUBLES_LISTE.map(g=>`
        <div class="ledger-label">${esc(g.grp)}</div>
        ${g.items.map(it=>{ const on=!!st[it.t];
          return `<div class="row${on?' checked':''}" data-m="${esc(it.t)}" style="cursor:pointer">
            <div class="checkbox">${on?checkSvg():''}</div>
            <div class="rlabel">${esc(it.t)}<span class="note">${esc(it.aff||fmtEur(it.prix))}</span></div></div>`;
        }).join('')}`).join('')}`;
    host.querySelectorAll('[data-m]').forEach(el=> el.addEventListener('click', ()=>{
      const k=el.dataset.m, st2=meublesStore(); st2[k]=!st2[k]; save(); draw();
    }));
  }
  draw();
}

/* Un seul module Maison : des bulles à cliquer, le contenu s'affiche juste en dessous —
   changer de catégorie ne recharge jamais de page. */
let maisonCat=null;
function renderMaison(wrap, accent){
  const box=document.createElement('div'); box.className='mz'; box.style.setProperty('--accent',accent);
  wrap.appendChild(box);
  box.innerHTML=`<div class="mz-bulles" id="mzBulles"></div><div id="mzPanel"></div>`;
  const bulles=box.querySelector('#mzBulles'), panel=box.querySelector('#mzPanel');

  function drawBulles(){
    bulles.innerHTML=MAISON_CATS.map(c=>`
      <button class="mz-bulle${maisonCat===c.k?' on':''}" data-b="${c.k}" type="button">
        <span class="mz-ic">${c.ic}</span><span class="mz-l">${esc(c.l)}</span>
      </button>`).join('');
    bulles.querySelectorAll('[data-b]').forEach(b=> b.onclick=()=>{
      maisonCat = (maisonCat===b.dataset.b) ? null : b.dataset.b;
      drawBulles(); drawPanel();
      if(maisonCat){ panel.scrollIntoView({behavior:'smooth', block:'nearest'}); }
    });
  }
  function drawPanel(){
    panel.innerHTML='';
    if(!maisonCat) return;
    const c=MAISON_CATS.find(x=>x.k===maisonCat); if(!c) return;
    const card=document.createElement('div'); card.className='mz-card';
    card.innerHTML=`<div class="mz-card-h"><b>${esc(c.l)}</b></div><div id="mzInner"></div>`;
    panel.appendChild(card);
    const inner=card.querySelector('#mzInner');
    if(c.type==='rappels') renderRappelsMenagers(inner, accent);
    else if(c.type==='grooming') renderGrooming(inner, accent);
    else if(c.type==='meubles') renderMeubles(inner, accent);
    else renderFicheDeck(inner, accent, MAISON_FICHES[c.k]||[], 'maison_'+c.k);
  }
  drawBulles(); drawPanel();
}

/* Conclusion du bilan : lit tes réponses et en tire une lecture + des pistes */
function pilotConclusion(cur){
  const val=id=>{ const v=cur[id]; return (v===undefined||v==='')?null:v; };
  const num=id=>{ const v=val(id); return typeof v==='number'?v:null; };
  const oui=id=>val(id)==='oui';
  const non=id=>val(id)==='non';

  let repondu=0, scores=[], ouis=0, nons=0;
  PILOT_Q.forEach(q=>{
    const v=val(q.id); if(v===null) return; repondu++;
    if(typeof v==='number') scores.push(v);
    else if(v==='oui') ouis++; else if(v==='non') nons++;
  });
  if(repondu<3) return null;

  const moy = scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : null;
  const tauxOui = (ouis+nons) ? ouis/(ouis+nons) : null;
  // note globale sur 10, mêlant jauges et oui/non
  let global;
  if(moy!==null && tauxOui!==null) global=(moy + tauxOui*10)/2;
  else if(moy!==null) global=moy;
  else global=tauxOui*10;

  const titre = global>=7.5 ? 'Semaine solide'
              : global>=5.5 ? 'Semaine correcte'
              : global>=3.5 ? 'Semaine en demi-teinte'
                            : 'Semaine difficile';
  const intro = global>=7.5 ? "Tu as tenu le cap. L'enjeu maintenant n'est pas d'en faire plus, c'est de reproduire ce qui a marché."
              : global>=5.5 ? "Rien d'alarmant, mais rien de décisif non plus. Une ou deux corrections suffiraient à changer le ton de la semaine."
              : global>=3.5 ? "La semaine a tiré dans plusieurs directions. Vise une seule correction, pas cinq."
                            : "Semaine dure. Ne cherche pas à tout redresser d'un coup : choisis le point qui débloque le reste.";

  // On récolte toutes les pistes avec un poids de gravité, puis on ne garde
  // que les 4 plus urgentes — sinon les dernières ne sortiraient jamais.
  const cand=[];
  const add=(w,t,d)=>{ cand.push({w,t,d}); };
  const manque=id=>{ const v=num(id); return v===null?0:Math.max(0,5-v); };

  if(non('2'))            add(6,   'Réaligne ta direction', "Tu t'es senti hors-cap. Demain matin, relis ton Manifeste avant toute autre chose, puis choisis UNE action de la semaine qui va dans son sens. Un cap ne se retrouve pas en réfléchissant, mais en faisant un pas dans la bonne direction.");
  if(manque('0'))         add(manque('0')+2, 'Productivité en baisse', "Donne le premier créneau de ta journée à ton objectif le plus important — avant les messages, avant l'administratif. Si tu n'as qu'une heure de vraie concentration, elle doit aller là. Et ferme les onglets qui n'y servent pas.");
  if(manque('1'))         add(manque('1')+2, 'Énergie mal employée', "Ouvre ta page Santé et regarde tes notes sommeil et activité : elles expliquent l'essentiel des semaines molles. Cette semaine, vise une heure de coucher fixe et 10 min de marche au réveil. C'est plus efficace que d'essayer de te motiver.");
  if(manque('4'))         add(manque('4')+2, 'Objectifs non atteints', "Tes objectifs sont probablement trop gros pour une semaine. Découpe le plus bloqué en mini-tâches qui tiennent en une session de 45 min. Un objectif qu'on ne sait pas commencer est un objectif mal formulé.");
  if(non('5'))            add(4,   'Tu portes trop', "Tu n'as rien lâché cette semaine. Choisis une chose à supprimer d'ici dimanche prochain : un projet en veille, un engagement pris par politesse, une habitude qui ne sert plus. Le vide que tu crées, c'est de l'énergie pour le reste.");
  if(non('r5')||non('r6'))add(5.5, 'Relations en retrait', "Envoie un message aujourd'hui à une personne, sans raison particulière, et propose une date précise plutôt qu'un « on se voit bientôt ». Ta page Sorties existe pour ne pas avoir à chercher quoi proposer. Le lien tient par la fréquence, pas par l'intensité.");
  if(non('r1')&&non('r4'))add(4.5, 'Zone de confort', "Choisis dès maintenant une action inconfortable pour cette semaine, et note-la. Pas trois : une. Ton manifeste le dit — l'audace est une habitude, et chaque action courageuse en appelle une autre.");
  if(manque('e1'))        add(manque('e1')+1.5, 'Dispersion', "Liste tes activités de la semaine et demande-toi pour chacune : est-ce que ça sert un de mes 5 objectifs ou une personne qui compte ? Ce qui ne rentre dans aucune des deux cases sort du calendrier.");
  if(non('o2'))           add(3.5, 'Un obstacle persiste', "Identifie l'obstacle qui, s'il tombait, ferait tomber les autres — pas le plus visible, le plus bloquant. Consacre-lui la première heure de lundi, même partiellement. Un obstacle qu'on contourne chaque semaine coûte plus cher qu'une matinée pour le lever.");
  if(manque('p4'))        add(manque('p4')+1, 'Tu vis dans l’après', "Réserve un moment par jour sans écran ni objectif : un repas, une marche, une conversation. Rien à optimiser, rien à en tirer. C'est ce qui empêche une vie pleine de devenir une vie subie.");
  if(non('3'))            add(3,   'Fierté absente', "Écris trois choses que tu as réellement faites cette semaine, même petites. On sous-estime systématiquement ce qu'on accomplit parce qu'on ne compare qu'à ce qui reste à faire.");
  if(manque('f2'))        add(manque('f2')+1, 'Vie peu alignée', "Repère une activité récurrente qui ne sert ni tes objectifs ni tes proches, et retire-la du calendrier cette semaine. L'alignement se gagne en soustrayant, rarement en ajoutant.");
  if(non('d1'))           add(2.5, 'Rien donné cette semaine', "Fais un geste pour quelqu'un : une aide concrète, une recommandation, un message qui remonte le moral. C'est le levier d'humeur le plus sous-estimé, et le plus rapide.");
  if(manque('r2'))        add(manque('r2')+1, 'Les revers t’atteignent', "Un revers est une information, pas un jugement. Écris ce que celui de cette semaine t'apprend concrètement, puis ce que tu fais différemment. Sans cette étape, l'échec ne coûte que du moral.");
  if(manque('p1')||manque('p2')) add(2, 'Peu de plaisir pris', "Programme une chose que tu attends avec envie, cette semaine, à une date fixée. Une semaine sans aucun plaisir prévu est une semaine qu'on traverse au lieu de la vivre.");
  if(manque('d3'))        add(2, 'Recentré sur toi', "Prends des nouvelles de deux personnes sans parler de toi. L'attention portée aux autres est ce qui distingue la présence du monologue — ton manifeste en fait un pilier du rayonnement.");

  const pistes = cand.sort((a,b)=>b.w-a.w).slice(0,4).map(x=>({t:x.t,d:x.d}));

  if(!pistes.length){
    pistes.push({t:'Ce qui a marché', d:"Écris dans Notes ce qui a rendu cette semaine bonne. Une semaine réussie qu'on n'analyse pas ne se reproduit pas."});
    pistes.push({t:'Monte d’un cran', d:"Puisque la base tient, ajoute un objectif exigeant à ta phase en cours — un seul."});
  }
  return { titre, intro, global, pistes, repondu, total:PILOT_Q.length };
}

let pilotAll=false;
function plFormat(v){
  if(v==='oui') return 'Oui';
  if(v==='non') return 'Non';
  if(typeof v==='number') return v+'/10';
  return String(v);
}
function plConclusionHtml(cur){
  const c=pilotConclusion(cur);
  if(!c) return `<div class="pl-concl vide">Réponds à quelques questions : une conclusion et des pistes apparaîtront ici.</div>`;
  return `<div class="pl-concl">
    <div class="pl-concl-h">
      <div><div class="pl-concl-t">${esc(c.titre)}</div><div class="pl-concl-s">${c.repondu} réponse${c.repondu>1?'s':''} sur ${c.total}</div></div>
      <div class="pl-concl-n" style="color:${santeColor(c.global)}">${c.global.toFixed(1)}<small>/10</small></div>
    </div>
    <p class="pl-concl-i">${esc(c.intro)}</p>
    <div class="ledger-label">Pour la semaine qui vient</div>
    ${c.pistes.map(p=>`<div class="pl-piste"><b>${esc(p.t)}</b><span>${esc(p.d)}</span></div>`).join('')}
  </div>`;
}

function plWidget(x, v){
  if(x.t==='bool'){
    return `<div class="pl-q pl-line">
      <span class="pl-lbl">${esc(x.q)}</span>
      <span class="pl-yn">
        <button type="button" class="${v==='oui'?'on oui':''}" data-k="${x.id}" data-v="oui">Oui</button>
        <button type="button" class="${v==='non'?'on non':''}" data-k="${x.id}" data-v="non">Non</button>
      </span></div>`;
  }
  const n=(typeof v==='number')?v:null;
  return `<div class="pl-q pl-scale">
    <div class="pl-line"><span class="pl-lbl">${esc(x.q)}</span><span class="pl-val" data-k="${x.id}" style="color:${santeColor(n)}">${n===null?'—':n}</span></div>
    <input type="range" min="0" max="10" step="1" value="${n===null?5:n}" data-k="${x.id}" class="sn-range${n===null?' vierge':''}" style="--c:${santeColor(n===null?5:n)}">
  </div>`;
}
function weekIndex(wk){
  // numéro de semaine stable, pour faire tourner les sections
  const d=new Date(wk+'T12:00:00');
  const start=new Date(d.getFullYear(),0,1);
  return Math.floor((d-start)/(7*86400000));
}
function renderPilotage(wrap, accent){
  const wk=weekKeys()[0], store=pilotStore(), cur=store[wk]||(store[wk]={});
  const core=PILOT_SECTIONS[0];
  const pool=PILOT_SECTIONS.slice(1);
  const idx=((weekIndex(wk)%pool.length)+pool.length)%pool.length;
  const rotating=pool[idx];
  const shown = pilotAll ? PILOT_SECTIONS : [core, rotating];

  const box=document.createElement('div'); box.className='pl'; box.style.setProperty('--accent',accent);
  box.innerHTML=`<div class="pl-head">Semaine du ${esc(fmtDate(Date.parse(wk+'T12:00:00')))}</div>`
    + (pilotAll?'':`<div class="pl-rot">Thème de la semaine · <b>${esc(rotating.t)}</b> — les autres reviendront les semaines suivantes.</div>`)
    + shown.map(s=>`
      <div class="pl-sec">
        <div class="ledger-label">${esc(s.t)}${(!pilotAll && s===rotating)?' <span class="pl-badge">cette semaine</span>':''}</div>
        ${s.note?`<div class="pl-note">${esc(s.note)}</div>`:''}
        ${s.qs.map(x=>plWidget(x, cur[x.id])).join('')}
      </div>`).join('')
    + `<div class="edit-add-row"><button class="edit-add" id="plToggle" type="button">${pilotAll?'↑ Revenir à l’essentiel':'↓ Afficher toutes les questions ('+PILOT_Q.length+')'}</button></div>`
    + plConclusionHtml(cur);
  wrap.appendChild(box);
  // oui / non
  box.querySelectorAll('.pl-yn button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const k=b.dataset.k, v=b.dataset.v;
      cur[k] = (cur[k]===v) ? '' : v;      // recliquer annule
      save(); render();
    });
  });
  // jauges
  box.querySelectorAll('.pl-scale input').forEach(r=>{
    r.addEventListener('input', ()=>{
      cur[r.dataset.k]=+r.value;
      const out=box.querySelector('.pl-val[data-k="'+r.dataset.k+'"]');
      if(out){ out.textContent=r.value; out.style.color=santeColor(+r.value); }
      r.style.setProperty('--c', santeColor(+r.value));
      save();
    });
  });
  box.querySelector('#plToggle').addEventListener('click', ()=>{ pilotAll=!pilotAll; render(); });

  // Santé & ressenti vit ici désormais, à la semaine plutôt qu'au jour.
  wrap.appendChild(ledgerLabel('Santé & ressenti de la semaine'));
  renderSante(wrap, accent);

  const answered=w=>PILOT_Q.some(x=>store[w] && store[w][x.id]!==undefined && store[w][x.id]!=='');
  const past=Object.keys(store).filter(k=>k!==wk && answered(k)).sort().reverse();
  if(past.length){
    const p=document.createElement('div'); p.className='pl-past';
    p.innerHTML=`<div class="ledger-label">Semaines précédentes</div>`+past.map(k=>`<details class="pl-old"><summary>${esc(fmtDate(Date.parse(k+'T12:00:00')))}</summary>${PILOT_Q.map(x=> (store[k][x.id]!==undefined && store[k][x.id]!=='')?`<div class="pl-oldq"><b>${esc(x.q)}</b><p>${esc(plFormat(store[k][x.id]))}</p></div>`:'').join('')}</details>`).join('');
    wrap.appendChild(p);
  }
}

const EXAM_SEUIL=35;   // seuil de réussite du vrai examen du Code : 35/40, soit 5 fautes maximum
const EXAM_COUNT=12;   // 12 examens blancs distincts, chacun rejouable, chacun suivi séparément

function codeStoreExams(n){
  const st=codeStore();
  if(!st.examens || typeof st.examens!=='object' || Array.isArray(st.examens)){
    const old = Array.isArray(st.examens) ? st.examens : [];
    st.examens = {}; if(old.length) st.examens[0]=old;   // migration douce d'un ancien format
  }
  if(!Array.isArray(st.examens[n])) st.examens[n]=[];
  return st.examens[n];
}
/* PRNG déterministe : le même numéro d'examen redonne toujours les mêmes 40 questions,
   pour qu'un nouvel essai soit comparable au précédent — comme une vraie série d'examens blancs. */
function mulberry32(seed){
  return function(){
    let t=seed+=0x6D2B79F5;
    t=Math.imul(t^t>>>15, t|1);
    t^=t+Math.imul(t^t>>>7, t|61);
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function examQuestions(n){
  const pool=[];
  CODE_QUIZ.forEach((qs,ti)=> qs.forEach((x,k)=> pool.push({q:x.q,v:x.v,e:x.e,th:CODE_THEMES[ti]})));
  const rnd=mulberry32(1000+n*97);
  const arr=pool.slice();
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; }
  return arr.slice(0,40);
}

function renderCode(wrap, accent){
  const box=document.createElement('div'); box.className='cd'; box.style.setProperty('--accent',accent);
  wrap.appendChild(box);
  const draw=()=>{
    if(codeVue.mode==='quiz') return drawQuiz(box, accent, draw);
    drawListe(box, accent, draw);
  };
  draw();
}

  box.innerHTML=`
    <div class="phase-head${faits===CODE_THEMES.length?' complete':''}" style="--accent:${accent}">
      <div class="ph-left"><span class="ph-num">Objectif</span><span class="ph-name">Maîtriser les 13 thèmes</span></div>
      <div class="ph-right"><span class="ph-count">${faits}/${CODE_THEMES.length}${faits===CODE_THEMES.length?' ✓':''}</span><div class="ph-bar"><i style="width:${pct}%"></i></div></div>
    </div>
    <div class="ledger-label">Révision quotidienne</div>
    <div class="row habit" style="--accent:${accent}">
      <div class="rlabel">Révision du code<span class="note tag-habit">Habitude · quotidienne</span></div>
      <div class="habit-side">
        <div class="hstrip">${days.map(k=>{const on=habitOn(id,k),t=k===todayKey();
          return `<button class="hcell${on?' on':''}${t?' today':''}" type="button" data-day="${k}"><span>${dayShort(k)}</span></button>`;}).join('')}</div>
        <div class="hmeta">cette semaine · ${done}/7</div>
      </div>
    </div>

    <div class="cd-exam">
      <div class="cd-exam-h"><span class="cd-exam-ic">🎓</span>
        <div><b>Examens blancs</b><small>${EXAM_COUNT} examens de 40 questions tirées de tous les thèmes, comme le vrai passage · reçu à ${EXAM_SEUIL}/40. Chaque examen garde toujours les mêmes questions, pour pouvoir suivre tes progrès dessus.</small></div></div>
      <div class="cd-exam-grid">${Array.from({length:EXAM_COUNT},(_,n)=>{
        const list=codeStoreExams(n);
        const best=list.length?Math.max(...list.map(e=>e.score)):null;
        const admis=best!==null&&best>=EXAM_SEUIL;
        return `<button class="cd-exam-item${best!==null?(admis?' reussi':' tente'):''}" data-exam="${n}" type="button">
          <span class="cd-exam-n">Examen ${n+1}</span>
          <span class="cd-exam-sc">${best!==null?best+'/40'+(admis?' ✓':''):'À faire'}</span>
        </button>`;
      }).join('')}</div>
    </div>

    <div class="ledger-label">Les 13 thèmes · quiz de 40 questions</div>
    <div id="cdList">${CODE_THEMES.map((t,i)=>{
      const ok=!!st.themes['t'+i], best=sc['t'+i];
      return `<div class="cd-th${ok?' ok':''}">
        <button class="cd-box" data-t="${i}" type="button" aria-label="Marquer comme maîtrisé">${ok?'✓':''}</button>
        <div class="cd-main" data-open="${i}"><span class="cd-n">${String(i+1).padStart(2,'0')}</span>
          <span class="cd-l">${esc(t)}<small>40 questions</small></span></div>
        ${best!==undefined?`<span class="cd-score${best>=32?' bon':(best>=24?' moy':'')}">${best}/40</span>`:''}

    codeVue={mode:'quiz', th:i, exam:false, qz:{list:q, idx:0, rep:[], fini:false}};
    draw();

  box.querySelectorAll('[data-exam]').forEach(b=> b.onclick=()=>{

    codeVue={mode:'quiz', th:-1, exam:true, examN:n, qz:{list:examQuestions(n), idx:0, rep:[], fini:false}};
